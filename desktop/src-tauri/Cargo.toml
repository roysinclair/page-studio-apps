[package]
name = "page-aura"
version = "0.1.0"
description = "Page Aura — a secure, bring-your-own-key chat app for Anthropic's Claude models"
authors = ["Roy Sinclair"]
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "page_aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
