# Builds the Page Aura and Page Orbit desktop apps for Windows, macOS (Apple silicon + Intel)
# and Linux. Both apps share one Rust core (desktop/src-tauri); Page Orbit is built with
# --config src-tauri/tauri.orbit.conf.json.
#
# - Make a release: Actions -> "Desktop app" -> Run workflow, type a version such as v0.1.0,
#   and run it. (Pushing a tag like v0.1.0 does the same.) This creates a GitHub
#   Release with the standalone page-aura.html and page-orbit.html, the installers for every
#   system and SHA256 checksums, and publishes it once every build has succeeded.
#   Release notes come from docs/releases/<tag>.md when that file exists.
# - Leave the version empty for a test build: installers appear as artifacts on the run.
#
# Third-party actions are pinned to exact commits (the tag they came from is in the comment).
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (leave empty for a test build without a release)"
        required: false
        default: ""
  push:
    tags: ["v*"]

# Read-only by default; each job that uploads to or edits the release asks for write itself.
permissions:
  contents: read

jobs:
  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release and uploads the standalone pages
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the release and attach the standalone file
        id: create
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "Page Aura & Page Orbit ${TAG}" > /tmp/notes.md; notes=/tmp/notes.md; }
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "Version must look like v0.1.0"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Page Aura & Page Orbit ${TAG}" --notes-file "$notes"
          sha256sum page-aura.html page-orbit.html > SHA256SUMS-standalone.txt
          gh release upload "$TAG" page-aura.html page-orbit.html SHA256SUMS-standalone.txt --clobber
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app == 'orbit' && 'Page Orbit' || 'Page Aura' }} · ${{ matrix.target.name }}
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        app: [aura, orbit]
        target:
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.target.platform }}
    permissions:
      contents: write # tauri-action and `gh release upload` attach installers and checksums to the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target.rust_targets }}

      - name: Linux build dependencies
        if: matrix.target.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop/src-tauri -> target"
          key: ${{ matrix.app }}

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci --ignore-scripts # the Tauri CLI ships prebuilt per-platform binaries; no package here has an install script

      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional automatic updates for Page Aura (see docs/updates.md). Without these,
          # builds simply have no updater. Page Orbit has no update feed yet.
          PAGE_AURA_UPDATER_PUBKEY: ${{ matrix.app == 'aura' && vars.PAGE_AURA_UPDATER_PUBKEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.app == 'aura' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.app == 'aura' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: desktop
          args: ${{ matrix.target.args }} ${{ matrix.app == 'orbit' && '--config src-tauri/tauri.orbit.conf.json' || (vars.PAGE_AURA_UPDATER_PUBKEY != '' && '--config src-tauri/tauri.updater.conf.json' || '') }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: ${{ matrix.app == 'aura' }}

      - name: Checksums
        shell: bash
        run: |
          cd desktop/src-tauri/target
          if command -v sha256sum >/dev/null 2>&1; then hash() { sha256sum "$1"; }; else hash() { shasum -a 256 "$1"; }; fi
          # names match the release downloads (GitHub turns spaces into dots), so `shasum -c` works
          find . -path '*/release/bundle/*' -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) -print0 \
            | while IFS= read -r -d '' f; do (cd "$(dirname "$f")" && n="$(basename "$f")" && echo "$(hash "$n" | cut -d' ' -f1)  ${n// /.}"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt
          for d in $(find . -path '*/release/bundle' -type d); do cp SHA256SUMS.txt "$d/"; done

      - name: Attach checksums to the release
        if: needs.release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="SHA256SUMS-${{ matrix.app == 'orbit' && 'Orbit' || 'Aura' }}-${{ runner.os }}.txt"
          cp desktop/src-tauri/target/SHA256SUMS.txt "$f"
          gh release upload "${{ needs.release.outputs.tag }}" "$f" --clobber

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: page-${{ matrix.app }}-${{ matrix.target.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/
            desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release, build]
    if: needs.release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the draft release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
