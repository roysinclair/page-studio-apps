# Builds Page Aura for Windows, macOS (Apple silicon + Intel) and Linux.
#
# - Run it by hand (Actions -> "Desktop app" -> Run workflow): installers appear as
#   downloadable artifacts on the run.
# - Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`): creates a GitHub
#   Release with the standalone page-aura.html, the installers for every system and
#   SHA256 checksums, and publishes it once every platform has built successfully.
#   Release notes come from docs/releases/<tag>.md when that file exists.
#
# Third-party actions are pinned to exact commits (the tag they came from is in the comment).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create the release and attach the standalone file
        id: create
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "Page Aura ${TAG}" > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Page Aura ${TAG}" --notes-file "$notes"
          sha256sum page-aura.html > SHA256SUMS-standalone.txt
          gh release upload "$TAG" page-aura.html SHA256SUMS-standalone.txt --clobber
          echo "id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      - name: Checksums
        shell: bash
        run: |
          cd desktop/src-tauri/target
          find . -path '*/release/bundle/*' -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) -print0 \
            | while IFS= read -r -d '' f; do (cd "$(dirname "$f")" && shasum -a 256 "$(basename "$f")"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt
          for d in $(find . -path '*/release/bundle' -type d); do cp SHA256SUMS.txt "$d/"; done

      - name: Attach checksums to the release
        if: needs.release.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp desktop/src-tauri/target/SHA256SUMS.txt "SHA256SUMS-${{ runner.os }}.txt"
          gh release upload "${{ github.ref_name }}" "SHA256SUMS-${{ runner.os }}.txt" --clobber

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: page-aura-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/
            desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [release, build]
    if: needs.release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish
        run: gh release edit "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
