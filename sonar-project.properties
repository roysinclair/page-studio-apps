sonar.projectKey=roysinclair_page-studio-apps
sonar.organization=roysinclair

# Scan the whole repository (same scope as Automatic Analysis), minus the exclusions below.
# Orbit is edited in orbit/src and compiled into page-orbit.html by tools/build-orbit.py.
sonar.sources=.

# Generated, vendored or build output:
#  - page-orbit.html is generated from orbit/src
#  - desktop/dist* are copies of the pages made by desktop/scripts/prepare.mjs
#  - node_modules and Rust target are dependencies and build output
# Third-party libraries (marked, DOMPurify, highlight.js, the Anthropic SDK) are embedded
# inline inside page-aura.html by tools/vendor-libs.py and tools/build-sdk.sh. They cannot be
# excluded by file; findings inside the vendor-* script blocks are accepted in SonarCloud.
sonar.exclusions=page-orbit.html,desktop/dist/**,desktop/dist-orbit/**,**/node_modules/**,**/target/**

sonar.sourceEncoding=UTF-8

# Coverage is not imported yet (no test coverage reports are produced in CI), so coverage
# shows as blank. When it is, add e.g. sonar.javascript.lcov.reportPaths and, for Rust,
# sonar.rust.lcov.reportPaths pointing at the generated lcov files.
