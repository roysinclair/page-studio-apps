const DATA_EXT = /\.(xlsx|xlsm|xls|csv|tsv|parquet|sqlite|db|zip|docx|pptx|odt|ods|json|xml)$/i;
async function uploadFile(f){
  const c = getClient(); if(!c) throw new Error("unlock Page Aura first");
  if(f.size > 100*1024*1024) throw new Error("larger than 100 MB");
  const meta = await c.files.upload({file: f});
  return meta.id;
}
async function fileToAttachment(f, chat){
  const type = f.type || "";
  const local = isLocalModel(chat.model);   // local chats never use the Files API (that would send the file to Anthropic)
  if(local && (type==="application/pdf" || /\.pdf$/i.test(f.name) || DATA_EXT.test(f.name))) throw new Error("local models can’t read this kind of file — paste its text instead, or switch to a Claude model");
  if(!local && codeOn(chat) && DATA_EXT.test(f.name)) return {kind:"upload", name:f.name, size:f.size, fileId: await uploadFile(f)};
  if(IMG_TYPES.includes(type) || /\.(png|jpe?g|gif|webp)$/i.test(f.name)){ const {data, mediaType} = await prepareImage(f); return {kind:"image", name:f.name||"image", mediaType, data}; }
  if(type==="application/pdf" || /\.pdf$/i.test(f.name)){
    if(f.size > 30*1024*1024) throw new Error("PDF is larger than 30 MB");
    if(f.size > 5*1024*1024) return {kind:"pdf", name:f.name, size:f.size, fileId: await uploadFile(f)};   // upload once instead of re-sending every turn
    return {kind:"pdf", name:f.name, data: await toBase64(f)};
  }
  if(type.startsWith("image/")) throw new Error("unsupported image type (use PNG, JPEG, GIF or WebP)");
  const text = await f.text();
  if(text.includes("\u0000")){
    if(!local && codeOn(chat)) return {kind:"upload", name:f.name, size:f.size, fileId: await uploadFile(f)};
    throw new Error("this kind of file needs Code & files — turn it on in the Tools menu");
  }
  return {kind:"text", name:f.name||"file.txt", data:text};
}
function toBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
async function prepareImage(f){
  const MAX_EDGE = 2048, MAX_BYTES = 3.7*1024*1024; // stays under the 5 MB base64 limit
  const mediaType0 = IMG_TYPES.includes(f.type) ? f.type : "image/png";
  let bmp; try{ bmp = await createImageBitmap(f); }catch{ return {data: await toBase64(f), mediaType: mediaType0}; }
  const scale = Math.min(1, MAX_EDGE/Math.max(bmp.width,bmp.height));
  if(scale===1 && f.size<=MAX_BYTES) return {data: await toBase64(f), mediaType: mediaType0};
  const c = document.createElement("canvas"); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  let q=0.9, blob;
  do{ blob = await new Promise(r=>c.toBlob(r,"image/jpeg",q)); q-=0.15; } while(blob.size>MAX_BYTES && q>0.3);
  return {data: await toBase64(blob), mediaType:"image/jpeg"};
}

function attachmentsToBlocks(atts, cite){
  const c = cite ? {citations:{enabled:true}} : {};
  return atts.map(a=>{
    if(a.kind==="image") return {type:"image", source:{type:"base64", media_type:a.mediaType, data:a.data}};
    if(a.kind==="upload") return {type:"container_upload", file_id:a.fileId};
    if(a.kind==="pdf")   return {type:"document", title:a.name, source: a.fileId ? {type:"file", file_id:a.fileId} : {type:"base64", media_type:"application/pdf", data:a.data}, ...c};
    return {type:"document", title:a.name, source:{type:"text", media_type:"text/plain", data:a.data}, ...c};
  });
}
async function sendMessage(chat, text, atts){
  const content = [...attachmentsToBlocks(atts, chat.docCitations)];
  content.push({type:"text", text: text || (atts.length===1 ? `(See attached: ${atts[0].name})` : "(See attached files)")});
  const fileNames = {}; for(const a of atts) if(a.fileId){ fileNames[a.fileId] = a.name; (chat.fileIds ||= []).push(a.fileId); }
  chat.messages.push(Object.keys(fileNames).length ? {role:"user", content, fileNames} : {role:"user", content});

function apiHistory(chat){ return chat.messages.filter(m=>!m.excluded).flatMap(m=> m.api ? m.api.map(x=>({role:x.role, content:x.content})) : [{role:m.role, content:m.content}]); }
async function runCompletion(chat){

  entry.rerender = ()=>{ panes.forEach(p=>{ if(p.chatId===chat.id) renderLive(p); }); plSoon(); };

  const parts = local ? {tools:[], betas:[], mcp:[], container:null, extra:[]} : buildRequestParts(chat);
  if(!local) parts.tools.push(...await localToolDefs(chat, entry));

  if(parts.tools.length) base.tools = parts.tools;

  const betas = [...parts.betas];
  if(!local && settings.fallbacks && FALLBACK_MODELS.has(chat.model)){ betas.push("server-side-fallback-2026-07-01"); base.fallbacks = "default"; }
  if(betas.length) base.betas = betas;

  let raf = 0; const schedule = ()=>{ if(!raf) raf = requestAnimationFrame(()=>{ raf=0; entry.rerender(); }); };

          else if(ev.type==="content_block_start"){
            const b = live[ev.index] = structuredClone(ev.content_block);
            if(b.type==="text") b.text ||= ""; if(b.type==="thinking") b.thinking ||= ""; if(/tool_use$/.test(b.type)) b._json = "";
          }

            else if(ev.delta.type==="citations_delta") (b.citations ||= []).push(ev.delta.citation);

        for(const u of uses){
          if(entry.aborted) throw abortErr();

  assistant.content = display;
  if(turnApi.length) assistant.api = [...turnApi, cur];

  if(!assistant.content.length && !assistant.error && !assistant.refusal) assistant.content=[{type:"text",text:"_(empty response)_"}];
  chat.messages.push(assistant);
  plFinished(chat, assistant);
  if(assistant.usage || assistant.toolLog) addSpend(msgCost(assistant) || 0);
  panes.forEach(p=>{ if(p.chatId===chat.id) p.seen = chat.messages.length; }); // live bubble already animated in
  if(DESKTOP && !document.hasFocus()){
    const snippet = msgText(assistant).replace(/[#*_`>\[\]]/g,"").replace(/\s+/g," ").trim();
    invoke("notify",{title: assistant.error? `Couldn’t finish: ${chat.title}` : chat.title, body: snippet || (assistant.error ? assistant.error : "Reply ready")}).catch(()=>{});

}
function describeError(err){
  if(err instanceof Anthropic.APIError && err.status){
    let msg = err.error?.error?.message || err.message;
    if(err.status===401) msg += "\n→ Check your API key in Settings.";
    if(err.status===400 && /fallback/i.test(msg)) msg += "\n→ Try turning off “Auto-fallback on refusal” in Settings.";
    if(err.status===429) msg += "\n→ Rate limited. Wait a moment, then Retry.";
    if((err.status===400 || err.status===403) && /mcp|server_name|authoriz/i.test(msg)) msg += "\n→ A connected app couldn’t be reached or rejected its token. Check it in Settings → Connected apps, or turn it off for this chat in Tools.";
    else if((err.status===400 || err.status===403) && /web_(search|fetch)|server tool|tool/i.test(msg)) msg += "\n→ Web tools may be turned off for your organisation (Anthropic Console → Settings → Capabilities), or not available for this model. Try switching Web off for this chat.";
    if(err.status===529) msg += "\n→ The API is overloaded. Try again shortly.";
    return `${err.status} — ${msg}`;
  }
  if(err instanceof Anthropic.APIConnectionError || /fetch|network/i.test(err?.message||"")) return "Couldn't reach the API: "+(err.message||err)+"\n→ Check your connection. If this page is open inside a preview, open the file directly in your browser.";
  return String(err?.message||err);
}

async function regenerate(chat){
  while(chat.messages.length && chat.messages.at(-1).role==="assistant") chat.messages.pop();
  const lastUser = chat.messages.at(-1); if(!lastUser) return;
  delete lastUser.excluded;
  panes.forEach(p=>{ if(p.chatId===chat.id) p.stick = true; });
  await persist(chat);
  await runCompletion(chat);
}
function refreshChat(id, full=false){

}

function buildSystem(chat){

  const ctx = chat.context;
  if(ctx && (ctx.files.length || ctx.tree)){
    let t = `The user has attached background context from a project folder on their computer ("${ctx.name}"), which they also work on with Claude Code. `
      + `Use it to understand their project, hardware, setup, vendors and preferences, and tailor your answers to it — e.g. when asked which products are compatible, consider what the project already uses. `
      + `This chat is for questions and research, not for editing the project: don't propose code changes unless asked. `

      + `If something important isn't in the provided files, say so rather than guessing.\n\n<project_folder name="${ctx.name}">\n`;
    if(ctx.tree) t += `<file_tree>\n${ctx.tree}\n</file_tree>\n`;

    t += `</project_folder>`;

  }
  const now = new Date();
  let when = `Today's date is ${now.toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"})}.`;
  try{ when += ` The user's time zone is ${Intl.DateTimeFormat().resolvedOptions().timeZone}.`; }catch{}
  if(L){}
  else if(webMode(chat)==="economy") when += ` Your training data ends well before today's date. For anything that may have changed since then (records, prices, versions, products, rules, anything "latest"), use the research tool before you answer, even when you feel sure, and cite its sources as Markdown links. Facts that can't change need no research.`;
  else if(webMode(chat)!=="off") when += ` Your training data ends well before today's date. Records, office holders, prices, versions, rules and anything "latest" may have changed since then, so search for those before you answer, even when you feel sure. Facts that can't change need no search. When the answer depends on where the user is, put the user's country or region in the search query.`
    + (webMode(chat)==="full" && !fetchAllowed(chat) ? " Reading full web pages is switched off in this chat because private project files are attached; use search results only." : "");

async function scanHandle(dir, prefix="", out=[], depth=0){
  for await (const [name, hd] of dir.entries()){
    if(out.length >= MAX_ENTRIES) break;
    const path = prefix + name;
    if(hd.kind==="directory"){ if(SKIP_DIRS.has(name) || depth>10) continue; out.push({path: path+"/", dir:true}); await scanHandle(hd, path+"/", out, depth+1); }
    else { const e = {path, text:isTextPath(path), get: ()=> hd.getFile()}; if(e.text){ try{ e.size = (await hd.getFile()).size; }catch{ e.size = 0; } } out.push(e); }
  }
  return out;
}
function scanFileList(files){
  const out = []; const dirs = new Set();
  for(const f of files){
    const parts = (f.webkitRelativePath || f.name).split("/").slice(1);
    if(parts.some((p,i)=> i<parts.length-1 && SKIP_DIRS.has(p))) continue;
    for(let i=1;i<parts.length;i++) dirs.add(parts.slice(0,i).join("/")+"/");
    const path = parts.join("/");
    out.push({path, text:isTextPath(path), size:f.size, get: async()=>f});
    if(out.length >= MAX_ENTRIES) break;
  }
  return [...[...dirs].map(path=>({path, dir:true})), ...out].sort((a,b)=>a.path.localeCompare(b.path));
}

  async function save(){
    if(!proj){ bg.remove(); return; }

    const all = [...proj.entries, ...(mem?.entries||[])];
    let files = [];
    for(const e of all){
      if(e.dir || !selected.has(e.path) || isSensitivePath(e.path)) continue;
      try{ const t = await (await e.get()).text(); if(!t.includes("\u0000")) files.push({path:e.path, text:t}); }catch{ toast(`Couldn't read ${e.path}`); }
    }
    const flagged = files.filter(f=>looksSecret(f.text));
    if(flagged.length){
      status.textContent = "";
      const choice = await secretDialog(flagged.map(f=>f.path));
      if(choice==="cancel") return;
      if(choice==="omit") files = files.filter(f=>!flagged.includes(f));
    }
    const index = proj.entries.filter(e=>!e.dir && e.text && !isSensitivePath(e.path)).map(e=>e.path);
    if(!proj.folderId) sessionFolders.set(chat.id, new Map(await Promise.all(proj.entries.filter(e=>!e.dir && index.includes(e.path)).map(async e=>[e.path, await e.get()]))));
    chat.context = {name: proj.name, folderId: proj.folderId||null, memoryName: mem?.name||null, memFolderId: mem?.folderId||null, files,
      tree: (includeTree||allowRead) ? treeString(proj.entries) : "", allowRead, index, loadedAt: Date.now()};
    if(chat.messages.length) await persist(chat);
    bg.remove(); refreshChat(chat.id, true);
    toast(`Attached ${files.length} file${files.length===1?"":"s"} from ${proj.name}`);
  }
  render();
}

async function exportBackup(){
  const data = {app:"page-aura", version:1, exportedAt:new Date().toISOString(), chats:[...chats.values()].filter(c=>c.messages.length), memories: await memAll(), notes:{text:settings.notes||"", updatedAt:settings.notesUpdatedAt||0}};
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  const name = `page-aura-backup-${new Date().toISOString().slice(0,10)}.json`;
  if(DESKTOP){ const where = await invoke("save_bytes",{name, b64:bytesToB64(bytes)}).catch(e=>{ toast(String(e)); return null; }); if(where) toast("Backup saved to "+where); return; }
  const u = URL.createObjectURL(new Blob([bytes],{type:"application/json"})); const a = h("a",{href:u, download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 30000);
  toast(`Exported ${data.chats.length} chats and ${data.memories.length} memories`);
}
function importBackup(){
  const inp = h("input",{type:"file", accept:"application/json,.json", hidden:true});
  inp.onchange = async()=>{
    const f = inp.files[0]; inp.remove(); if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(data?.app!=="page-aura" || !Array.isArray(data.chats)) throw new Error("That isn’t a Page Aura backup file.");
      let added = 0, updated = 0;
      for(const c of data.chats){
        if(!c?.id || !Array.isArray(c.messages)) continue;
        const cur = chats.get(c.id);
        if(cur && (cur.updatedAt||0) >= (c.updatedAt||0)) continue;
        cur ? updated++ : added++;
        chats.set(c.id, c); await dbPut(c);
      }
      if(data.notes?.text && (data.notes.updatedAt||0) > (settings.notesUpdatedAt||0)){ settings.notes = data.notes.text; settings.notesUpdatedAt = data.notes.updatedAt; saveSettings(); }
      let mems = 0;
      for(const m of data.memories||[]){ if(typeof m?.path==="string" && m.path.startsWith(MEM_ROOT+"/") && typeof m.text==="string"){ await memPut(m); mems++; } }
      renderList(); toast(`Imported ${added} new and ${updated} updated chats, ${mems} memories`);
    }catch(e){ toast(e.message||String(e)); }
  };
  document.body.append(inp); inp.click();
}

function modal(content, onClose){
  const bg = h("div",{class:"modalBg"}, content);
  const close = ()=>{ bg.remove(); document.removeEventListener("keydown", esc); onClose?.(); };
  bg.addEventListener("mousedown", e=>{ if(e.target===bg) close(); });
  const esc = (e)=>{ if(e.key==="Escape" && !e.defaultPrevented && !menuEl) close(); };
  document.addEventListener("keydown", esc);
  document.body.append(bg);
  const origRemove = bg.remove.bind(bg); bg.remove = ()=>{ document.removeEventListener("keydown", esc); origRemove(); };
  return bg;
}

/* ================= Page Relay link (Page Studio) =================
   Page Studio, on macOS and Linux, keeps the computer awake while agents work (Page Power) and pages your phone when a
   decision is yours (Page Relay). With the link switched on (Settings ▸ Page Relay on this computer), Page Aura tells
   Page Studio which chats are busy or waiting on an approval, when a reply finishes, and answers its
   commands: send a message, Allow once / Deny a tool request, stop a reply, and (for the phone's
   Sessions tab) list recent chats and their transcripts. Protocol: docs/AURA-LINK.md in the Page repo.
   Only the main window takes part. The Rust core connects only to Page Studio's own socket. */
const pageLink = {started:new Map(), supported:false, connected:false, watch:{list:false, chatIds:[]}, lastState:"", timer:0, chatsTimer:0, chatsAt:0, lastChats:"", tx:new Map(), version:"", status:null};
const LINK_ID = /^[A-Za-z0-9_-]{1,64}$/;
function plSend(obj){ if(pageLink.connected) invoke("page_link_send",{line:JSON.stringify(obj)}).catch(()=>{}); }
function plApproval(entry){
  const pd = entry?.pending; if(!pd) return null;
  pd.linkId ||= [...crypto.getRandomValues(new Uint8Array(4))].map(b=>b.toString(16).padStart(2,"0")).join("");
  return pd.kind==="local" ? {id:pd.linkId, server:String(pd.server||"App").slice(0,80), tool:String(pd.tool||"").slice(0,80), args:JSON.stringify(pd.args||{}).slice(0,1500)}
    : {id:pd.linkId, server:"Project folder", tool:"read_file", args:JSON.stringify({path:pd.path}).slice(0,1500)};
}
function plStateFrame(){
  const out = [];
  for(const [id, entry] of running){ const c = chats.get(id); if(!c || !LINK_ID.test(id)) continue;
    const ap = plApproval(entry);
    out.push({id, title:(c.title||"Chat").slice(0,200), model:c.model, busy:!ap, since:entry.since||Date.now(), approval:ap}); }
  return {t:"state", chats:out};
}
function plSoon(){ if(!pageLink.connected) return; clearTimeout(pageLink.timer); pageLink.timer = setTimeout(()=>plFlush(false), 250); }
function plFlush(force){
  if(!pageLink.connected) return;
  const f = plStateFrame(), j = JSON.stringify(f);
  if(force || j!==pageLink.lastState){ pageLink.lastState = j; plSend(f); }
  if(pageLink.watch.list) plChatsSoon(force);
  for(const id of pageLink.watch.chatIds) plTranscriptSoon(id);
}
const plPlain = (t)=> String(t||"").replace(/```[\s\S]*?```/g," (code) ").replace(/[#*_`>|]/g,"").replace(/\s+/g," ").trim();
function plChatsFrame(){
  if(settings.pageLinkChats===false) return {t:"chats", chats:[]};
  const week = Date.now() - 7*864e5;
  const list = [...chats.values()].filter(c=>LINK_ID.test(c.id) && c.messages.length && ((c.updatedAt||0) >= week || running.has(c.id)))
    .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const busy = list.filter(c=>running.has(c.id)), rest = list.filter(c=>!running.has(c.id));
  return {t:"chats", chats:[...busy, ...rest.slice(0, Math.max(0, 20-busy.length))].map(c=>{
    const e = running.get(c.id), ap = plApproval(e), last = [...c.messages].reverse().find(m=>m.role==="assistant");
    const live = e ? e.live.filter(b=>b?.type==="text").map(b=>b.text).join("") : "";
    return {id:c.id, title:(c.title||"Chat").slice(0,200), model:c.model, updatedAt:c.updatedAt||c.createdAt||Date.now(), busy:!!e && !ap, approval:ap,
      preview:plPlain(live || (last ? msgText(last) : "")).slice(-160)}; })};
}
function plChatsSoon(force){
  if(pageLink.chatsTimer) return;
  const wait = force ? 0 : Math.max(0, 1000 - (Date.now() - pageLink.chatsAt));
  pageLink.chatsTimer = setTimeout(()=>{ pageLink.chatsTimer = 0; if(!pageLink.watch.list) return;
    const f = plChatsFrame(), j = JSON.stringify(f);
    if(force || j!==pageLink.lastChats || Date.now()-pageLink.chatsAt > 19000){ pageLink.lastChats = j; pageLink.chatsAt = Date.now(); plSend(f); } }, wait);
}
function plToolLine(b, m){
  const i = b.input||{}, log = m.toolLog?.[b.id];
  if(b.name==="web_search") return `Web search: ${String(i.query||"").slice(0,120)}`;
  if(b.name==="web_fetch") return `Read a page: ${String(i.url||"").slice(0,160)}`;
  if(/code_execution|text_editor/.test(b.name)) return "Ran code";
  if(b.type==="mcp_tool_use") return `Used ${b.server_name||"an app"} · ${b.name}`;
  if(b.name.startsWith("local_")) return `Used ${log?.server||"an app on this computer"} · ${log?.tool||b.name}`;
  if(b.name==="memory") return "Used memory";
  if(b.name==="research") return `Researched: ${String(i.query||i.question||"").slice(0,120)}`;
  if(b.name==="read_project_file") return `Read a project file: ${String(i.path||"").slice(0,160)}`;
  return `Used ${b.name}`;
}
function plTranscriptFrame(id){
  const c = chats.get(id); if(!c) return null;
  const at = c.updatedAt || c.createdAt || Date.now(), entries = [];
  c.messages.forEach((m,i)=>{
    if(m.role==="user"){
      const atts = (Array.isArray(m.content) ? m.content : []).filter(b=>b.type==="image"||b.type==="document"||b.type==="container_upload")
        .map(b=>`(attached: ${m.fileNames?.[b.source?.file_id || b.file_id] || b.title || (b.type==="image" ? "an image" : "a file")})`);
      const t = [msgText(m), ...atts].filter(Boolean).join("\n"); if(t) entries.push({id:`m${i}`, role:"user", text:t.slice(0,4000), at});
    } else if(m.role==="assistant"){
      let k = 0;
      for(const b of (m.api || [m]).flatMap(x=>Array.isArray(x.content) ? x.content : []))
        if(b.type==="tool_use" || b.type==="server_tool_use" || b.type==="mcp_tool_use") entries.push({id:`m${i}-t${k++}`, role:"tool", tool:b.name, text:plToolLine(b, m), at});
      const t = msgText(m) || m.error || ""; if(t) entries.push({id:`m${i}`, role:"assistant", text:String(t).slice(0,4000), at});
    }
  });
  const e = running.get(id);
  if(e){ const t = e.live.filter(b=>b?.type==="text").map(b=>b.text).join(""); if(t) entries.push({id:`m${c.messages.length}`, role:"assistant", text:t.slice(0,4000), at:Date.now()}); }
  return {t:"transcript", chatId:id, truncated:entries.length > 40, entries:entries.slice(-40)};
}
function plTranscriptSoon(id){
  if(settings.pageLinkChats===false) return;
  const tx = pageLink.tx.get(id) || {at:0, timer:0, last:""}; pageLink.tx.set(id, tx);
  if(tx.timer) return;
  tx.timer = setTimeout(()=>{ tx.timer = 0; if(!pageLink.watch.chatIds.includes(id)) return;
    const f = plTranscriptFrame(id); if(!f) return; const j = JSON.stringify(f);
    if(j!==tx.last){ tx.last = j; tx.at = Date.now(); plSend(f); } }, Math.max(0, 1500 - (Date.now() - tx.at)));
}
function plFinished(chat, a){
  if(!pageLink.connected) return;
  const text = a.error ? String(a.error) : plPlain(msgText(a));
  plSend({t:"finished", chatId:chat.id, title:(chat.title||"Chat").slice(0,200), ok:!a.error, stopped:a.stopReason==="aborted", snippet:text.slice(-600), at:Date.now()});
}
async function plCommand(cmd){
  if(cmd.t==="watch"){
    pageLink.watch = {list:!!cmd.list, chatIds:(cmd.chatIds||[]).filter(id=>chats.has(id))};
    for(const id of [...pageLink.tx.keys()]) if(!pageLink.watch.chatIds.includes(id)) pageLink.tx.delete(id);
    plFlush(true); return;
  }
  const ack = (ok, detail)=> plSend({t:"ack", ref:cmd.id, ok, detail});
  const chat = chats.get(cmd.chatId);
  if(cmd.t==="send"){
    if(!chat) return ack(false, "That chat no longer exists");
    if(running.has(chat.id)) return ack(false, "Page Aura is still working in that chat");
    if(!getClient()) return ack(false, "Page Aura needs its API key");
    const started = new Promise(r=>pageLink.started.set(chat.id, ()=>r(true)));
    sendMessage(chat, cmd.text, []).catch(()=>{});
    const ok = await Promise.race([started, new Promise(r=>setTimeout(()=>r(false), 5000))]);
    pageLink.started.delete(chat.id);
    return ok ? ack(true, "Sent to Page Aura") : ack(false, "Page Aura couldn’t start that reply");
  }
  if(cmd.t==="approve"){
    const pd = chat && running.get(chat.id)?.pending;
    if(!pd || pd.linkId!==cmd.approvalId) return ack(false, "That request was already answered");
    pd.res(cmd.decision==="once" ? "once" : "deny");
    return ack(true, cmd.decision==="once" ? "Allowed once" : "Denied");
  }
  if(cmd.t==="stop"){
    if(!chat || !running.has(chat.id)) return ack(true, "Nothing to stop");
    stop(chat); return ack(true, "Stopped");
  }
}

    h("label",{class:"f"},"Ollama address"), url,
    h("p",{class:"hint", style:"margin:6px 0 0"}, DESKTOP ? "Only addresses on this computer (localhost, 127.0.0.1) are allowed."
      : "Only addresses on this computer are allowed. If the browser blocks the request, start Ollama with OLLAMA_ORIGINS set to this page’s address"+(location.protocol==="file:" ? " (for a page opened as a file that is “null”, which lets any local file talk to Ollama), or serve the page from http://localhost." : ` (${location.origin}).`)),
    status, list,
    h("div",{class:"actions"}, h("span",{class:"sp"}),
      h("button",{class:"btn", onclick:()=>{ if(!saved){ settings.local = before; localClient = null; refreshLocalModels(); } bg.remove(); }}, "Cancel"),
      h("button",{class:"btn", onclick:test}, icon("refresh"), "Test"),
      h("button",{class:"btn primary", onclick:async()=>{
        const ok = await test();
        if(en.checked && !ok) return;       // keep the dialog open so the error stays readable
        saved = true; saveSettings(); bg.remove(); layout(); renderChrome();
        panes.forEach((pn,i)=>{ const d=pn.draft; renderPane(i); pn.draft=d; });
      }}, icon("check"), "Save"))),
    ()=>{ if(!saved){ settings.local = before; localClient = null; refreshLocalModels(); } });
  if(localState.status!=="off") show();
  setTimeout(()=>url.focus());
}

/* ================= init ================= */
$("#brandMark").append(icon("mark"));
$("#newChat").append(icon("plus"), h("span",{},"New chat"), h("span",{class:"kbd hideSm"}, navigator.platform.includes("Mac")?"⌘⇧O":"Ctrl⇧O"));
$("#searchIcon").replaceWith(icon("search"));
$("#settingsBtn").append(icon("sliders"));
$("#closeSide").append(icon("x"));
$("#newChat").onclick = (e)=> { newChat(e.ctrlKey||e.metaKey||e.shiftKey); document.body.classList.remove("sideOpen"); };
$("#settingsBtn").onclick = openSettings;
$("#notesBtn").append(icon("pen")); $("#notesBtn").onclick = openNotes;
$("#syncState").onclick = async()=>{ if(!syncState.ready){ if(await SyncFS.resume()){ syncState.ready = true; await syncNow(); } else toast("Permission wasn’t granted"); } else syncNow(); };
window.addEventListener("focus", ()=>syncNow());
setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); }, 60000);
$("#keyState").onclick = ()=> isLocked()? needKey() : openSettings();
$("#spend").onclick = openBalance;
window.addEventListener("focus", renderSpend);
$("#closeSide").onclick = ()=> document.body.classList.remove("sideOpen");
$("#search").oninput = renderList;
$("#themeBtn").onclick = ()=>{ settings.theme = isDark() ? "light" : "dark"; saveSettings(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderChrome);
if(matchMedia("(max-width:760px)").matches) $("#closeSide").style.display = "";
document.addEventListener("keydown", e=>{
  const mod = e.ctrlKey||e.metaKey;
  if(e.key==="Escape" && menuEl){ e.preventDefault(); closeMenu(); return; }
  if(mod && e.shiftKey && e.key.toLowerCase()==="o"){ e.preventDefault(); newChat(false); }
  if(mod && e.key==="\\"){ e.preventDefault(); newChat(true); }
});
window.addEventListener("resize", closeMenu);
bc && (bc.onmessage = async (e)=>{
  if(e.data?.type==="spend"){ renderSpend(); return; }
  if(e.data?.type!=="updated" || running.has(e.data.id)) return;
  const fresh = (await dbAll()).find(c=>c.id===e.data.id);
  if(fresh) chats.set(fresh.id, fresh); else if(chats.has(e.data.id) && !panes.some(p=>p.chatId===e.data.id)) chats.delete(e.data.id);
  refreshChat(e.data.id, true); renderList();
});
window.addEventListener("beforeunload", e=>{ if(running.size){ e.preventDefault(); e.returnValue=""; } });

(async function init(){
  try{ for(const c of await dbAll()) chats.set(c.id, c); }catch(e){ console.error(e); toast("Couldn't open local storage — chats won't be saved."); }
  const params = new URLSearchParams(location.search);
  if(params.has("solo")) document.body.classList.add("solo");
  let ids = [];
  if(params.get("chat")) ids = [params.get("chat")];
  else { try{ ids = JSON.parse(localStorage.getItem("cc.panes")||"[]"); }catch{} }
  ids = ids.filter(id=>chats.has(id)).slice(0, MAX_PANES);
  if(!ids.length){
    const recent = [...chats.values()].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
    if(recent && !recent.messages.length) ids=[recent.id];
    else { const c=newChatObj(); chats.set(c.id,c); ids=[c.id]; }
  }
  panes = ids.map(makePane); focusedPane = 0;
  renderChrome(); renderSpend(); layout();
  if(DESKTOP){
    settings.keyEnc = null; settings.apiKey = (await invoke("key_status").catch(()=>false)) ? KEYCHAIN : "";
    document.documentElement.classList.add("desktop"); renderChrome(); layout();
  } else {
    if(!settings.keyEnc) await loadAppTokens();
    if(isLocked()){ if(await unlockDialog()) layout(); }
  }
  initSync().catch(()=>{});
  if(DESKTOP){ refreshLocalApps(); setTimeout(()=>checkUpdates(false), 4000); initPageLink().catch(()=>{}); }
  if(localOn()) refreshLocalModels().then(()=>{ renderChrome(); panes.forEach((p,i)=>{ const d=p.draft; renderPane(i); p.draft=d; }); });
  if(!settings.apiKey){ if(!settings.keyEnc && !localOn()) openSettings(); }
  else refreshModels().then(()=>{ renderChrome(); panes.forEach((p,i)=>{ const d=p.draft; renderPane(i); p.draft=d; }); });
})();
</script>
</body>
</html>
