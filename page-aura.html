}

function buildSystem(chat){
  const parts = [];
  if(chat.system?.trim()) parts.push({type:"text", text: chat.system.trim()});
  if(notesOn(chat)) parts.push({type:"text", text:`<user_notes>\nStanding notes the user has written for every chat. Keep them in mind; they describe the user and their preferences.\n${settings.notes.trim()}\n</user_notes>`});
  const ctx = chat.context;
  if(ctx && (ctx.files.length || ctx.tree)){
    let t = `The user has attached background context from a project folder on their computer ("${ctx.name}"), which they also work on with Claude Code. `
      + `Use it to understand their project, hardware, setup, vendors and preferences, and tailor your answers to it — e.g. when asked which products are compatible, consider what the project already uses. `
      + `This chat is for questions and research, not for editing the project: don't propose code changes unless asked. `
      + `Files such as CLAUDE.md were written as instructions for a coding assistant; treat them as a description of the user and their project, and apply the preferences that are relevant here. `
      + `If something important isn't in the provided files, say so rather than guessing.\n\n<project_folder name="${ctx.name}">\n`;
    if(ctx.tree) t += `<file_tree>\n${ctx.tree}\n</file_tree>\n`;
    for(const f of ctx.files) t += `<file path="${f.path}">\n${f.text}\n</file>\n`;
    t += `</project_folder>`;
    parts.push({type:"text", text:t});
  }
  const now = new Date();
  let when = `Today's date is ${now.toLocaleDateString("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"})}.`;
  try{ when += ` The user's time zone is ${Intl.DateTimeFormat().resolvedOptions().timeZone}.`; }catch{}
  if(webMode(chat)==="economy") when += ` Your training data ends well before today's date. For anything that may have changed since then (records, prices, versions, products, rules, anything "latest"), use the research tool before you answer, even when you feel sure, and cite its sources as Markdown links. Facts that can't change need no research.`;
  else if(webMode(chat)!=="off") when += ` Your training data ends well before today's date. Records, office holders, prices, versions, rules and anything "latest" may have changed since then, so search for those before you answer, even when you feel sure. Facts that can't change need no search. When the answer depends on where the user is, put the user's country or region in the search query.`
    + (webMode(chat)==="full" && !fetchAllowed(chat) ? " Reading full web pages is switched off in this chat because private project files are attached; use search results only." : "");
  if(codeOn(chat)) when += " You can run code in a sandbox and create Excel, Word, PowerPoint and PDF files. To give the user a file, copy it into $OUTPUT_DIR so it can be downloaded, and mention it by name.";
  if(memoryOn(chat)) when += " You have a memory directory that persists across this user's chats. Save durable facts about the user and their projects there when they come up, and check it at the start of a task.";
  parts.push({type:"text", text: when});
  return parts.length ? parts : undefined;
}
async function scanHandle(dir, prefix="", out=[], depth=0){
  for await (const [name, hd] of dir.entries()){
    if(out.length >= MAX_ENTRIES) break;
    const path = prefix + name;
    if(hd.kind==="directory"){ if(SKIP_DIRS.has(name) || depth>10) continue; out.push({path: path+"/", dir:true}); await scanHandle(hd, path+"/", out, depth+1); }
    else { const e = {path, text:isTextPath(path), get: ()=> hd.getFile()}; if(e.text){ try{ e.size = (await hd.getFile()).size; }catch{ e.size = 0; } } out.push(e); }
  }
  return out;
}
function scanFileList(files){
  const out = []; const dirs = new Set();
  for(const f of files){
    const parts = (f.webkitRelativePath || f.name).split("/").slice(1);
    if(parts.some((p,i)=> i<parts.length-1 && SKIP_DIRS.has(p))) continue;
    for(let i=1;i<parts.length;i++) dirs.add(parts.slice(0,i).join("/")+"/");
    const path = parts.join("/");
    out.push({path, text:isTextPath(path), size:f.size, get: async()=>f});
    if(out.length >= MAX_ENTRIES) break;
  }
  return [...[...dirs].map(path=>({path, dir:true})), ...out].sort((a,b)=>a.path.localeCompare(b.path));
}
function pickFolderFallback(){
  return new Promise(res=>{
    const inp = h("input",{type:"file", webkitdirectory:true, multiple:true, hidden:true});
    inp.onchange = ()=>{ const files=[...inp.files]; inp.remove(); res(files.length? {name:(files[0].webkitRelativePath||"folder").split("/")[0], entries:scanFileList(files)} : null); };
    document.body.append(inp); inp.click();
  });
}
async function ensurePermission(handle){
  try{ if(await handle.queryPermission({mode:"read"})==="granted") return true; return (await handle.requestPermission({mode:"read"}))==="granted"; }catch{ return false; }
}
async function loadFromHandle(handle){
  if(!await ensurePermission(handle)) throw new Error("Permission to read the folder was not granted.");
  return {name: handle.name, entries: await scanHandle(handle), handle};
}
async function rememberFolder(handle, kind){
  const all = await folderAll().catch(()=>[]);
  for(const f of all){ try{ if(f.kind===kind && await f.handle.isSameEntry(handle)){ f.usedAt=Date.now(); await folderPut(f); return f.id; } }catch{} }
  const id = uid(); await folderPut({id, name:handle.name, kind, handle, usedAt:Date.now()}); return id;
}
function treeString(entries){
  return entries.map(e=>{ const d = e.path.replace(/\/$/,"").split("/").length-1; return "  ".repeat(d) + e.path.replace(/\/$/,"").split("/").pop() + (e.dir?"/":""); }).join("\n");
}
async function openContext(chat){
  let proj = null, mem = null;

          m.entries = m.entries.filter(e=>!e.dir).map(e=>({...e, path:"memory/"+e.path})); m.folderId = chat.context.memFolderId; mem = m; }catch{}
      }
      if(kind==="memory"){ r.entries = r.entries.filter(e=>!e.dir).map(e=>({...e, path:"memory/"+e.path})); mem = r; r.entries.forEach(e=>{ if(e.text) selected.add(e.path); }); }

  }
  async function render(){
    body.innerHTML = "";
    if(!proj){
      const recent = canPickDir ? (await folderAll().catch(()=>[])).filter(f=>f.kind==="project").sort((a,b)=>b.usedAt-a.usedAt).slice(0,8) : [];

      return;
    }
    const all = [...proj.entries, ...(mem?.entries||[])];
    const textFiles = all.filter(e=>!e.dir && e.text && !isSensitivePath(e.path));
    const hiddenSecrets = all.filter(e=>!e.dir && isSensitivePath(e.path)).length;
    const q = filter.toLowerCase();
    const matching = textFiles.filter(e=>!q || e.path.toLowerCase().includes(q));
    const shown = matching.sort((a,b)=> (selected.has(b.path)-selected.has(a.path)) || a.path.localeCompare(b.path)).slice(0,400);
    const selSize = textFiles.filter(e=>selected.has(e.path)).reduce((n,e)=>n+(e.size||0),0);
    const estTok = Math.round((selSize + ((includeTree||allowRead) ? treeString(proj.entries).length : 0))/3.5);
    const filterIn = h("input",{class:"field", type:"text", placeholder:"Filter files — e.g. modem, config, .yaml", value:filter});
    filterIn.oninput = ()=>{ filter = filterIn.value; render().then(()=>{ const f=body.querySelector("input.field"); f.focus(); f.setSelectionRange(f.value.length,f.value.length); }); };
    const list = h("div",{class:"fileList"}, ...shown.map(e=>{

    const readCb = h("input",{type:"checkbox", class:"switch", checked:allowRead}); readCb.onchange=()=>{ allowRead=readCb.checked; render(); };
    const pct = Math.min(100, estTok/150000*100);
    body.append(
      h("div",{class:"folderHead"}, h("span",{class:"ic"}, icon("folder")),
        h("div",{style:"flex:1;min-width:0"}, h("b",{}, proj.name), h("span",{class:"hint"}, `${textFiles.length} text files${all.length>=MAX_ENTRIES?` · large folder, first ${MAX_ENTRIES} entries scanned`:""}`)),
        h("button",{class:"btn sm", onclick:()=>{ proj=null; mem=null; render(); }},"Change")),
      h("label",{class:"toggle"}, h("span",{class:"tx"}, h("b",{},"Let the model ask for other files"), h("span",{},"It can request any other text file from this folder; you approve each one. Cheaper than sending everything up front.")), readCb),

      h("label",{class:"f", style:"margin-top:6px"}, "Files to include ", h("span",{class:"hint"}, "· CLAUDE.md and README are ticked for you")),

      h("div",{class:"row", style:"margin-top:14px"},
        h("button",{class:"btn sm", onclick:()=>choose("memory")}, icon("brain"), mem? `Memory: ${mem.name} (${mem.entries.length})` : "Add Claude Code memory folder"),
        (DESKTOP && !mem && proj.path) ? h("button",{class:"btn sm primary", onclick:async()=>{
          try{ const dir = await invoke("claude_memory_dir",{project:proj.path});
            if(!dir){ toast("No Claude Code memory found for this project"); return; }
            const m = await loadFromPath(dir, "memory"); m.folderId = await rememberPath(dir, "memory", "memory");
            m.entries = m.entries.filter(e=>!e.dir).map(e=>({...e, path:"memory/"+e.path})); mem = m; m.entries.forEach(e=>{ if(e.text) selected.add(e.path); }); render();
          }catch(e){ toast(String(e)); } }}, icon("brain"), "Find it automatically") : "",
        mem? "" : h("span",{class:"hint"}, "optional")),

      h("div",{class:"tokenBar"+(estTok>150000?" warn":"")}, h("span",{}, `≈ ${fmtN(estTok)} tokens per message`), h("span",{class:"bar"}, h("i",{style:`width:${pct}%`})), estTok>150000? h("span",{}, "that’s a lot") : "")
    );
  }
  async function save(){
    if(!proj){ bg.remove(); return; }
    status.textContent = "Reading files…";
    const all = [...proj.entries, ...(mem?.entries||[])];
    let files = [];
    for(const e of all){
      if(e.dir || !selected.has(e.path) || isSensitivePath(e.path)) continue;
      try{ const t = await (await e.get()).text(); if(!t.includes("\u0000")) files.push({path:e.path, text:t}); }catch{ toast(`Couldn't read ${e.path}`); }

    const index = proj.entries.filter(e=>!e.dir && e.text && !isSensitivePath(e.path)).map(e=>e.path);
    if(!proj.folderId) sessionFolders.set(chat.id, new Map(await Promise.all(proj.entries.filter(e=>!e.dir && index.includes(e.path)).map(async e=>[e.path, await e.get()]))));

    bg.remove(); refreshChat(chat.id, true);
    toast(`Attached ${files.length} file${files.length===1?"":"s"} from ${proj.name}`);

async function exportBackup(){
  const data = {app:"page-aura", version:1, exportedAt:new Date().toISOString(), chats:[...chats.values()].filter(c=>c.messages.length), memories: await memAll(), notes:{text:settings.notes||"", updatedAt:settings.notesUpdatedAt||0}};
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  const name = `page-aura-backup-${new Date().toISOString().slice(0,10)}.json`;
  if(DESKTOP){ const where = await invoke("save_bytes",{name, b64:bytesToB64(bytes)}).catch(e=>{ toast(String(e)); return null; }); if(where) toast("Backup saved to "+where); return; }
  const u = URL.createObjectURL(new Blob([bytes],{type:"application/json"})); const a = h("a",{href:u, download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 30000);
  toast(`Exported ${data.chats.length} chats and ${data.memories.length} memories`);
}
function importBackup(){
  const inp = h("input",{type:"file", accept:"application/json,.json", hidden:true});
  inp.onchange = async()=>{
    const f = inp.files[0]; inp.remove(); if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(data?.app!=="page-aura" || !Array.isArray(data.chats)) throw new Error("That isn’t a Page Aura backup file.");
      let added = 0, updated = 0;
      for(const c of data.chats){
        if(!c?.id || !Array.isArray(c.messages)) continue;
        const cur = chats.get(c.id);
        if(cur && (cur.updatedAt||0) >= (c.updatedAt||0)) continue;
        cur ? updated++ : added++;
        chats.set(c.id, c); await dbPut(c);
      }
      if(data.notes?.text && (data.notes.updatedAt||0) > (settings.notesUpdatedAt||0)){ settings.notes = data.notes.text; settings.notesUpdatedAt = data.notes.updatedAt; saveSettings(); }
      let mems = 0;
      for(const m of data.memories||[]){ if(typeof m?.path==="string" && m.path.startsWith(MEM_ROOT+"/") && typeof m.text==="string"){ await memPut(m); mems++; } }
      renderList(); toast(`Imported ${added} new and ${updated} updated chats, ${mems} memories`);
    }catch(e){ toast(e.message||String(e)); }
  };
  document.body.append(inp); inp.click();
}

/* ================= dialogs ================= */
function modal(content, onClose){
  const bg = h("div",{class:"modalBg"}, content);
  const close = ()=>{ bg.remove(); document.removeEventListener("keydown", esc); onClose?.(); };
  bg.addEventListener("mousedown", e=>{ if(e.target===bg) close(); });
  const esc = (e)=>{ if(e.key==="Escape" && !e.defaultPrevented && !menuEl) close(); };
  document.addEventListener("keydown", esc);
  document.body.append(bg);
  const origRemove = bg.remove.bind(bg); bg.remove = ()=>{ document.removeEventListener("keydown", esc); origRemove(); };
  return bg;
}
function confirmDialog(title, text, okLabel="OK"){
  return new Promise(res=>{
    const bg = modal(h("div",{class:"modal sm"}, h("h2",{}, title), h("p",{class:"lead"}, text),
      h("div",{class:"actions"}, h("button",{class:"btn", onclick:()=>{ bg.remove(); res(false); }},"Cancel"),
        h("button",{class:"btn danger", onclick:()=>{ bg.remove(); res(true); }}, okLabel))), ()=>res(false));
    setTimeout(()=>bg.querySelector(".btn.danger")?.focus());
  });
}
function lightbox(src){ const bg = modal(h("img",{id:"lightbox", src, alt:""})); bg.onclick = ()=>bg.remove(); }
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = h("div",{class:"toast", role:"status"}, msg); document.body.append(t); setTimeout(()=>t.remove(), 3600);
}
function editSystem(chat){
  const ta = h("textarea",{class:"field", rows:9, placeholder:"e.g. You are a concise technical advisor. Use British English. Always give sources."}); ta.value = chat.system||"";
  const bg = modal(h("div",{class:"modal"}, h("h2",{},"Chat instructions"),
    h("p",{class:"lead"},"Standing instructions the model follows for this chat (the system prompt). You can change them at any time."),
    ta, h("div",{class:"actions"}, h("button",{class:"btn", onclick:()=>bg.remove()},"Cancel"),
      h("button",{class:"btn primary", onclick:async()=>{ chat.system=ta.value; if(chat.messages.length) await persist(chat); bg.remove(); toast("Instructions saved"); }}, icon("check"), "Save"))));
  setTimeout(()=>ta.focus());
}
let fetchedModels = null;
function allModels(){ return fetchedModels || MODELS; }
async function refreshModels(){
  const c = getClient(); if(!c) return false;
  try{
    const out = [];
    for await (const m of c.models.list({limit:100})) out.push({id:m.id, name:(m.display_name||m.id).replace(/^Claude\s+/,"")});
    const known = new Set(out.map(m=>m.id));
    fetchedModels = [...MODELS.filter(m=>known.has(m.id)), ...out.filter(m=>!MODELS.some(x=>x.id===m.id))];
    if(!fetchedModels.length) fetchedModels = null;
    return true;
  }catch(e){ console.warn("models.list failed", e); return e; }
}

    h("div",{class:"section"}, h("h3",{},"Connected apps"),

      h("div",{class:"row"},
        h("button",{class:"btn sm", type:"button", onclick:exportBackup}, icon("down"), "Export backup"),

    h("div",{class:"section"}, h("h3",{},"Advanced"),

            catch(e){ status.style.color = "var(--danger)"; status.textContent = String(e); return; }
            settings.apiKey = KEYCHAIN; client = null; fetchedModels = null;
            status.textContent = "Checking key…";
            const r = await refreshModels();
            if(r?.status===401){ await invoke("key_clear").catch(()=>{}); settings.apiKey = ""; client = null; status.style.color = "var(--danger)"; status.textContent = "That key was rejected — check it and try again."; return; }
          }
          Object.assign(settings,{model, effort, maxTokens:Math.max(1024, Math.min(128000, Number(maxT.value)||64000)), system:sys.value, webDefault:webDef,
            codeDefault:codeDef.checked, memoryDefault:memDef.checked, fallbacks:fb.checked, showThinking:th.checked});
          saveSettings();
          for(const p of panes){ const c = chats.get(p.chatId); if(c && !c.messages.length){ c.model=settings.model; c.effort=settings.effort; c.system=settings.system; c.web=settings.webDefault; c.code=settings.codeDefault; c.memory=settings.memoryDefault; } }
          bg.remove(); layout(); renderChrome(); if(nk) toast("Key saved in your system keychain");
          return;
        }
        const keyChanged = key.value.trim() !== settings.apiKey;
        const newKey = key.value.trim();
        // passphrase protection
        let keyEnc = settings.keyEnc;
        if(!(remember.checked && protect.checked) || !newKey && !isLocked()) keyEnc = null;

          keyEnc = await encryptKey(newKey, p1.value);
        }
        settings.keyEnc = keyEnc;
        await storeAppTokens();   // re-seal app tokens with the current key (or store plainly if protection is off)
        Object.assign(settings,{apiKey: (isLocked() && !newKey) ? "" : newKey, remember:remember.checked, model, effort,
          maxTokens:Math.max(1024, Math.min(128000, Number(maxT.value)||64000)), system:sys.value, webDefault:webDef, codeDefault:codeDef.checked, memoryDefault:memDef.checked, fallbacks:fb.checked, showThinking:th.checked});
        if(!settings.remember){ try{ sessionStorage.setItem("cc.key", settings.apiKey); }catch{} }
        if(keyChanged && settings.apiKey){

document.addEventListener("keydown", e=>{
  const mod = e.ctrlKey||e.metaKey;
  if(e.key==="Escape" && menuEl){ e.preventDefault(); closeMenu(); return; }
  if(mod && e.shiftKey && e.key.toLowerCase()==="o"){ e.preventDefault(); newChat(false); }
  if(mod && e.key==="\\"){ e.preventDefault(); newChat(true); }
});
window.addEventListener("resize", closeMenu);
bc && (bc.onmessage = async (e)=>{
  if(e.data?.type==="spend"){ renderSpend(); return; }
  if(e.data?.type!=="updated" || running.has(e.data.id)) return;
  const fresh = (await dbAll()).find(c=>c.id===e.data.id);
  if(fresh) chats.set(fresh.id, fresh); else if(chats.has(e.data.id) && !panes.some(p=>p.chatId===e.data.id)) chats.delete(e.data.id);
  refreshChat(e.data.id, true); renderList();
});
window.addEventListener("beforeunload", e=>{ if(running.size){ e.preventDefault(); e.returnValue=""; } });

(async function init(){
  try{ for(const c of await dbAll()) chats.set(c.id, c); }catch(e){ console.error(e); toast("Couldn't open local storage — chats won't be saved."); }
  const params = new URLSearchParams(location.search);
  if(params.has("solo")) document.body.classList.add("solo");
  let ids = [];
  if(params.get("chat")) ids = [params.get("chat")];
  else { try{ ids = JSON.parse(localStorage.getItem("cc.panes")||"[]"); }catch{} }
  ids = ids.filter(id=>chats.has(id)).slice(0, MAX_PANES);
  if(!ids.length){
    const recent = [...chats.values()].sort((a,b)=>b.updatedAt-a.updatedAt)[0];
    if(recent && !recent.messages.length) ids=[recent.id];
    else { const c=newChatObj(); chats.set(c.id,c); ids=[c.id]; }
  }
  panes = ids.map(makePane); focusedPane = 0;
  renderChrome(); renderSpend(); layout();
  if(DESKTOP){
    settings.keyEnc = null; settings.apiKey = (await invoke("key_status").catch(()=>false)) ? KEYCHAIN : "";
    document.documentElement.classList.add("desktop"); renderChrome(); layout();
  } else {
    if(!settings.keyEnc) await loadAppTokens();
    if(isLocked()){ if(await unlockDialog()) layout(); }
  }
  initSync().catch(()=>{});
  if(DESKTOP){ refreshLocalApps(); setTimeout(()=>checkUpdates(false), 4000); }
  if(!settings.apiKey){ if(!settings.keyEnc) openSettings(); }
  else refreshModels().then(()=>{ renderChrome(); panes.forEach((p,i)=>{ const d=p.draft; renderPane(i); p.draft=d; }); });
})();
