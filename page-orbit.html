*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);display:flex;overflow:hidden;

    radial-gradient(30% 30% at 50% 50%,var(--glow3),transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}

::selection{background:var(--accent-soft)}

::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

svg.i{width:16px;height:16px;flex:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line2);background:var(--raised);font-weight:500;font-size:14px;
  transition:background .15s,border-color .15s,transform .15s var(--ease),box-shadow .15s}
.btn:hover{border-color:var(--muted);background:var(--surface)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06) saturate(1.05);box-shadow:0 10px 24px -10px var(--accent)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:8px;gap:5px}
.btn.sm svg.i{width:14px;height:14px}
.iconBtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.iconBtn:hover{background:var(--hover);color:var(--text)}
.iconBtn.sm{width:26px;height:26px;border-radius:7px}
.iconBtn.sm svg.i{width:14px;height:14px}
.kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}

.md{word-wrap:break-word;color:var(--text);line-height:1.68}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.65em 0}
.md h1,.md h2,.md h3{line-height:1.25;margin:1.3em 0 .5em;letter-spacing:-.01em}
.md h1{font:650 26px/1.2 var(--serif);letter-spacing:-.03em}.md h2{font-size:19px}.md h3{font-size:16px}
.md ul,.md ol{padding-left:1.4em;margin:.6em 0}.md li{margin:.25em 0}
.md li::marker{color:var(--muted)}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--accent);color:var(--text2);background:var(--accent-soft);border-radius:0 10px 10px 0}
.md a{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.md hr{border:0;border-top:1px solid var(--line2);margin:1.4em 0}
.md :not(pre)>code{font:500 .86em var(--mono);background:var(--hover);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.tableWrap{overflow:auto;margin:1em 0;border:1px solid var(--line2);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th{background:var(--hover);font-weight:600;text-align:left}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line)}
.md tr:last-child td{border-bottom:0}
.md img{max-width:100%;border-radius:10px}
.codeblock{margin:1em 0;border-radius:14px;overflow:hidden;background:var(--code-bg);border:1px solid rgba(255,255,255,.06);box-shadow:var(--shadow)}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:var(--code-head);color:#a49d91;font:500 12px var(--mono)}
.codehead .btn{color:#cfc8bc;border-color:transparent;background:transparent}
.codehead .btn:hover{background:rgba(255,255,255,.08)}
.codeblock pre{margin:0;padding:14px 16px;overflow:auto;font:13.5px/1.6 var(--mono);color:#e8e4dc}
.codeblock pre code.hljs{background:transparent;padding:0}
/* popover menu */
.menu{position:fixed;z-index:30;min-width:240px;max-width:320px;max-height:calc(100vh - 16px);overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:14px;background:var(--raised);border:1px solid var(--line2);box-shadow:var(--shadow-lg);
  animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menuHead{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menuItem{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left}
.menuItem:hover{background:var(--hover)}
.menuItem .mi{flex:1;min-width:0;display:flex;flex-direction:column}
.menuItem .ml{font-size:14px;font-weight:500}
.menuItem .ms{font-size:12px;color:var(--muted)}
.menuItem.sel .ml{color:var(--accent)}
.menuItem>svg.i{color:var(--accent)}

/* modal */
.modalBg{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--raised);border:1px solid var(--line2);border-radius:22px;padding:26px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:rise .28s var(--ease)}
.modal.wide{width:min(740px,100%)}
.modal.sm{width:min(420px,100%)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal h2{margin:0 0 6px;font:600 26px/1.15 var(--serif);letter-spacing:-.03em}
.modal .lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.modal label.f{display:block;margin:16px 0 6px;font-size:13px;font-weight:500;color:var(--text2)}
.field{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.field{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:24px;flex-wrap:wrap}
.modal .actions .sp{flex:1}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section>h3{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.toggle .tx{flex:1}.toggle .tx b{display:block;font-weight:500;font-size:14px}.toggle .tx span{color:var(--muted);font-size:12.5px}
.switch{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
.keyRow{display:flex;gap:8px}
.keyRow .field{font-family:var(--mono);font-size:13.5px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sunken)}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--muted)}
#lightbox{max-width:95vw;max-height:90vh;border-radius:14px;box-shadow:var(--shadow-lg);animation:rise .25s var(--ease)}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;
  background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);font-size:14px;box-shadow:var(--shadow-lg);backdrop-filter:blur(10px);animation:toastIn .3s var(--ease);max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* ---- style.css ---- */
/* ================= Page Orbit layout ================= */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
#nav{position:relative;z-index:2;width:236px;height:100vh;height:100dvh;flex:none;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px var(--accent)}
.brand .mark svg{width:19px;height:19px}
.brand .name{font:650 21px/1 var(--serif);letter-spacing:-.03em;flex:1}
.brand .name em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.navList{flex:1;overflow:auto;padding:2px 10px}
.navGroup{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.navItem{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;font-size:14px;color:var(--text2);transition:background .12s,color .12s}
.navItem:hover{background:var(--hover);color:var(--text)}
.navItem.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
.navItem.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.navItem .n{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}
.navItem .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.navFoot{display:flex;align-items:center;gap:4px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.keyState{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:9px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.keyState:hover{background:var(--hover);color:var(--text)}
.keyState .d{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.keyState.ok .d{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
#menuBtn{display:none}

#view{position:relative;z-index:1;flex:1;min-width:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
.viewHead{display:flex;align-items:center;gap:12px;padding:20px 28px 14px;flex:none;min-height:76px}
.viewHead .tt{flex:1;min-width:0}
.viewHead h1{margin:0;font:650 26px/1.15 var(--serif);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewHead .sub{color:var(--muted);font-size:13.5px;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
.crumb button{color:var(--muted)}.crumb button:hover{color:var(--accent)}
.crumb svg.i{width:13px;height:13px}
.viewBody{flex:1;min-height:0;overflow:auto;padding:4px 28px 40px}
.wrapW{max-width:1080px}

/* lists */
.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.searchIn{position:relative;width:240px}
.searchIn svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.searchIn .field{padding-left:32px;height:34px;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--raised) 82%,transparent);border:1px solid var(--line);
  cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s var(--ease)}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card.static{cursor:default}
.card .av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:var(--grad);font:650 15px var(--serif)}
.card .av.soft{background:var(--accent-soft);color:var(--accent)}
.card .av svg{width:18px;height:18px}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card .when{color:var(--muted);font-size:12.5px;white-space:nowrap;min-width:72px;text-align:right}

/* ================= desktop bridge (Tauri) =================
   Inside the desktop app, API calls go through the Rust core: it adds the key from the
   system keychain (shared with Page Aura), so the key never enters this page. */
const DESKTOP = !!(window.__TAURI__ && window.__TAURI__.core);
const KEYCHAIN = "stored-in-system-keychain";        // placeholder: the real key stays in Rust
const invoke = DESKTOP ? window.__TAURI__.core.invoke : null;

const bytesToB64 = (u8)=>{ let s = ""; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); };
const b64ToBytes = (b)=> Uint8Array.from(atob(b), c=>c.charCodeAt(0));
let fetchSeq = 0;
async function desktopFetch(input, init={}){
  const req = new Request(input, init);
  const id = ++fetchSeq;
  const headers = [...req.headers.entries()];
  const buf = (req.method==="GET" || req.method==="HEAD") ? null : new Uint8Array(await req.arrayBuffer());
  const body = buf && buf.length ? bytesToB64(buf) : null;
  const signal = init.signal || req.signal;
  return new Promise((resolve, reject)=>{
    let ctrl, headDone = false, closed = false;
    const stream = new ReadableStream({ start(c){ ctrl = c; }, cancel(){ invoke("api_abort",{id}).catch(()=>{}); } });
    const fail = (e)=>{ if(closed) return; closed = true; if(!headDone) reject(e); else { try{ ctrl.error(e); }catch{} } };
    const ch = new window.__TAURI__.core.Channel();
    ch.onmessage = (m)=>{
      if(m.event==="head"){ headDone = true; const st = m.data.status; resolve(new Response([101,204,205,304].includes(st) ? null : stream, {status:st, headers:m.data.headers})); }
      else if(m.event==="chunk"){ try{ ctrl.enqueue(b64ToBytes(m.data.b64)); }catch{} }
      else if(m.event==="end"){ if(!closed){ closed = true; try{ ctrl.close(); }catch{} } }
      else if(m.event==="error") fail(new TypeError(m.data.message));
    };
    if(signal){
      if(signal.aborted) return reject(new DOMException("Aborted","AbortError"));
      signal.addEventListener("abort", ()=>{ invoke("api_abort",{id}).catch(()=>{}); fail(new DOMException("Aborted","AbortError")); }, {once:true});
    }
    invoke("api_fetch", {id, url:req.url, method:req.method, headers, body, onEvent:ch}).catch(e=>fail(new TypeError(String(e))));
  });
}

const canEncrypt = !!(globalThis.crypto && crypto.subtle);
const b64 = buf => { let s=""; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}

  const iter = 600000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveKey(pass, salt, iter);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(apiKey));
  return {v:1, kdf:"PBKDF2-SHA256", iter, salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function decryptKey(enc, pass){
  const k = await deriveKey(pass, unb64(enc.salt), enc.iter||600000);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(enc.iv)}, k, unb64(enc.ct)));
}

  const pr = priceFor(model); if(!pr || !u) return null;
  const inp = u.input_tokens||0, cw = u.cache_creation_input_tokens||0, cr = u.cache_read_input_tokens||0, out = u.output_tokens||0;

}

  if(e.status===401) return "Your API key was rejected (401). Check it in Settings.";
  if(e.status===403) return "Not allowed (403): " + msg;
  if(e.status===404) return "Not found (404): " + msg;
  if(e.status===409) return "Conflict (409): " + msg;
  if(e.status===429) return "Rate limited (429) — wait a moment and try again.";
  if(e.status) return `${msg} (${e.status})`;
  if(/Failed to fetch|NetworkError|Load failed|Connection error/i.test(msg))
    return DESKTOP ? "Couldn’t reach api.anthropic.com — check your connection." :

/** Line diff (LCS) for two JSON-able values. */
function diffLines(a, b){
  const A = (typeof a==="string"? a : JSON.stringify(a, null, 2)).split("\n"), B = (typeof b==="string"? b : JSON.stringify(b, null, 2)).split("\n");
  const n = A.length, m = B.length;
  if(n*m > 4e6) return [...A.map(t=>({t, k:"del"})), ...B.map(t=>({t, k:"add"}))];
  const L = Array.from({length:n+1}, ()=> new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out = []; let i=0, j=0;
  while(i<n && j<m){ if(A[i]===B[j]){ out.push({t:A[i], k:"same"}); i++; j++; } else if(L[i+1][j] >= L[i][j+1]) out.push({t:A[i++], k:"del"}); else out.push({t:B[j++], k:"add"}); }
  while(i<n) out.push({t:A[i++], k:"del"}); while(j<m) out.push({t:B[j++], k:"add"});
  return out;
}
function diffView(a, b, context=3){
  const lines = diffLines(a, b), pre = h("div",{class:"diff"});
  if(!lines.some(l=>l.k!=="same")){ pre.append(h("div",{class:"gap"},"No differences.")); return pre; }
  const keep = lines.map((l,i)=> l.k!=="same" || lines.slice(Math.max(0,i-context), i+context+1).some(x=>x.k!=="same"));
  let skipped = 0;
  lines.forEach((l,i)=>{
    if(!keep[i]){ skipped++; return; }
    if(skipped){ pre.append(h("div",{class:"gap"}, `… ${skipped} unchanged line${skipped>1?"s":""}`)); skipped = 0; }
    pre.append(h("div",{class:l.k}, l.t));
  });
  if(skipped) pre.append(h("div",{class:"gap"}, `… ${skipped} unchanged line${skipped>1?"s":""}`));
  return pre;
}
async function sha256Hex(text){ const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function readFileAs(file, how){ return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = ()=>rej(r.error); r[how](file); }); }
async function saveBlob(blob, name){
  name = (String(name||"file").split(/[\\/]/).pop().replace(/[^\w.\- ()]/g,"_").slice(0,120)) || "file";
  if(DESKTOP){ const where = await invoke("save_bytes",{name, b64:bytesToB64(new Uint8Array(await blob.arrayBuffer()))}).catch(e=>{ toast(String(e)); return null; }); if(where) toast("Saved to "+where); return; }
  const url = URL.createObjectURL(blob); const a = h("a",{href:url, download:name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); }

const SANDBOX_TOOLS = [
  {name:"bash",       desc:"Run shell commands in the sandbox", def:"always_ask"},
  {name:"read",       desc:"Read files",                         def:"always_allow"},
  {name:"write",      desc:"Create files",                       def:"always_ask"},
  {name:"edit",       desc:"Change files",                       def:"always_ask"},
  {name:"glob",       desc:"Find files by pattern",              def:"always_allow"},
  {name:"grep",       desc:"Search inside files",                def:"always_allow"},
  {name:"web_search", desc:"Search the web ($10 per 1,000 searches)", def:"always_allow", off:true},
  {name:"web_fetch",  desc:"Read web pages",                     def:"always_allow", off:true},
];
const TOOLSET = "agent_toolset_20260401";
const PERMS = [
  {value:"always_allow", label:"Allow", cls:"p-allow", title:"Runs without asking"},
  {value:"always_ask",   label:"Ask",   cls:"p-ask",   title:"Pauses for your approval every time"},
  {value:"auto",         label:"Auto",  cls:"p-auto",  title:"Anthropic’s safety check decides: runs, blocks, or asks you"},
];
const ANTHROPIC_SKILLS = [["xlsx","Excel"],["docx","Word"],["pptx","PowerPoint"],["pdf","PDF"]];
const CONFIG_KEYS = ["name","description","model","system","tools","mcp_servers","skills","multiagent"];
let agentCache = null;   // [{id,name,…}] for pickers
async function agentList(force=false){
  if(!agentCache || force) agentCache = await listAll(C().beta.agents.list({limit:100}), 1000);
  return agentCache;
}
function pickConfig(a){ const o = {}; for(const k of CONFIG_KEYS) if(a[k] !== undefined) o[k] = structuredClone(a[k]); return o; }
function initials(name){ return (String(name||"?").match(/\b\w/g)||["?"]).slice(0,2).join("").toUpperCase(); }
const toolCount = (a)=> (a.tools||[]).reduce((n,t)=> n + (t.type===TOOLSET ? SANDBOX_TOOLS.filter(s=>toolEnabled(t,s.name)).length : t.type==="custom" ? 1 : 1), 0);
function toolEnabled(ts, name){ const c = (ts.configs||[]).find(c=>c.name===name); return (c?.enabled ?? ts.default_config?.enabled ?? true) !== false; }
function toolPerm(ts, name){ const c = (ts.configs||[]).find(c=>c.name===name); return c?.permission_policy?.type || ts.default_config?.permission_policy?.type || "always_allow"; }

function agentCard(a){

}

async function viewAgents(){

    if(!items.length) listEl.replaceChildren(h("div",{class:"empty"}, h("div",{class:"ic"}, icon("bot")), h("b",{},"No agents yet"),
      h("p",{},"An agent is a saved setup — a model, instructions and tools — that runs in Anthropic’s cloud. Create one, then talk to it."),

      h("button",{class:"btn sm ghost", onclick:load}, icon("refresh"), "Refresh")),
    listEl));
  load();
}

/* ---------- agent page ---------- */
async function viewAgent(id, tab="configure"){
  if(id==="new") return agentEditor(null);
  const body = shell({crumb:[["Agents","agents"]], title:"Loading…"});
  const a = await api(c=>c.beta.agents.retrieve(id), "Agent");
  if(!a){ body.append(h("div",{class:"err"},"Couldn’t load this agent.")); return; }
  const tabs = [{id:"configure", label:"Configure"}, {id:"versions", label:"Versions", n:a.version}, {id:"sessions", label:"Sessions"}, {id:"schedules", label:"Schedules"}, {id:"json", label:"JSON"}];
  const more = h("button",{class:"iconBtn", title:"More"}, icon("menu"));
  more.onclick = ()=> popMenu(more, [
    {label:"Duplicate", sub:"A new agent with the same setup", value:"dup", icon:"copy"},
    {label:"Copy ID", value:"id", icon:"copy"},
    ...(a.archived_at ? [] : [{label:"Archive agent…", sub:"Permanent — it can’t be undone", value:"archive", icon:"archive", danger:true}]),
  ], async v=>{
    if(v==="id") copyText(a.id);
    if(v==="dup"){ const cfg = pickConfig(a); cfg.name = a.name+" (copy)"; const n = await api(c=>c.beta.agents.create(cfg), "Duplicate"); if(n){ agentCache = null; toast("Duplicated"); go(`agents/${n.id}`); } }
    if(v==="archive"){
      if(!await typedConfirm("Archive this agent?", "Archiving is permanent. The agent becomes read-only, new sessions can’t use it, and its schedules are archived too. Running sessions carry on. There is no undo and agents can’t be deleted.", a.name, "Archive forever")) return;
      if(await api(c=>c.beta.agents.archive(a.id), "Archive")){ agentCache = null; toast("Agent archived"); route(); }
    }
  });
  const b = shell({crumb:[["Agents","agents"]], title:a.name,
    sub:[idTag(a.id), chip("v"+a.version,"mono"), chip(modelName(a.model)), a.archived_at ? chip("Archived","bad") : "", h("span",{}, "updated "+ago(a.updated_at))],
    actions:[a.archived_at ? "" : h("button",{class:"btn primary", onclick:()=>newSessionDialog({agent:a})}, icon("chat"), "Talk to it"), more],
    tabs, tab, tabBase:`agents/${a.id}`});
  if(tab==="configure") return agentEditor(a, b);
  if(tab==="json") return agentJson(a, b);
  if(tab==="versions") return agentVersions(a, b);
  if(tab==="sessions") return sessionsInto(b, {agent_id:a.id}, a);
  if(tab==="schedules") return deploymentsInto(b, {agent_id:a.id}, a);
}

function blankAgent(){
  return {name:"", description:"", model:{id:"claude-opus-5-5"}, system:"",
    tools:[{type:TOOLSET, default_config:{enabled:true, permission_policy:{type:"always_allow"}},
      configs: SANDBOX_TOOLS.map(t=>({name:t.name, enabled:!t.off, permission_policy:{type:t.def}}))}],
    mcp_servers:[], skills:[], multiagent:null};
}

async function agentEditor(a, body){
  const isNew = !a;
  if(isNew) body = shell({crumb:[["Agents","agents"]], title:"New agent", sub:"Set it up, save it, then talk to it."});
  const cfg = isNew ? blankAgent() : pickConfig(a);
  if(typeof cfg.model==="string") cfg.model = {id:cfg.model};
  const others = (await agentList().catch(()=>[])).filter(x=>!a || x.id!==a.id);

  const name = field({value:cfg.name, placeholder:"e.g. Support triage"});
  const desc = field({value:cfg.description||"", placeholder:"What it’s for (optional)"});
  const modelSel = select([...MODELS.map(m=>({value:m.id, label:`${m.name} — ${m.sub}`})), ...(MODELS.some(m=>m.id===cfg.model.id)?[]:[{value:cfg.model.id, label:cfg.model.id}])], cfg.model.id);
  const effortSel = select(EFFORTS.map(e=>({value:e.id, label:e.name})), cfg.model.effort?.type || cfg.model.effort || "");
  const fast = h("input",{type:"checkbox", class:"switch", checked: cfg.model.speed==="fast"});
  const system = area({rows:12, placeholder:"Instructions the agent always follows: its job, tone, what to do and not do, when to ask.", value:cfg.system||""});

  // sandbox tools
  let ts = (cfg.tools||[]).find(t=>t.type===TOOLSET);
  const tsOn = h("input",{type:"checkbox", class:"switch", checked:!!ts});
  const toolState = SANDBOX_TOOLS.map(t=>({...t, enabled: ts ? toolEnabled(ts, t.name) : !t.off, perm: ts ? toolPerm(ts, t.name) : t.def,
    extra: structuredClone((ts?.configs||[]).find(c=>c.name===t.name) || {})}));
  const toolRows = toolState.map(t=>{
    const en = h("input",{type:"checkbox", checked:t.enabled, onchange:(e)=>{ t.enabled = e.target.checked; }});
    const domains = (t.name==="web_search"||t.name==="web_fetch") ? field({placeholder:"Only these sites (optional): example.com, docs.example.org", value:(t.extra.allowed_domains||[]).join(", "), style:"height:30px;font-size:12.5px;margin-top:6px"}) : null;
    if(domains) domains.oninput = ()=>{ t.domains = domains.value; };
    return h("tr",{}, h("td",{}, h("label",{class:"check"}, en)),
      h("td",{}, h("div",{class:"nm"}, t.name), h("div",{class:"ds"}, t.desc), domains),
      h("td",{style:"text-align:right"}, seg(PERMS, t.perm, v=>{ t.perm = v; })));
  });

  // MCP servers
  const mcpState = (cfg.mcp_servers||[]).map(s=>{ const tset = (cfg.tools||[]).find(t=>t.type==="mcp_toolset" && t.mcp_server_name===s.name);
    return {name:s.name, url:s.url, perm: tset?.default_config?.permission_policy?.type || "always_ask", toolset: tset ? structuredClone(tset) : null}; });
  const mcpBox = h("div",{});
  const drawMcp = ()=> mcpBox.replaceChildren(...mcpState.map((s,i)=>{
    const n = field({value:s.name, placeholder:"name, e.g. github", style:"max-width:180px"}); n.oninput = ()=>{ s.name = n.value.trim(); };
    const u = field({value:s.url, placeholder:"https://mcp.example.com/mcp", class:"field mono"}); u.oninput = ()=>{ s.url = u.value.trim(); };
    return h("div",{class:"box"}, h("div",{class:"inline"}, n, u, h("button",{class:"iconBtn sm", title:"Remove", onclick:()=>{ mcpState.splice(i,1); drawMcp(); }}, icon("x"))),
      h("div",{class:"inline", style:"margin-top:8px"}, h("span",{class:"hint"},"Its tools:"), seg(PERMS, s.perm, v=>{ s.perm = v; })));
  }), h("button",{class:"btn sm", onclick:()=>{ mcpState.push({name:"", url:"", perm:"always_ask"}); drawMcp(); }}, icon("plus"), "Add MCP server"));
  drawMcp();

  // custom tools
  const customState = (cfg.tools||[]).filter(t=>t.type==="custom").map(t=>({name:t.name, description:t.description||"", schema: JSON.stringify(t.input_schema||{type:"object", properties:{}}, null, 2)}));
  const customBox = h("div",{});
  const drawCustom = ()=> customBox.replaceChildren(...customState.map((t,i)=>{
    const n = field({value:t.name, placeholder:"tool_name", class:"field mono", style:"max-width:220px"}); n.oninput = ()=>{ t.name = n.value.trim(); };
    const d = field({value:t.description, placeholder:"What it does and when to use it"}); d.oninput = ()=>{ t.description = d.value; };
    const s = area({rows:5, class:"field code"}); s.value = t.schema; s.oninput = ()=>{ t.schema = s.value; };
    return h("div",{class:"box"}, h("div",{class:"inline"}, n, d, h("button",{class:"iconBtn sm", title:"Remove", onclick:()=>{ customState.splice(i,1); drawCustom(); }}, icon("x"))),
      h("div",{class:"hint", style:"margin:8px 0 4px"},"Input schema (JSON Schema). You answer these calls yourself while talking to the agent."), s);
  }), h("button",{class:"btn sm", onclick:()=>{ customState.push({name:"", description:"", schema:'{\n  "type": "object",\n  "properties": {}\n}'}); drawCustom(); }}, icon("plus"), "Add custom tool"));
  drawCustom();

  // skills
  const skills = cfg.skills||[];
  const skillChecks = ANTHROPIC_SKILLS.map(([id,label])=> ({id, el:h("input",{type:"checkbox", checked: skills.some(s=>s.type==="anthropic" && s.skill_id===id)}), label}));
  const customSkills = field({class:"field mono", placeholder:"skill_01… , skill_02…@3", value: skills.filter(s=>s.type==="custom").map(s=> s.skill_id + (s.version && s.version!=="latest" ? "@"+s.version : "")).join(", ")});

  // team (multi-agent)
  const ma = cfg.multiagent ? structuredClone(cfg.multiagent) : null;
  const maSupported = !ma || ma.type==="multiagent_20261001";
  const maOn = h("input",{type:"checkbox", class:"switch", checked:!!ma, disabled:!maSupported});
  const preset = new Set((ma?.subagents?.predefined_agents||[]).map(x=> typeof x==="string" ? x : x.type==="self" ? "self" : x.id));
  const teamChecks = [{id:"self", name:"Copies of itself"}, ...others.filter(o=>!o.archived_at && !o.multiagent)].map(o=>
    h("label",{class:"check", style:"margin:3px 14px 3px 0"}, h("input",{type:"checkbox", checked:preset.has(o.id), onchange:(e)=>{ e.target.checked ? preset.add(o.id) : preset.delete(o.id); }}), o.name));
  const inlineOn = h("input",{type:"checkbox", checked: (ma?.subagents?.inline_agents?.type ?? "enabled")==="enabled"});
  const wfOn = h("input",{type:"checkbox", checked: ma ? (ma.workflows?.type ?? "enabled")==="enabled" : false});
  const advOn = h("input",{type:"checkbox", checked: ma?.advisor?.type==="enabled"});
  const advModel = select(MODELS.map(m=>({value:m.id, label:m.name})), ma?.advisor?.model || "claude-opus-5-5", {style:"max-width:200px;height:32px"});
  const teamBox = h("div",{class:"box", style: ma ? "" : "display:none"},
    h("div",{class:"hint", style:"margin-bottom:6px"},"Agents it can hand work to (each must not have a team of its own):"), h("div",{}, teamChecks),
    h("label",{class:"check", style:"margin-top:10px"}, inlineOn, "Let it create helpers on the fly"),
    h("br"), h("label",{class:"check", style:"margin-top:6px"}, wfOn, "Let it run background workflows (set a spending cap on sessions)"),
    h("div",{class:"inline", style:"margin-top:6px"}, h("label",{class:"check"}, advOn, "Consult an advisor model"), advModel));
  maOn.onchange = ()=>{ teamBox.style.display = maOn.checked ? "" : "none"; };

  const meta = area({rows:3, class:"field code", placeholder:'{"team": "support"}'}); meta.value = a && Object.keys(a.metadata||{}).length ? JSON.stringify(a.metadata, null, 2) : "";
  const status = h("span",{class:"msg"});

  function build(){
    const out = {name:name.value.trim(), description: desc.value.trim() || null, system: system.value || null};
    if(!out.name) throw new Error("Give the agent a name.");
    const model = {...cfg.model, id: modelSel.value};
    if(effortSel.value) model.effort = effortSel.value; else delete model.effort;
    if(fast.checked) model.speed = "fast"; else delete model.speed;
    out.model = model;
    const tools = [];
    if(tsOn.checked){
      tools.push({type:TOOLSET, default_config:{enabled:true, permission_policy:{type:"always_allow"}},
        configs: toolState.map(t=>{
          const c = {...t.extra, name:t.name, enabled:t.enabled, permission_policy:{type:t.perm}}; delete c.type;
          if(t.domains !== undefined){ const d = t.domains.split(/[\s,]+/).map(x=>x.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"")).filter(Boolean); if(d.length){ c.allowed_domains = d; delete c.blocked_domains; } else delete c.allowed_domains; }
          return c; })});
    }
    const names = new Set();
    for(const s of mcpState){
      if(!s.name && !s.url) continue;
      if(!/^[\w.-]{1,255}$/.test(s.name)) throw new Error(`MCP server name “${s.name}” — use letters, numbers, dots, dashes or underscores.`);
      if(!/^https:\/\//i.test(s.url)) throw new Error(`MCP server “${s.name}” needs an https:// URL.`);
      if(names.has(s.name)) throw new Error(`Two MCP servers are called “${s.name}”.`); names.add(s.name);
      const tset = s.toolset || {type:"mcp_toolset", mcp_server_name:s.name};
      tset.mcp_server_name = s.name; tset.default_config = {...(tset.default_config||{}), permission_policy:{type:s.perm}};
      tools.push(tset);
    }
    for(const t of customState){
      if(!t.name && !t.description) continue;
      if(!/^[A-Za-z0-9_-]{1,128}$/.test(t.name)) throw new Error(`Custom tool name “${t.name}” — letters, numbers, - and _ only.`);
      const sc = parseJSON(t.schema, `Schema for ${t.name}`); if(!sc.ok) throw new Error(sc.error);
      tools.push({type:"custom", name:t.name, description:t.description, input_schema: sc.value || {type:"object", properties:{}}});
    }
    out.tools = tools;
    out.mcp_servers = mcpState.filter(s=>s.name).map(s=>({type:"url", name:s.name, url:s.url}));
    const sk = skillChecks.filter(s=>s.el.checked).map(s=>({type:"anthropic", skill_id:s.id}));
    for(const tok of customSkills.value.split(/[\s,]+/).filter(Boolean)){ const [sid, ver] = tok.split("@"); sk.push(ver ? {type:"custom", skill_id:sid, version:ver} : {type:"custom", skill_id:sid}); }
    if(sk.length && tsOn.checked && !toolState.find(t=>t.name==="read").enabled) throw new Error("Skills need the “read” tool switched on.");
    out.skills = sk;
    if(!maSupported) out.multiagent = cfg.multiagent;
    else if(maOn.checked){
      const m = ma ? structuredClone(ma) : {type:"multiagent_20261001"};
      const list = [...preset].map(x=> x==="self" ? {type:"self"} : x);
      m.subagents = {...(m.subagents||{}), type:"enabled", predefined_agents:list, inline_agents:{type: inlineOn.checked ? "enabled" : "disabled"}};
      if(!list.length && !inlineOn.checked) throw new Error("A team needs at least one member, or “create helpers on the fly” switched on.");
      m.workflows = wfOn.checked ? {...(m.workflows||{}), type:"enabled"} : {type:"disabled"};
      m.advisor = advOn.checked ? {type:"enabled", model:advModel.value} : {type:"disabled"};
      out.multiagent = m;
    } else out.multiagent = null;
    const md = parseJSON(meta.value, "Metadata"); if(!md.ok) throw new Error(md.error);
    if(md.value){
      if(typeof md.value!=="object" || Array.isArray(md.value)) throw new Error("Metadata must be an object of text values.");
      const patch = {...md.value}; if(a) for(const k of Object.keys(a.metadata||{})) if(!(k in patch)) patch[k] = null;   // removed keys
      out.metadata = patch;
    } else if(a && Object.keys(a.metadata||{}).length) out.metadata = Object.fromEntries(Object.keys(a.metadata).map(k=>[k,null]));
    return out;
  }

  async function save(force=false){
    let params; try{ params = build(); }catch(e){ status.className = "err"; status.textContent = e.message; return; }
    status.className = "msg"; status.textContent = "Saving…";
    try{
      if(isNew){ const n = await C().beta.agents.create(params); agentCache = null; toast("Agent created"); go(`agents/${n.id}`); return; }
      const n = await C().beta.agents.update(a.id, force ? params : {...params, version:a.version}, NO_RETRY);
      agentCache = null;
      if(n.version === a.version){ status.textContent = "No changes to save."; return; }
      toast(`Saved as version ${n.version}`); route();
    }catch(e){
      if(e.status===409 && !force){
        status.textContent = "";
        const ok = await confirmDialog("Someone else changed this agent", "It was saved somewhere else since you opened it. Overwrite their version with yours (it still becomes a new version, so nothing is lost), or cancel and reload?", "Save mine anyway", false);
        if(ok) return save(true);
        return;
      }
      status.className = "err"; status.textContent = errText(e);
    }
  }

  body.append(h("div",{class:"wrapW"},
    a?.archived_at ? h("div",{class:"note warn", style:"margin-bottom:16px"}, icon("archive"), "This agent is archived. It’s read-only and can’t be used for new sessions.") : "",
    h("div",{class:"form"},
      h("h3",{},"Basics"),
      h("label",{},"Name"), name,
      h("label",{},"Description", h("small",{},"For you and your team")), desc,

/* ---------- live session ---------- */
/** Keeps one session's event history in sync: stream first, then history, de-duplicated by id. */
class SessionFeed {
  constructor(sid, handlers){ this.sid = sid; this.h = handlers; this.byKey = new Map(); this.events = []; this.closed = false; this.lastAt = null; this.connected = false; }
  key(ev){ return ev.id || `${ev.type}@${ev.processed_at}`; }
  start(){ this.loop(); }
  stop(){ this.closed = true; try{ this.stream?.controller?.abort(); }catch{} }
  async loadHistory(){
    const params = {limit:1000};
    if(this.lastAt) params["created_at[gte]"] = this.lastAt;
    for await (const ev of C().beta.sessions.events.list(this.sid, params)){ if(this.closed) return; this.ingest(ev); }
  }
  ingest(ev){
    if(ev.type==="event_start" || ev.type==="event_delta"){ this.h.preview?.(ev); return; }
    const k = this.key(ev), old = this.byKey.get(k);
    if(old){
      if(old.processed_at==null && ev.processed_at){ old.processed_at = ev.processed_at; this.h.update?.(old); }
      return;
    }
    this.byKey.set(k, ev); this.events.push(ev);
    if(ev.processed_at && (!this.lastAt || ev.processed_at > this.lastAt)) this.lastAt = ev.processed_at;
    if(ev.type==="session.status_terminated" || ev.type==="session.deleted") this.ended = true;
    this.h.event(ev);
  }
  async loop(){
    let backoff = 1000;
    while(!this.closed){
      try{
        this.stream = await C().beta.sessions.events.stream(this.sid, {event_deltas:["agent.message","agent.thinking"]});
        this.connected = true; this.h.conn?.(true);
        await this.loadHistory();            // after the stream is open, so nothing falls in the gap
        this.h.synced?.();
        backoff = 1000;
        for await (const ev of this.stream){ if(this.closed) break; this.ingest(ev); }
      }catch(e){
        if(this.closed || e?.name==="AbortError") break;
        console.warn("session stream", e);
        if(e?.status===404 || e?.status===401){ this.h.fatal?.(e); break; }
        this.h.conn?.(false, e);
      }
      this.connected = false;
      if(this.closed || this.ended) break;
      await sleep(backoff); backoff = Math.min(backoff*2, 30000);
    }
  }
}

    else if(t==="agent.thread_message_sent" || t==="agent.thread_message_received"){
      const out = t.endsWith("sent"), who = out ? ev.to_agent_name : ev.from_agent_name;
      add(h("details",{class:"tool"}, h("summary",{}, icon("chevR","chev"), icon("users"), h("span",{class:"nm"}, out ? `→ ${who||"helper"}` : `← ${who||"helper"}`), h("span",{class:"pv"}, short(blocksText(ev.content), 140))),
        h("div",{class:"tb"}, renderMd(blocksText(ev.content)))));

  // ---- composer
  function buildComposer(){
    const ta = h("textarea",{rows:1, placeholder:"Message the agent…"});

    const atts = [];
    const drawAtts = ()=>{ attRow.style.display = atts.length ? "" : "none"; attRow.replaceChildren(...atts.map((a,i)=>h("span",{class:"att"}, icon(a.block.type==="image"?"eye":"file"), h("span",{}, a.name), h("button",{class:"iconBtn sm", onclick:()=>{ atts.splice(i,1); drawAtts(); }}, icon("x"))))); };

    const stopBtn = h("button",{class:"btn sm", style:"display:none", title:"Stop the agent"}, icon("stop"), "Stop");
    const st = h("span",{class:"st"});
    const attach = h("button",{class:"iconBtn", title:"Attach images, PDFs or text files"}, icon("clip"));
    const outcome = h("button",{class:"btn sm ghost", title:"Give it a goal with a rubric; a grader checks the work"}, icon("flag"), "Outcome");
    let running = false, blocked = false;
    const fit = ()=>{ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, innerHeight*0.4)+"px"; };
    ta.oninput = fit;
    ta.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); go_(); } };
    attach.onclick = ()=>{ const fi = $("#fileInput"); fi.value = ""; fi.accept = "image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.csv,.json,.txt"; fi.onchange = async()=>{
      for(const f of fi.files){
        if(f.size > 20*1024*1024){ toast(`${f.name} is over 20 MB`); continue; }
        if(/^image\//.test(f.type)) atts.push({name:f.name, block:{type:"image", source:{type:"base64", media_type:f.type, data:(await readFileAs(f,"readAsDataURL")).split(",")[1]}}});
        else if(f.type==="application/pdf") atts.push({name:f.name, block:{type:"document", title:f.name, source:{type:"base64", media_type:"application/pdf", data:(await readFileAs(f,"readAsDataURL")).split(",")[1]}}});
        else atts.push({name:f.name, block:{type:"document", title:f.name, source:{type:"text", media_type:"text/plain", data:await readFileAs(f,"readAsText")}}});
      } drawAtts(); }; fi.click(); };
    stopBtn.onclick = async()=>{ stopBtn.disabled = true; const r = await api(c=>c.beta.sessions.events.send(id, {events:[{type:"user.interrupt"}]}), "Stop"); stopBtn.disabled = false; if(r) toast("Stopping at the next safe point…"); };

    async function go_(){
      const text = ta.value.trim(); if(!text && !atts.length) return;

      const content = [...atts.map(a=>a.block), ...(text ? [{type:"text", text}] : [])];
      const r = await api(c=>c.beta.sessions.events.send(id, {events:[{type:"user.message", content}]}), "Send");
      send.disabled = false;

    send.onclick = go_;
    const el = h("div",{class:"composerBox"}, attRow, ta, h("div",{class:"composerBar"}, attach, outcome, h("span",{class:"sp"}), st, stopBtn, send));
    return {el, ta,
      setRunning(v){ running = v; stopBtn.style.display = v ? "" : "none"; st.textContent = v ? "Messages you send now are queued" : ""; },

/* ================= diagnose.js ================= */
/* ================= diagnose =================
   Sends a session's transcript and its agent's setup to a model (Messages API), which explains
   what happened and can propose changes to the agent. Proposals are shown as a diff and applied
   only when you click — as a new agent version. You can keep asking questions about the session. */
const DIAG_MAX_CHARS = 180000;
const DIAG_TOOL = {
  name:"propose_agent_change",
  description:"Propose a concrete change to the agent's saved setup. The user sees a diff and decides whether to apply it as a new agent version. Give the FULL new value of each field you change (lists like tools are replaced whole). Only include fields you want to change.",
  input_schema:{type:"object", required:["title","rationale","changes"], properties:{
    title:{type:"string", description:"Short name for the change, e.g. 'Ask before running bash'"},
    rationale:{type:"string", description:"Why this fixes what went wrong, citing event ids"},
    changes:{type:"object", description:"New values for agent fields", properties:{
      system:{type:"string"}, description:{type:"string"},
      model:{type:"object", properties:{id:{type:"string"}, effort:{type:"string", enum:["low","medium","high","xhigh","max"]}}, required:["id"]},
      tools:{type:"array", items:{type:"object"}}, mcp_servers:{type:"array", items:{type:"object"}}, skills:{type:"array", items:{type:"object"}},
    }},
  }},
};
const DIAG_SYSTEM = `You are an expert at debugging agents built on Anthropic's Managed Agents platform. The user runs Page Orbit, a tool for building and running these agents, and wants to understand one session.

You get: the agent's current saved setup, the setup the session actually ran with, and a condensed event log. Each log line starts with time since the session began and the event id (sevt_…).

How Managed Agents work (for your reasoning):
- An agent = model + system prompt + tools. Built-in sandbox tools (agent_toolset_20260401): bash, read, write, edit, glob, grep, web_search, web_fetch, each with enabled and a permission_policy: always_allow, always_ask (pauses for a human), or auto (a safety check allows, blocks or asks). MCP servers are reached through mcp_toolset entries; their credentials live in vaults attached when the session starts. Custom tools are answered by the user.
- The sandbox runs in an environment whose networking may be "limited" to listed hosts; blocked hosts look like network errors in tool results. Package managers and MCP servers need explicit allow flags under limited networking.
- session.error events carry a type and retry_status. session.status_idle carries a stop_reason: end_turn, requires_action (waiting on a person), retries_exhausted, budget_reached, refusal.
- Outcomes: a grader checks work against a rubric (span.outcome_evaluation_end: satisfied / needs_revision / max_iterations_reached / failed).

Write for a capable non-specialist. Be specific and brief:
1. **What happened** — two or three sentences.
2. **What went wrong** (if anything) — each issue with the event ids that show it, and its root cause: instructions, tool permissions, missing tools, environment networking, credentials, the model or effort level, or the user's request.
3. **Fixes** — for changes to the agent, call propose_agent_change (one call per independent fix; full new values). For changes you can't make directly (environment networking, vault credentials, a spending cap, the prompt the user sent), say exactly what to change and where in Page Orbit (Environments, Vaults, the session's spending cap).
If nothing went wrong, say so and suggest at most one or two improvements (for cost, speed or reliability). Never invent events. Never ask for or repeat secrets.`;

function condenseEvents(events){
  const t0 = events.find(e=>e.processed_at)?.processed_at;
  const rel = (e)=> t0 && e.processed_at ? "+"+((toMs(e.processed_at)-toMs(t0))/1000).toFixed(1)+"s" : "+?";
  const clip = (s, n)=>{ s = String(s ?? ""); return s.length > n ? s.slice(0, n) + ` …[${s.length-n} more chars]` : s; };
  const starts = new Map();
  const lines = [];
  for(const e of events){
    const head = `[${rel(e)}] ${e.id||"-"} ${e.type}`;
    const t = e.type;
    let body = "";
    if(t==="user.message" || t==="agent.message" || t==="system.message") body = clip(blocksText(e.content), 4000);
    else if(/tool_use$/.test(t)) body = `${e.mcp_server_name ? e.mcp_server_name+"/" : ""}${e.name} permission=${e.evaluated_permission||"-"}${e.evaluation?.type==="auto" ? " auto="+JSON.stringify(e.evaluation.evaluated_permission) : ""}${e.session_thread_id ? " thread="+e.session_thread_id : ""} input=${clip(JSON.stringify(e.input), 1500)}`;
    else if(/tool_result$/.test(t)) body = `for=${e.tool_use_id||e.mcp_tool_use_id||e.custom_tool_use_id} ${e.is_error ? "ERROR " : ""}${clip(blocksText(e.content), 2000)}`;
    else if(t==="user.tool_confirmation") body = `for=${e.tool_use_id} ${e.result}${e.deny_message ? " message="+clip(e.deny_message, 300) : ""}`;
    else if(t==="session.error") body = clip(JSON.stringify(e.error), 1200);
    else if(t==="session.status_idle") body = JSON.stringify(e.stop_reason||{}) + (e.stop_details ? " details="+JSON.stringify(e.stop_details) : "");
    else if(t==="span.model_request_start"){ starts.set(e.id, e); continue; }
    else if(t==="span.model_request_end"){ const st = starts.get(e.model_request_start_id); const u = e.model_usage||{}; body = `${st ? ((toMs(e.processed_at)-toMs(st.processed_at))/1000).toFixed(1)+"s " : ""}in=${u.input_tokens} out=${u.output_tokens} cache_read=${u.cache_read_input_tokens}${e.is_error ? " ERROR" : ""}`; }
    else if(t==="user.define_outcome") body = `goal=${clip(e.description, 1000)} rubric=${clip(e.rubric?.content || JSON.stringify(e.rubric), 2000)} max_iterations=${e.max_iterations}`;
    else if(t==="span.outcome_evaluation_end") body = `round ${e.iteration+1}: ${e.result} — ${clip(e.explanation, 1500)}`;
    else if(t==="session.usage") body = `cost_cents=${e.usage?.list_cost?.amount ?? "?"}`;
    else if(t==="agent.thread_message_sent" || t==="agent.thread_message_received") body = `${e.to_agent_name||e.from_agent_name||""}: ${clip(blocksText(e.content), 1500)}`;
    else if(t==="session.thread_created") body = e.agent_name;
    else if(t.startsWith("workflow_run.")) body = clip(JSON.stringify({name:e.name, result:e.result, error:e.error}), 600);
    else if(t==="span.outcome_evaluation_ongoing" || t==="agent.thinking") continue;
    lines.push(body ? `${head}: ${body}` : head);
  }
  let text = lines.join("\n");
  if(text.length > DIAG_MAX_CHARS){
    const head = text.slice(0, DIAG_MAX_CHARS*0.25), tail = text.slice(-DIAG_MAX_CHARS*0.75);
    text = head + `\n\n…[${text.length - DIAG_MAX_CHARS} characters of the middle of the log omitted]…\n\n` + tail;
  }
  return text;
}

async function openDiagnose(sess, events){
  if(!getClient()){ openSettings(); return; }
  const thread = h("div",{class:"diag"});
  const scroller = h("div",{style:"flex:1;min-height:0;overflow:auto;padding:4px 2px 10px"}, thread);
  const ta = h("textarea",{rows:1, placeholder:"Ask a follow-up about this session…"});
  const send = h("button",{class:"send", title:"Send"}, icon("up"));
  const modelSel = select(MODELS.map(m=>({value:m.id, label:m.name})), settings.diagModel, {style:"height:30px;width:auto;font-size:12.5px"});
  const costEl = h("span",{class:"hint"});
  const box = h("div",{class:"modal wide", style:"width:min(920px,100%);height:min(86vh,1000px);display:flex;flex-direction:column"},
    h("div",{class:"row", style:"margin-bottom:10px"}, h("h2",{style:"margin:0"}, "Diagnose"), h("span",{class:"sp"}), costEl, modelSel, h("button",{class:"iconBtn", title:"Close", onclick:()=>bg.close()}, icon("x"))),
    h("p",{class:"lead", style:"margin:0 0 10px"}, `Sends this session’s ${events.length} events and the agent’s setup to ${modelName(settings.diagModel)} to find what went wrong. Nothing changes unless you apply a fix.`),
    scroller,
    h("div",{class:"composerBox", style:"margin:8px 0 0;max-width:none"}, ta, h("div",{class:"composerBar"}, h("span",{class:"sp"}), send)));
  const bg = modal(box);
  modelSel.onchange = ()=>{ settings.diagModel = modelSel.value; saveSettings(); };
  const scroll = ()=> requestAnimationFrame(()=>{ scroller.scrollTop = scroller.scrollHeight; });
  let spent = 0, busy = false;

  thread.append(h("div",{class:"hint"},"Loading the agent’s current setup…"));
  const current = await C().beta.agents.retrieve(sess.agent.id).catch(()=>null);
  thread.replaceChildren();
  const ran = pickConfig(sess.agent);
  const intro = [
    `Session ${sess.id} (status: ${sess.status}${sess.title ? `, title: ${sess.title}` : ""}, environment ${sess.environment_id}${sess.budget ? `, spending cap ${sess.budget.max_list_cost?.amount} cents` : ""}).`,
    `\n## Setup the session ran with (agent ${sess.agent.id} version ${sess.agent.version})\n\`\`\`json\n${JSON.stringify(ran, null, 2)}\n\`\`\``,
    current && current.version !== sess.agent.version ? `\n## The agent's CURRENT saved setup (version ${current.version}) — propose changes against this one\n\`\`\`json\n${JSON.stringify(pickConfig(current), null, 2)}\n\`\`\`` : `\n(The agent's current saved setup is the same version.)`,
    sess.usage?.list_cost ? `\nSession list cost so far: $${(Number(sess.usage.list_cost.amount)/100).toFixed(2)}.` : "",
    `\n## Event log\n${condenseEvents(events)}`,
    `\n\nDiagnose this session.`,
  ].join("\n");
  const messages = [{role:"user", content:[{type:"text", text:intro, cache_control:{type:"ephemeral"}}]}];

  async function turn(){
    busy = true; send.disabled = true;
    for(let round=0; round<5; round++){
      const out = h("div",{class:"ev agent"}, h("div",{class:"av"}, icon("pulse")), h("div",{class:"body"}, h("div",{class:"who"}, modelName(settings.diagModel)), h("div",{class:"md"}, h("span",{class:"dots"}, h("i"),h("i"),h("i")))));
      thread.append(out); scroll();
      let text = "", final;
      try{
        const stream = C().beta.messages.stream({model:settings.diagModel, max_tokens:16000, thinking:{type:"adaptive"}, output_config:{effort:settings.diagEffort||"high"},
          system:DIAG_SYSTEM, messages, tools:[DIAG_TOOL]});
        let raf = 0;
        stream.on("text", (d)=>{ text += d; if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; out.querySelector(".md").replaceWith(renderMd(text)); scroll(); }); });
        final = await stream.finalMessage();
      }catch(e){ out.querySelector(".body").append(h("div",{class:"err"}, errText(e))); break; }
      out.querySelector(".md").replaceWith(renderMd(text || (final.content.some(b=>b.type==="tool_use") ? "" : "(no text)")));
      const c = costOf(final.model || settings.diagModel, final.usage); if(c) { spent += c; costEl.textContent = "~"+money(spent)+" so far"; }
      messages.push({role:"assistant", content:final.content});
      const uses = final.content.filter(b=>b.type==="tool_use");
      for(const u of uses) thread.append(proposalCard(u.input, current || sess.agent));
      scroll();
      if(final.stop_reason!=="tool_use" || !uses.length) break;
      messages.push({role:"user", content:uses.map(u=>({type:"tool_result", tool_use_id:u.id, content:"Shown to the user as a diff. They will decide whether to apply it."}))});
    }
    busy = false; send.disabled = false; ta.focus();
  }
  async function ask(){
    const q = ta.value.trim(); if(!q || busy) return;
    ta.value = ""; thread.append(h("div",{class:"diagMsg me"}, q)); scroll();
    messages.push({role:"user", content:[{type:"text", text:q}]});
    await turn();
  }
  send.onclick = ask;
  ta.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask(); } };
  turn();
}

function proposalCard(p, agent){
  const changes = p?.changes || {};
  const allowed = ["system","description","model","tools","mcp_servers","skills"];
  const patch = Object.fromEntries(Object.entries(changes).filter(([k])=>allowed.includes(k)));
  const before = pickConfig(agent), after = {...before, ...patch};
  if(patch.model && before.model && typeof before.model==="object") after.model = {...before.model, ...patch.model};
  const keys = Object.keys(patch);
  const status = h("span",{class:"hint"});
  const apply = h("button",{class:"btn primary"}, icon("check"), `Apply as version ${agent.version+1}`);
  apply.onclick = async()=>{
    apply.disabled = true; status.textContent = "Saving…";
    try{
      const upd = {version:agent.version}; for(const k of keys) upd[k] = after[k];
      const n = await C().beta.agents.update(agent.id, upd, NO_RETRY);
      agentCache = null; agent.version = n.version; Object.assign(agent, n);
      status.textContent = n.version ? `Saved as version ${n.version}. New sessions use it; this one keeps the version it started with.` : "Saved.";
      apply.replaceWith(h("button",{class:"btn", onclick:()=>{ document.querySelector(".modalBg")?.close?.(); newSessionDialog({agent:n}); }}, icon("play"), "Try it in a new session"));
    }catch(e){ apply.disabled = false; status.textContent = e.status===409 ? "The agent changed since this proposal was made — open the agent and apply it by hand." : errText(e); status.className = "err"; }
  };
  return h("div",{class:"proposal"},
    h("div",{class:"ph"}, icon("pen"), p?.title || "Proposed change"),
    h("div",{class:"why"}, renderMd(p?.rationale || "")),
    keys.length ? diffView(before, after) : h("p",{class:"hint"},"(No applicable changes in this proposal.)"),
    keys.length ? h("div",{class:"row"}, status, h("span",{class:"sp"}), apply) : "");
}

function credentialDialog(v, existing){
  const replacing = !!existing;
  let type = existing?.auth?.type || "static_bearer";
  const label = field({placeholder:"Label (optional)", value:existing?.display_name||""});
  const url = field({class:"field mono", placeholder:"https://mcp.example.com/mcp — must match the agent’s MCP server URL", value:existing?.auth?.mcp_server_url||"", disabled:replacing});
  const secret = field({type:"password", class:"field mono", autocomplete:"new-password", placeholder: replacing ? "New value" : "Token"});
  const refresh = field({type:"password", class:"field mono", autocomplete:"new-password", placeholder:"Refresh token (optional — lets Anthropic renew it)"});
  const clientId = field({class:"field mono", placeholder:"OAuth client ID", value:existing?.auth?.refresh?.client_id||"", disabled:replacing});
  const tokenUrl = field({class:"field mono", placeholder:"Token endpoint, https://…", value:existing?.auth?.refresh?.token_endpoint||"", disabled:replacing});
  const clientSecret = field({type:"password", class:"field mono", autocomplete:"new-password", placeholder:"Client secret (only if the server needs one)"});
  const expires = field({type:"datetime-local"});
  const secName = field({class:"field mono", placeholder:"API_KEY", value:existing?.auth?.secret_name||"", disabled:replacing});
  const secHosts = field({class:"field mono", placeholder:"api.example.com (hosts it may be sent to)", value:(existing?.auth?.networking?.allowed_hosts||[]).join(", ")});
  const err = h("span",{class:"err"});
  const area_ = h("div",{class:"form", style:"grid-template-columns:150px minmax(0,1fr)"});
  const draw = ()=>{
    area_.replaceChildren(h("label",{},"Label"), label);
    if(type==="static_bearer") area_.append(h("label",{},"MCP server URL"), url, h("label",{},"Bearer token"), secret);
    if(type==="mcp_oauth") area_.append(h("label",{},"MCP server URL"), url, h("label",{},"Access token"), secret, h("label",{},"Expires"), expires,
      h("label",{},"Refresh", h("small",{},"Optional")), h("div",{style:"display:grid;gap:8px"}, refresh, clientId, tokenUrl, clientSecret));
    if(type==="environment_variable") area_.append(h("label",{},"Variable name"), secName, h("label",{},"Value"), secret, h("label",{},"Only send to", h("small",{},"Leave empty to allow any host")), secHosts,
      h("label",{}), h("p",{class:"hint", style:"margin:0"},"The sandbox only ever sees a placeholder; the real value is swapped in on the way out, in headers and request bodies."));
  };
  const typeSeg = seg([{value:"static_bearer", label:"MCP token"}, {value:"mcp_oauth", label:"MCP OAuth"}, {value:"environment_variable", label:"Secret variable"}], type, x=>{ type = x; draw(); }, "seg");
  draw();
  const save = h("button",{class:"btn primary"}, icon("lock"), replacing ? "Replace secret" : "Save credential");
  save.onclick = async()=>{
    err.textContent = "";
    if(!secret.value && !(replacing && type==="environment_variable")){ err.textContent = "Enter the secret."; return; }
    let auth;
    if(type==="static_bearer") auth = replacing ? {type, token:secret.value} : {type, mcp_server_url:url.value.trim(), token:secret.value};
    if(type==="mcp_oauth"){
      auth = replacing ? {type, access_token:secret.value} : {type, mcp_server_url:url.value.trim(), access_token:secret.value};
      if(expires.value) auth.expires_at = new Date(expires.value).toISOString();
      if(refresh.value){
        auth.refresh = replacing ? {refresh_token:refresh.value} : {refresh_token:refresh.value, client_id:clientId.value.trim(), token_endpoint:tokenUrl.value.trim(),
          token_endpoint_auth: clientSecret.value ? {type:"client_secret_post", client_secret:clientSecret.value} : {type:"none"}};
        if(replacing && clientSecret.value) auth.refresh.token_endpoint_auth = {type:"client_secret_post", client_secret:clientSecret.value};
      }
    }
    if(type==="environment_variable"){
      const hs = secHosts.value.split(/[\s,]+/).filter(Boolean);
      auth = replacing ? {type, networking: hs.length ? {type:"limited", allowed_hosts:hs} : {type:"unrestricted"}} : {type, secret_name:secName.value.trim(), secret_value:secret.value, networking: hs.length ? {type:"limited", allowed_hosts:hs} : {type:"unrestricted"}};
      if(replacing && secret.value) auth.secret_value = secret.value;
      if(!replacing && !/^[A-Za-z_][A-Za-z0-9_]*$/.test(auth.secret_name)){ err.textContent = "Variable names use letters, numbers and _."; return; }
    }
    if(!replacing && type!=="environment_variable" && !/^https:\/\//.test(url.value.trim())){ err.textContent = "The MCP server URL must start with https://"; return; }
    save.disabled = true;
    try{
      const params = {auth}; if(label.value.trim()) params.display_name = label.value.trim();
      if(replacing) await C().beta.vaults.credentials.update(existing.id, {vault_id:v.id, ...params});
      else await C().beta.vaults.credentials.create(v.id, params);
      secret.value = refresh.value = clientSecret.value = "";           // don't keep secrets around
      bg.remove(); toast(replacing ? "Secret replaced" : "Credential saved"); route();
    }catch(e){ save.disabled = false; err.textContent = errText(e); }
  };
  const bg = modal(h("div",{class:"modal wide"}, h("h2",{}, replacing ? "Replace secret" : "Add credential"),
    h("p",{class:"lead"}, "Sent once, straight to Anthropic, over an encrypted connection. Page Orbit doesn’t store it."),
    replacing ? "" : h("div",{style:"margin-bottom:16px"}, typeSeg), area_,
    h("div",{class:"actions"}, err, h("span",{class:"sp"}), h("button",{class:"btn", onclick:()=>{ secret.value = ""; bg.remove(); }},"Cancel"), save)),
    ()=>{ secret.value = refresh.value = clientSecret.value = ""; });
  setTimeout(()=> (replacing ? secret : url).focus());
}

    h("div",{class:"tt"},
      crumb ? h("div",{class:"crumb"}, crumb.map(([l,p],i)=>[i? icon("chevR") : "", h("button",{onclick:()=>go(p)}, l)])) : "",
      h("h1",{}, title||""), sub ? h("div",{class:"sub"}, sub) : ""),
    ...(actions||[]));
  const body = h("div",{class:"viewBody"});
  const kids = [head];
  if(tabs) kids.push(h("div",{style:"padding:0 28px"}, h("div",{class:"tabs wrapW", style:"margin-bottom:0"}, tabs.map(t=>h("button",{class:t.id===tab?"on":"", onclick:()=>go(`${tabBase}/${t.id}`)}, t.label, t.n!=null ? h("span",{class:"n"}, t.n) : "")))));
  if(tabs) body.style.paddingTop = "18px";
  kids.push(body);
  view.replaceChildren(...kids);
  return body;
}
async function route(){
  try{ cleanup?.(); }catch{} cleanup = null; activeFeed?.stop(); activeFeed = null;
  closeMenu(); document.body.classList.remove("navOpen");
  const path = location.hash.replace(/^#\/?/,"").split("?")[0];
  const [sec, id, tab] = path.split("/").map(decodeURIComponent);
  currentSection = sec || "home"; renderNav();
  const view = document.getElementById("view");
  if(!getClient() && currentSection!=="home"){ currentSection = "home"; renderNav(); return viewHome(); }
  try{
    let r;
    switch(currentSection){
      case "agents": r = id ? viewAgent(id, tab) : viewAgents(); break;
      case "sessions": r = id ? viewSession(id, tab) : viewSessions(); break;
      case "environments": r = id ? viewEnvironment(id) : viewEnvironments(); break;
      case "vaults": r = id ? viewVault(id) : viewVaults(); break;
      case "schedules": r = id ? viewSchedule(id, tab||"settings") : viewSchedules(); break;
      case "memory": r = id ? viewStore(id) : viewMemory(); break;
      default: r = viewHome();
    }
    const c = await r; if(typeof c==="function") cleanup = c;
  }catch(e){ console.error(e); view.replaceChildren(h("div",{class:"viewBody"}, h("div",{class:"note bad", style:"margin-top:30px"}, icon("alert"), errText(e)))); }
}

function renderNav(){
  const list = document.getElementById("navList");
  list.replaceChildren(...NAV.flatMap(g=>[g.group ? h("div",{class:"navGroup"}, g.group) : "", ...g.items.map(it=>
    h("button",{class:"navItem"+(currentSection===it.id?" on":""), onclick:()=>go(it.id==="home" ? "" : it.id)}, icon(it.icon), it.label))]));
}
function renderChrome(){
  document.getElementById("brandMark").replaceChildren(icon("mark"));
  const ks = document.getElementById("keyState");
  ks.className = "keyState" + (settings.apiKey ? " ok" : "");
  ks.querySelector(".kt").textContent = settings.apiKey ? (DESKTOP ? "Key in keychain" : "Key added") : isLocked() ? "Locked" : "No API key";
  ks.onclick = ()=> isLocked() ? unlockDialog().then(ok=>ok && route()) : openSettings();
  const tb = document.getElementById("themeBtn"); tb.replaceChildren(icon(isDark() ? "sun" : "moon"));
  tb.onclick = ()=>{ settings.theme = isDark() ? "light" : "dark"; saveSettings(); };
  const sb = document.getElementById("settingsBtn"); sb.replaceChildren(icon("sliders")); sb.onclick = openSettings;
  renderNav();
}

/* ---------- overview ---------- */
async function viewHome(){
  const view = document.getElementById("view");
  const body = shell({});
  body.parentElement.querySelector(".viewHead").style.minHeight = "0";
  if(!getClient()){
    body.append(h("div",{class:"hero"},
      h("div",{class:"mk"}, icon("mark")),
      h("h1",{},"Build, run and fix ", h("em",{},"agents")),
      h("p",{},"Page Orbit is a free control room for Anthropic’s Managed Agents, using your own API key. Create agents, talk to them while they work, see exactly what they did, and let a model diagnose what went wrong."),
      h("div",{class:"row", style:"justify-content:center"},
        isLocked() ? h("button",{class:"btn primary", onclick:()=>unlockDialog().then(ok=>ok && route())}, icon("key"), "Unlock") : h("button",{class:"btn primary", onclick:openSettings}, icon("key"), "Add your API key")),
      h("div",{class:"steps"},
        h("div",{}, h("i",{},"01"), h("b",{},"Create an agent"), h("span",{},"Pick a model, write its instructions, choose its tools and what needs your approval.")),
        h("div",{}, h("i",{},"02"), h("b",{},"Talk to it"), h("span",{},"It works in its own cloud sandbox. Watch every step, approve what it asks, stop it any time.")),
        h("div",{}, h("i",{},"03"), h("b",{},"Diagnose & improve"), h("span",{},"One click explains what went wrong and proposes a fix, saved as a new version you can roll back."))),
      h("p",{class:"hint", style:"margin-top:26px"}, DESKTOP ? "Your key is kept in your system keychain." : "Your key stays in this browser and is only ever sent to api.anthropic.com. ", "Not affiliated with Anthropic.")));
    return;
  }
  const recent = h("div",{class:"list"}, h("div",{class:"hint"},"Loading…"));
  const agentsEl = h("div",{class:"list"}, h("div",{class:"hint"},"Loading…"));
  const head = h("div",{class:"row", style:"margin:4px 0 22px"},
    h("div",{}, h("h1",{style:"margin:0;font:650 30px/1.1 var(--serif);letter-spacing:-.03em"}, "Mission control"), h("div",{class:"hint", style:"margin-top:4px"},"Your agents and what they’ve been doing.")),
    h("span",{class:"sp"}),
    h("button",{class:"btn", onclick:()=>go("agents/new")}, icon("plus"), "New agent"),
    h("button",{class:"btn primary", onclick:()=>newSessionDialog({})}, icon("play"), "Start a session"));
  body.append(h("div",{class:"wrapW"}, head,
    h("div",{class:"row", style:"margin-bottom:8px"}, h("b",{},"Recent sessions"), h("span",{class:"sp"}), h("button",{class:"btn sm ghost", onclick:()=>go("sessions")}, "All sessions", icon("chevR"))), recent,
    h("div",{class:"row", style:"margin:26px 0 8px"}, h("b",{},"Agents"), h("span",{class:"sp"}), h("button",{class:"btn sm ghost", onclick:()=>go("agents")}, "All agents", icon("chevR"))), agentsEl));
  const [ss, as] = await Promise.all([api(c=>c.beta.sessions.list({limit:6, order:"desc"}), "Sessions"), api(c=>agentList(true), "Agents")]);
  if(ss) recent.replaceChildren(...(ss.data.length ? ss.data.map(sessionCard) : [h("div",{class:"empty", style:"padding:28px"}, h("p",{style:"margin:0"},"No sessions yet."))]));
  else recent.replaceChildren(h("div",{class:"err"},"Couldn’t load sessions."));
  if(as) agentsEl.replaceChildren(...(as.length ? as.filter(a=>!a.archived_at).slice(0,6).map(agentCard) : [h("div",{class:"empty"}, h("div",{class:"ic"}, icon("bot")), h("b",{},"Create your first agent"), h("p",{},"Start from safe defaults: it can read and search freely, and asks before running commands or changing files."), h("button",{class:"btn primary", onclick:()=>go("agents/new")}, icon("plus"), "New agent"))]));
}

/* ---------- settings ---------- */
function auraKey(){ try{ const s = JSON.parse(localStorage.getItem("cc.settings")||"{}"); return s.keyEnc ? {keyEnc:s.keyEnc} : s.apiKey ? {apiKey:s.apiKey} : null; }catch{ return null; } }
function openSettings(){
  const key = h("input",{class:"field", type:"password", value: DESKTOP ? "" : settings.apiKey, placeholder: DESKTOP && settings.apiKey ? "Saved in your system keychain — paste a new key to replace it" : "sk-ant-…", autocomplete:"off", spellcheck:"false"});
  const eye = h("button",{class:"btn", type:"button", title:"Show / hide", onclick:()=>{ key.type = key.type==="password"?"text":"password"; }}, icon("eye"));
  const remember = h("input",{type:"checkbox", class:"switch", checked:settings.remember});
  const protect = h("input",{type:"checkbox", class:"switch", checked:!!settings.keyEnc, disabled:!canEncrypt});
  const p1 = h("input",{class:"field", type:"password", placeholder:"New passphrase (8+ characters)", autocomplete:"new-password"});
  const p2 = h("input",{class:"field", type:"password", placeholder:"Repeat passphrase", autocomplete:"new-password"});
  const passBox = h("div",{style:"display:grid;gap:8px;margin:2px 0 6px"},
    settings.keyEnc ? h("p",{class:"hint", style:"margin:0"},"Your key is encrypted. Leave these empty to keep your current passphrase.") : "", p1, p2,
    h("p",{class:"hint", style:"margin:0"},"There’s no way to recover a forgotten passphrase — you’d just enter your API key again."));
  const syncProtect = ()=>{ passBox.style.display = (protect.checked && remember.checked) ? "grid" : "none"; protect.disabled = !canEncrypt || !remember.checked; };
  protect.onchange = syncProtect; remember.onchange = syncProtect; syncProtect();
  const ws = field({value:settings.workspace||"default", class:"field mono", placeholder:"default"});
  const dm = select(MODELS.map(m=>({value:m.id, label:`${m.name} — ${m.sub}`})), settings.diagModel);
  const de = select(EFFORTS.filter(e=>e.id).map(e=>({value:e.id, label:e.name})), settings.diagEffort||"high");
  const status = h("span",{class:"hint"});
  const aura = !DESKTOP && !settings.apiKey && !settings.keyEnc ? auraKey() : null;
  const bg = modal(h("div",{class:"modal"},
    h("h2",{},"Settings"),
    h("p",{class:"lead"},"Page Orbit talks straight to Anthropic’s API with your own key. Nothing goes anywhere else."),
    h("label",{class:"f"},"Anthropic API key"),
    h("div",{class:"keyRow"}, key, eye),
    aura ? h("button",{class:"btn sm", style:"margin-top:8px", onclick:()=>{ if(aura.keyEnc){ settings.keyEnc = aura.keyEnc; settings.apiKey = ""; saveSettings(); bg.remove(); unlockDialog().then(ok=>ok && route()); } else { key.value = aura.apiKey; toast("Your Page Aura key is filled in — click Save"); } }}, icon("key"), "Use the key saved in Page Aura") : "",
    h("p",{class:"hint"}, DESKTOP ? "Stored in your system keychain (shared with the Page Aura desktop app). The app never shows it to this window." : "Create one at platform.claude.com → API keys. Managed Agents must be enabled for your workspace."),
    DESKTOP ? (settings.apiKey ? h("button",{class:"btn sm ghost", style:"color:var(--danger)", onclick:async()=>{ if(!await confirmDialog("Remove the key from the keychain?","Page Aura’s desktop app uses the same key, so it will be removed there too.","Remove")) return; await invoke("key_clear"); settings.apiKey = ""; client = null; bg.remove(); renderChrome(); route(); }}, icon("trash"), "Remove key from keychain") : "") : h("div",{},
      h("label",{class:"toggle"}, h("div",{class:"tx"}, h("b",{},"Remember on this device"), h("span",{},"Off: forgotten when you close the tab")), remember),
      h("label",{class:"toggle"}, h("div",{class:"tx"}, h("b",{},"Protect with a passphrase"), h("span",{},"Encrypts the saved key (AES-256)")), protect), passBox),
    h("div",{class:"section"}, h("h3",{},"Diagnose"),
      h("label",{class:"f"},"Model that reads your sessions"), dm,
      h("label",{class:"f"},"Effort"), de),
    h("div",{class:"section"}, h("h3",{},"Anthropic Console"),
      h("label",{class:"f"},"Workspace ID for “Open in Console” links"), ws),
    h("div",{class:"section"}, h("h3",{},"Appearance"),
      seg([{value:"", label:"System"}, {value:"light", label:"Light"}, {value:"dark", label:"Dark"}], settings.theme||"", v=>{ settings.theme = v; saveSettings(); }, "seg")),
    h("div",{class:"actions"},
      !DESKTOP && settings.keyEnc && settings.apiKey ? h("button",{class:"btn ghost", onclick:()=>{ bg.remove(); lockNow(); }}, icon("lock"), "Lock now") : "",
      h("span",{class:"sp"}), status,
      h("button",{class:"btn", onclick:()=>bg.remove()},"Cancel"),
      h("button",{class:"btn primary", onclick:async()=>{
        Object.assign(settings, {workspace:ws.value.trim()||"default", diagModel:dm.value, diagEffort:de.value});
        const nk = key.value.trim();
        if(DESKTOP){
          if(nk){
            status.style.color = ""; status.textContent = "Saving to keychain…";
            try{ const where = await invoke("key_set",{key:nk}); if(where==="session") toast("No system keychain found — the key is kept until you quit"); }
            catch(e){ status.style.color = "var(--danger)"; status.textContent = String(e); return; }
            settings.apiKey = KEYCHAIN; client = null;
            if(!await checkKey(status)){ await invoke("key_clear").catch(()=>{}); settings.apiKey = ""; client = null; return; }
          }
          saveSettings(); bg.remove(); route(); return;
        }
        let keyEnc = settings.keyEnc;
        const changed = nk !== settings.apiKey;
        if(!(remember.checked && protect.checked) || !nk && !isLocked()) keyEnc = null;
        else if(nk && (!keyEnc || changed || p1.value)){
          status.style.color = "var(--danger)";
          if(p1.value.length < 8){ status.textContent = "Choose a passphrase of at least 8 characters."; p1.focus(); return; }
          if(p1.value !== p2.value){ status.textContent = "The passphrases don’t match."; p2.focus(); return; }
          status.style.color = ""; status.textContent = "Encrypting…";
          keyEnc = await encryptKey(nk, p1.value);
        }
        const prev = {apiKey:settings.apiKey, keyEnc:settings.keyEnc};
        Object.assign(settings, {apiKey:nk, remember:remember.checked, keyEnc}); client = null;
        if(nk && changed && !await checkKey(status)){ Object.assign(settings, prev); client = null; return; }
        saveSettings(); bg.remove(); route();
      }}, icon("check"), "Save"))));
  setTimeout(()=>key.focus());
}
async function checkKey(status){
  status.style.color = ""; status.textContent = "Checking key…";
  try{ await C().beta.agents.list({limit:1}); return true; }
  catch(e){
    if(e.status===401){ status.style.color = "var(--danger)"; status.textContent = "That key was rejected — check it and try again."; return false; }
    if(e.status===403 || e.status===404){ toast("Key saved, but Managed Agents isn’t available for it yet: " + errText(e), 8000); return true; }
    if(!e.status){ toast(errText(e), 9000); return true; }   // network/browser issue: keep the key, explain
    return true;
  }
}

/* ---------- start ---------- */
(async()=>{
  renderChrome();
  if(DESKTOP){
    settings.keyEnc = null; settings.apiKey = (await invoke("key_status").catch(()=>false)) ? KEYCHAIN : "";
    document.documentElement.classList.add("desktop");
  } else if(isLocked()){ renderChrome(); route(); if(await unlockDialog()) route(); window.addEventListener("hashchange", route); return; }
  renderChrome(); route();
  window.addEventListener("hashchange", route);
})();

</script>
