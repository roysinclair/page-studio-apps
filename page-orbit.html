*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);display:flex;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.003em}

    radial-gradient(35% 30% at 18% 92%,var(--glow2),transparent 70%),
    radial-gradient(30% 30% at 50% 50%,var(--glow3),transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;mix-blend-mode:overlay;

::selection{background:var(--accent-soft)}

::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

svg.i{width:16px;height:16px;flex:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line2);background:var(--raised);font-weight:500;font-size:14px;
  transition:background .15s,border-color .15s,transform .15s var(--ease),box-shadow .15s}
.btn:hover{border-color:var(--muted);background:var(--surface)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.06) saturate(1.05);box-shadow:0 10px 24px -10px var(--accent)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn.danger:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:8px;gap:5px}
.btn.sm svg.i{width:14px;height:14px}
.iconBtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.iconBtn:hover{background:var(--hover);color:var(--text)}
.iconBtn.sm{width:26px;height:26px;border-radius:7px}
.iconBtn.sm svg.i{width:14px;height:14px}
.kbd{font:500 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}

.md{word-wrap:break-word;color:var(--text);line-height:1.68}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.65em 0}
.md h1,.md h2,.md h3{line-height:1.25;margin:1.3em 0 .5em;letter-spacing:-.01em}
.md h1{font:650 26px/1.2 var(--serif);letter-spacing:-.03em}.md h2{font-size:19px}.md h3{font-size:16px}
.md ul,.md ol{padding-left:1.4em;margin:.6em 0}.md li{margin:.25em 0}
.md li::marker{color:var(--muted)}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--accent);color:var(--text2);background:var(--accent-soft);border-radius:0 10px 10px 0}

.md hr{border:0;border-top:1px solid var(--line2);margin:1.4em 0}
.md :not(pre)>code{font:500 .86em var(--mono);background:var(--hover);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.tableWrap{overflow:auto;margin:1em 0;border:1px solid var(--line2);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th{background:var(--hover);font-weight:600;text-align:left}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--line)}
.md tr:last-child td{border-bottom:0}
.md img{max-width:100%;border-radius:10px}
.codeblock{margin:1em 0;border-radius:14px;overflow:hidden;background:var(--code-bg);border:1px solid rgba(255,255,255,.06);box-shadow:var(--shadow)}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:var(--code-head);color:#a49d91;font:500 12px var(--mono)}
.codehead .btn{color:#cfc8bc;border-color:transparent;background:transparent}
.codehead .btn:hover{background:rgba(255,255,255,.08)}
.codeblock pre{margin:0;padding:14px 16px;overflow:auto;font:13.5px/1.6 var(--mono);color:#e8e4dc}
.codeblock pre code.hljs{background:transparent;padding:0}
/* popover menu */
.menu{position:fixed;z-index:30;min-width:240px;max-width:320px;max-height:calc(100vh - 16px);overflow:auto;overscroll-behavior:contain;padding:6px;border-radius:14px;background:var(--raised);border:1px solid var(--line2);box-shadow:var(--shadow-lg);
  animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menuHead{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menuItem{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-align:left}
.menuItem:hover{background:var(--hover)}
.menuItem .mi{flex:1;min-width:0;display:flex;flex-direction:column}
.menuItem .ml{font-size:14px;font-weight:500}
.menuItem .ms{font-size:12px;color:var(--muted)}
.menuItem.sel .ml{color:var(--accent)}
.menuItem>svg.i{color:var(--accent)}

/* modal */
.modalBg{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--raised);border:1px solid var(--line2);border-radius:22px;padding:26px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:rise .28s var(--ease)}
.modal.wide{width:min(740px,100%)}
.modal.sm{width:min(420px,100%)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal h2{margin:0 0 6px;font:600 26px/1.15 var(--serif);letter-spacing:-.03em}
.modal .lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.modal label.f{display:block;margin:16px 0 6px;font-size:13px;font-weight:500;color:var(--text2)}
.field{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.field{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:24px;flex-wrap:wrap}
.modal .actions .sp{flex:1}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section>h3{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.toggle .tx{flex:1}.toggle .tx b{display:block;font-weight:500;font-size:14px}.toggle .tx span{color:var(--muted);font-size:12.5px}
.switch{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}
.keyRow{display:flex;gap:8px}
.keyRow .field{font-family:var(--mono);font-size:13.5px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--sunken)}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--muted)}
#lightbox{max-width:95vw;max-height:90vh;border-radius:14px;box-shadow:var(--shadow-lg);animation:rise .25s var(--ease)}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;
  background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);font-size:14px;box-shadow:var(--shadow-lg);backdrop-filter:blur(10px);animation:toastIn .3s var(--ease);max-width:90vw}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* ---- style.css ---- */
/* ================= Page Orbit layout ================= */
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
#nav{position:relative;z-index:2;width:236px;height:100vh;height:100dvh;flex:none;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px var(--accent)}
.brand .mark svg{width:19px;height:19px}
.brand .name{font:650 21px/1 var(--serif);letter-spacing:-.03em;flex:1}
.brand .name em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.navList{flex:1;overflow:auto;padding:2px 10px}
.navGroup{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.navItem{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;font-size:14px;color:var(--text2);transition:background .12s,color .12s}
.navItem:hover{background:var(--hover);color:var(--text)}
.navItem.on{background:var(--raised);color:var(--text);box-shadow:var(--shadow)}
.navItem.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.navItem .n{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}
.navItem .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.navFoot{display:flex;align-items:center;gap:4px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.keyState{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:9px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.keyState:hover{background:var(--hover);color:var(--text)}
.keyState .d{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.keyState.ok .d{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
#menuBtn{display:none}

#view{position:relative;z-index:1;flex:1;min-width:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
.demoBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 28px 0;padding:8px 14px;border-radius:12px;background:var(--accent-soft);color:var(--text2);font-size:13px;flex:none}
.demoBar svg.i{color:var(--accent)}
.demoBar .sp{flex:1}
.demoBar a{color:var(--accent);font-weight:500;text-decoration:none}
.demoBar a:hover{text-decoration:underline}
.viewHead{display:flex;align-items:center;gap:12px;padding:20px 28px 14px;flex:none;min-height:76px}
.viewHead .tt{flex:1;min-width:0}
.viewHead h1{margin:0;font:650 26px/1.15 var(--serif);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewHead .sub{color:var(--muted);font-size:13.5px;margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
.crumb button{color:var(--muted)}.crumb button:hover{color:var(--accent)}
.crumb svg.i{width:13px;height:13px}
.viewBody{flex:1;min-height:0;overflow:auto;padding:4px 28px 40px}
.wrapW{max-width:1080px}

/* lists */
.toolbar{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.searchIn{position:relative;width:240px}
.searchIn svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.searchIn .field{padding-left:32px;height:34px;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--raised) 82%,transparent);border:1px solid var(--line);
  cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s var(--ease)}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card.static{cursor:default}
.card .av{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:var(--grad);font:650 15px var(--serif)}
.card .av.soft{background:var(--accent-soft);color:var(--accent)}
.card .av svg{width:18px;height:18px}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= desktop bridge (Tauri) =================
   Inside the desktop app, API calls go through the Rust core: it adds the key from the
   system keychain (shared with Page Aura), so the key never enters this page. */
const DESKTOP = !!(window.__TAURI__ && window.__TAURI__.core);
const KEYCHAIN = "stored-in-system-keychain";        // placeholder: the real key stays in Rust
const invoke = DESKTOP ? window.__TAURI__.core.invoke : null;
applyTheme();
const bytesToB64 = (u8)=>{ let s = ""; for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s); };
const b64ToBytes = (b)=> Uint8Array.from(atob(b), c=>c.charCodeAt(0));
let fetchSeq = 0;
async function desktopFetch(input, init={}){
  const req = new Request(input, init);
  const id = ++fetchSeq;
  const headers = [...req.headers.entries()];
  const buf = (req.method==="GET" || req.method==="HEAD") ? null : new Uint8Array(await req.arrayBuffer());
  const body = buf && buf.length ? bytesToB64(buf) : null;
  const signal = init.signal || req.signal;
  return new Promise((resolve, reject)=>{
    let ctrl, headDone = false, closed = false;
    const stream = new ReadableStream({ start(c){ ctrl = c; }, cancel(){ invoke("api_abort",{id}).catch(()=>{}); } });
    const fail = (e)=>{ if(closed) return; closed = true; if(!headDone) reject(e); else { try{ ctrl.error(e); }catch{} } };
    const ch = new window.__TAURI__.core.Channel();
    ch.onmessage = (m)=>{
      if(m.event==="head"){ headDone = true; const st = m.data.status; resolve(new Response([101,204,205,304].includes(st) ? null : stream, {status:st, headers:m.data.headers})); }
      else if(m.event==="chunk"){ try{ ctrl.enqueue(b64ToBytes(m.data.b64)); }catch{} }
      else if(m.event==="end"){ if(!closed){ closed = true; try{ ctrl.close(); }catch{} } }
      else if(m.event==="error") fail(new TypeError(m.data.message));
    };
    if(signal){
      if(signal.aborted) return reject(new DOMException("Aborted","AbortError"));
      signal.addEventListener("abort", ()=>{ invoke("api_abort",{id}).catch(()=>{}); fail(new DOMException("Aborted","AbortError")); }, {once:true});
    }
    invoke("api_fetch", {id, url:req.url, method:req.method, headers, body, onEvent:ch}).catch(e=>fail(new TypeError(String(e))));
  });
}

/* ---- optional passphrase encryption of the saved key (PBKDF2-SHA256 → AES-256-GCM, WebCrypto) ---- */
const canEncrypt = !!(globalThis.crypto && crypto.subtle);
const b64 = buf => { let s=""; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptKey(apiKey, pass){
  const iter = 600000, salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveKey(pass, salt, iter);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(apiKey));
  return {v:1, kdf:"PBKDF2-SHA256", iter, salt:b64(salt), iv:b64(iv), ct:b64(ct)};
}
async function decryptKey(enc, pass){
  const k = await deriveKey(pass, unb64(enc.salt), enc.iter||600000);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(enc.iv)}, k, unb64(enc.ct)));
}

const $ = (sel, el=document)=> el.querySelector(sel);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") el.className=v; else if(k==="style") el.setAttribute("style",v);
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="value") el.value = v ?? "";
    else if(k==="checked" || k==="disabled" || k==="selected") el[k] = !!v;
    else if(v===true) el.setAttribute(k,""); else if(v!==false && v!=null) el.setAttribute(k,v);
  }
  for(const k of kids.flat(Infinity)) if(k!=null && k!==false && k!=="") el.append(k.nodeType? k : document.createTextNode(String(k)));
  return el;
}

/* popover menu */
let menuEl = null;
function closeMenu(){ menuEl?.remove(); menuEl=null; document.removeEventListener("mousedown", outsideMenu, true); }

function popMenu(anchor, items, onPick){
  closeMenu();
  menuEl = h("div",{class:"menu", role:"menu"}, ...items.map(it=> it.header ? h("div",{class:"menuHead"}, it.header) :
    h("button",{class:"menuItem"+(it.selected?" sel":""), role:"menuitem", style: it.danger?"color:var(--danger)":"", onclick:()=>{ closeMenu(); onPick(it.value); }},
      it.icon? icon(it.icon) : "", h("span",{class:"mi"}, h("span",{class:"ml"}, it.label), it.sub? h("span",{class:"ms"}, it.sub):""), it.selected? icon("check"):"")));
  document.body.append(menuEl);
  const r = anchor.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)); if(r.left + mw < innerWidth - 8 && r.left < innerWidth/2) left = r.left;
  let top = r.bottom + 6; if(top + mh > innerHeight - 8){ top = r.top - mh - 6; if(top < 8) top = Math.max(8, innerHeight - 8 - mh); }
  menuEl.style.left = left+"px"; menuEl.style.top = top+"px";
  setTimeout(()=>document.addEventListener("mousedown", outsideMenu, true));
}
function modal(content, onClose){
  const bg = h("div",{class:"modalBg"}, content);
  const close = ()=>{ bg.remove(); document.removeEventListener("keydown", esc); onClose?.(); };
  bg.addEventListener("mousedown", e=>{ if(e.target===bg) close(); });
  const esc = (e)=>{ if(e.key==="Escape" && !e.defaultPrevented && !menuEl) close(); };
  document.addEventListener("keydown", esc);
  document.body.append(bg);
  const origRemove = bg.remove.bind(bg); bg.remove = ()=>{ document.removeEventListener("keydown", esc); origRemove(); };
  bg.close = close;
  return bg;
}

const fmtN = n => n==null ? "—" : n>=1e6 ? (n/1e6).toFixed(1)+"M" : n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+"k" : String(n);
const toMs = (t)=> typeof t==="number" ? t : (t ? Date.parse(t) : NaN);
function ago(t){
  const ms = toMs(t); if(!isFinite(ms)) return "";
  const s = (Date.now()-ms)/1000;
  if(s < 45) return "just now"; if(s < 3600) return Math.round(s/60)+"m ago"; if(s < 86400) return Math.round(s/3600)+"h ago";
  if(s < 86400*7) return Math.round(s/86400)+"d ago";
  return new Date(ms).toLocaleDateString(undefined,{day:"numeric", month:"short", year: new Date(ms).getFullYear()===new Date().getFullYear()? undefined : "numeric"});
}

function dur(sec){ if(sec==null || !isFinite(sec)) return "—"; if(sec < 1) return Math.round(sec*1000)+"ms"; if(sec < 60) return sec.toFixed(sec<10?1:0)+"s"; const m = Math.floor(sec/60); return m<60 ? `${m}m ${Math.round(sec%60)}s` : `${Math.floor(m/60)}h ${m%60}m`; }

/** Line diff (LCS) for two JSON-able values. */
function diffLines(a, b){
  const A = (typeof a==="string"? a : JSON.stringify(a, null, 2)).split("\n"), B = (typeof b==="string"? b : JSON.stringify(b, null, 2)).split("\n");
  const n = A.length, m = B.length;
  if(n*m > 4e6) return [...A.map(t=>({t, k:"del"})), ...B.map(t=>({t, k:"add"}))];
  const L = Array.from({length:n+1}, ()=> new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const out = []; let i=0, j=0;
  while(i<n && j<m){ if(A[i]===B[j]){ out.push({t:A[i], k:"same"}); i++; j++; } else if(L[i+1][j] >= L[i][j+1]) out.push({t:A[i++], k:"del"}); else out.push({t:B[j++], k:"add"}); }
  while(i<n) out.push({t:A[i++], k:"del"}); while(j<m) out.push({t:B[j++], k:"add"});
  return out;
}
function diffView(a, b, context=3){
  const lines = diffLines(a, b), pre = h("div",{class:"diff"});
  if(!lines.some(l=>l.k!=="same")){ pre.append(h("div",{class:"gap"},"No differences.")); return pre; }
  const keep = lines.map((l,i)=> l.k!=="same" || lines.slice(Math.max(0,i-context), i+context+1).some(x=>x.k!=="same"));
  let skipped = 0;
  lines.forEach((l,i)=>{
    if(!keep[i]){ skipped++; return; }
    if(skipped){ pre.append(h("div",{class:"gap"}, `… ${skipped} unchanged line${skipped>1?"s":""}`)); skipped = 0; }
    pre.append(h("div",{class:l.k}, l.t));
  });
  if(skipped) pre.append(h("div",{class:"gap"}, `… ${skipped} unchanged line${skipped>1?"s":""}`));
  return pre;
}

            if(l.country && !/^[A-Z]{2}$/.test(l.country)) throw new Error("web_search: the country is a 2-letter code, like NZ or US.");
            if(Object.keys(l).length > 1) c.user_location = l; else delete c.user_location; }
          if(t.maxTok){ const m = parseInt(t.maxTok.value,10); if(m > 0) c.max_content_tokens = m; else delete c.max_content_tokens; }
          return c; })});
    }
    const names = new Set();
    for(const s of mcpState){
      if(!s.name && !s.url) continue;
      if(!/^[\w.-]{1,255}$/.test(s.name)) throw new Error(`MCP server name “${s.name}” — use letters, numbers, dots, dashes or underscores.`);
      if(!/^https:\/\//i.test(s.url)) throw new Error(`MCP server “${s.name}” needs an https:// URL.`);
      if(names.has(s.name)) throw new Error(`Two MCP servers are called “${s.name}”.`); names.add(s.name);
      const tset = s.toolset || {type:"mcp_toolset", mcp_server_name:s.name};
      tset.mcp_server_name = s.name; tset.default_config = {...(tset.default_config||{}), enabled:s.on, permission_policy:{type:s.perm}};
      const rules = s.rules.filter(r=>r.name);
      for(const r of rules) if(!/^[\w.-]{1,128}$/.test(r.name)) throw new Error(`“${r.name}” isn’t a valid tool name.`);
      if(rules.length) tset.configs = rules.map(r=>({name:r.name, enabled:r.enabled, ...(r.perm ? {permission_policy:{type:r.perm}} : {})})); else delete tset.configs;
      out.push(tset);
    }
    for(const t of customState){
      if(!t.name && !t.description) continue;
      if(!/^[A-Za-z0-9_-]{1,128}$/.test(t.name)) throw new Error(`Custom tool name “${t.name}” — letters, numbers, - and _ only.`);
      const sc = parseJSON(t.schema, `Schema for ${t.name}`); if(!sc.ok) throw new Error(sc.error);
      out.push({type:"custom", name:t.name, description:t.description, input_schema: sc.value || {type:"object", properties:{}}});
    }
    return {tools:out, mcp_servers: mcpState.filter(s=>s.name).map(s=>({type:"url", name:s.name, url:s.url}))};
  }
  return {sandbox, mcp, custom, build, readOn: ()=> !tsOn.checked || state.find(t=>t.name==="read").enabled};
}

/** Web tools the agent has switched on, and the sites they're limited to. */
function agentWeb(agent){
  const ts = (agent?.tools||[]).find(t=>t.type===TOOLSET); if(!ts) return {on:false, domains:[]};
  const on = ["web_search","web_fetch"].filter(n=>toolEnabled(ts, n));
  const domains = [...new Set(on.flatMap(n=> (ts.configs||[]).find(c=>c.name===n)?.allowed_domains || []))];
  return {on: on.length>0, tools:on, domains};
}
/** Since Oct 2026, a limited environment's allowed_hosts also filter web search and fetch. */
function webVsEnv(agent, env){
  const w = agentWeb(agent); if(!w.on || !env || env.config?.networking?.type!=="limited") return null;
  const hosts = env.config.networking.allowed_hosts||[];
  const ok = (d)=> hosts.some(hh=> hh===d || (hh.startsWith("*.") && d.endsWith(hh.slice(1))));
  const missing = w.domains.filter(d=>!ok(d));
  if(missing.length) return `This agent’s web tools are limited to ${missing.join(", ")}, which this environment doesn’t allow. Starting the session will fail: add those sites to the environment, or pick an open one.`;
  if(!w.domains.length) return hosts.length ? `This environment only reaches ${hosts.slice(0,4).join(", ")}${hosts.length>4?"…":""}, so the agent’s web search and page reading only work on those sites.` : "This environment has no websites allowed, so the agent’s web search and page reading will find nothing. Pick an open environment, or add sites to this one.";
  return null;
}

/** Keeps one session's event history in sync: stream first, then history, de-duplicated by id. */
class SessionFeed {
  constructor(sid, handlers){ this.sid = sid; this.h = handlers; this.byKey = new Map(); this.events = []; this.closed = false; this.lastAt = null; this.connected = false; }
  key(ev){ return ev.id || `${ev.type}@${ev.processed_at}`; }
  start(){ this.loop(); }
  stop(){ this.closed = true; try{ this.stream?.controller?.abort(); }catch{} }
  async loadHistory(){
    const params = {limit:1000};
    if(this.lastAt) params["created_at[gte]"] = this.lastAt;
    for await (const ev of C().beta.sessions.events.list(this.sid, params)){ if(this.closed) return; this.ingest(ev); }
  }
  ingest(ev){
    if(ev.type==="event_start" || ev.type==="event_delta"){ this.h.preview?.(ev); return; }
    const k = this.key(ev), old = this.byKey.get(k);
    if(old){
      if(old.processed_at==null && ev.processed_at){ old.processed_at = ev.processed_at; this.h.update?.(old); }
      return;
    }
    this.byKey.set(k, ev); this.events.push(ev);
    if(ev.processed_at && (!this.lastAt || ev.processed_at > this.lastAt)) this.lastAt = ev.processed_at;
    if(ev.type==="session.status_terminated" || ev.type==="session.deleted") this.ended = true;
    this.h.event(ev);
  }
  async loop(){
    let backoff = 1000;
    while(!this.closed){
      try{
        this.stream = await C().beta.sessions.events.stream(this.sid, {event_deltas:["agent.message","agent.thinking"]});
        this.connected = true; this.h.conn?.(true);
        await this.loadHistory();            // after the stream is open, so nothing falls in the gap
        this.h.synced?.();
        backoff = 1000;
        for await (const ev of this.stream){ if(this.closed) break; this.ingest(ev); }
      }catch(e){
        if(this.closed || e?.name==="AbortError") break;
        console.warn("session stream", e);
        if(e?.status===404 || e?.status===401){ this.h.fatal?.(e); break; }
        this.h.conn?.(false, e);
      }
      this.connected = false;
      if(this.closed || this.ended) break;
      await sleep(backoff); backoff = Math.min(backoff*2, 30000);
    }
  }
}

  const ERR_LABEL = {model_overloaded_error:"The model is overloaded", model_rate_limited_error:"Rate limited", billing_error:"Billing problem — check your Anthropic balance",

  function onEvent(ev){
    if(!ui.firstAt && ev.processed_at) ui.firstAt = ev.processed_at;
    const t = ev.type;
    if(t==="user.message") userBubble(ev);
    else if(t==="agent.message"){
      const p = ui.previews.get(ev.id); const el = agentBubble(ev);
      if(p){ p.el.replaceWith(el); ui.previews.delete(ev.id); } else add(el);
      scroll();
    }
    else if(t==="agent.tool_use" || t==="agent.mcp_tool_use"){
      toolRow(ev);
      if(ev.evaluated_permission==="ask") askCard(ev);
      else if(ev.evaluated_permission==="deny") add(h("div",{class:"ev hint", style:"margin-left:40px"},"⛔ Blocked by the automatic safety check."));
    }
    else if(t==="agent.custom_tool_use"){ toolRow(ev); customCard(ev); }
    else if(t==="agent.tool_result") ui.tools.get(ev.tool_use_id)?.setResult(ev);
    else if(t==="agent.mcp_tool_result") ui.tools.get(ev.mcp_tool_use_id)?.setResult(ev);
    else if(t==="user.tool_confirmation"){ ui.pending.get(ev.tool_use_id)?.resolve(ev.result); }
    else if(t==="user.custom_tool_result"){ ui.customs.get(ev.custom_tool_use_id)?.resolve(); ui.tools.get(ev.custom_tool_use_id)?.setResult(ev); }
    else if(t==="user.interrupt"){ sys("stop","You stopped the agent"); }
    else if(t==="user.define_outcome") outcomeCard(ev);
    else if(t==="span.outcome_evaluation_start") ui.outcomes.get(ev.outcome_id)?.start(ev);
    else if(t==="span.outcome_evaluation_end") ui.outcomes.get(ev.outcome_id)?.end(ev);
    else if(t==="system.message") sys("info", "System note: " + short(blocksText(ev.content), 160));
    else if(t==="session.error") errorBanner(ev);
    else if(t==="session.status_running"){ ui.status = "running"; ui.stopReason = null; }
    else if(t==="session.status_rescheduled"){ ui.status = "rescheduling"; }
    else if(t==="session.status_idle"){
      ui.status = "idle"; ui.stopReason = ev.stop_reason;
      const r = ev.stop_reason?.type;
      if(r==="budget_reached") add(h("div",{class:"ev banner warn"}, icon("alert"), h("div",{}, h("b",{},"Paused at the spending cap. "), "Raise the cap to let it carry on.", h("div",{style:"margin-top:6px"}, h("button",{class:"btn sm", onclick:()=>budgetDialog()}, "Change cap")))));
      else if(r==="retries_exhausted"){
        const last = [...feed.events].reverse().find(e=>e.type==="session.error");
        const t2 = last?.error?.type;
        add(h("div",{class:"ev banner"}, icon("alert"), h("div",{}, t2==="tool_use_limit_reached_error" ? [h("b",{},"The turn stopped at the tool-step limit. "), "Nothing failed: send a message (for example “carry on”) to let it continue."]
          : t2==="compaction_limit_reached_error" ? [h("b",{},"The turn stopped: its context kept filling up. "), "Send a message to continue, ideally narrowing the task."]
          : [h("b",{},"This turn failed after several retries. "), "You can send another message, or click Diagnose."])));
      }
      else if(r==="refusal") add(h("div",{class:"ev banner"}, icon("shield"), h("div",{}, h("b",{},"The model declined. "), ev.stop_details?.explanation || "", ev.stop_details?.category ? ` (${ev.stop_details.category})` : "")));
    }
    else if(t==="session.status_terminated"){ ui.status = "terminated"; sys("alert", sess.archived_at ? "Session stopped: it was archived" : "Session stopped (an unrecoverable error or it was archived)");
      if(!sess.archived_at) C().beta.sessions.retrieve(id).then(s=>{ if(s?.archived_at){ sess = s; } }).catch(()=>{}); }
    else if(t==="session.deleted"){ ui.status = "terminated"; sys("trash","Session deleted"); }
    else if(t==="session.thread_created") sys("users", ev.agent_name==="anthropic.advisor" ? "Consulting the advisor" : `Started helper “${ev.agent_name}”${ev.workflow_run_id ? " (workflow)" : ""}`);
    else if(t==="session.thread_status_idle" && ev.stop_reason && !["end_turn","requires_action"].includes(ev.stop_reason.type) && ev.agent_name!=="anthropic.advisor") sys("alert", `Helper “${ev.agent_name}” stopped: ${ev.stop_reason.type.replace(/_/g," ")}`);
    else if(t==="session.thread_status_terminated" && ev.agent_name!=="anthropic.advisor") sys("check", `Helper “${ev.agent_name}” finished`);
    else if(t==="agent.thread_message_sent" || t==="agent.thread_message_received"){
      const out = t.endsWith("sent"), raw = out ? ev.to_agent_name : ev.from_agent_name, adv = raw==="anthropic.advisor", who = adv ? "Advisor" : raw;
      const hidden = (ev.content||[]).some(b=>b.type==="redacted");
      add(h("details",{class:"tool"}, h("summary",{}, icon("chevR","chev"), icon(adv ? "pulse" : "users"), h("span",{class:"nm"}, out ? `→ ${who||"helper"}` : `← ${who||"helper"}`), h("span",{class:"pv"}, short(blocksText(ev.content), 140))),
        h("div",{class:"tb"}, hidden && adv ? h("div",{class:"note"}, icon("info"), "This advisor’s advice is hidden from you by design; the agent still received it. Advisors such as Opus 4.8 give readable advice.") : "", renderMd(blocksText(ev.content)))));
    }
    else if(t==="agent.thread_context_compacted") sys("history","Earlier context was summarised to make room");
    else if(t==="workflow_run.created") sys("rocket", `Workflow started: ${ev.name}`);
    else if(t==="workflow_run.status_ended") sys(ev.result?.type==="completed"?"check":"alert", `Workflow ${ev.result?.type || "ended"}${ev.result?.error ? ": "+ev.result.error.message : ""}`);
    else if(t==="session.usage"){ ui.usage = ev.usage; if(ev.budget) ui.budget = ev.budget; }
    else if(t==="session.updated"){ if(ev.budget!==undefined) ui.budget = ev.budget; if(ev.title!==undefined) sess.title = ev.title; }
    else if(t==="agent.thinking"){ ui.thinking = true; }
    if(t==="span.model_request_end" || t==="agent.message") ui.thinking = false;
    // make sure every outstanding ask has a live card
    if(t==="session.status_idle"){
      const owed = new Set(ev.stop_reason?.type==="requires_action" ? ev.stop_reason.event_ids||[] : []);
      for(const [eid, card] of [...ui.pending]) if(!owed.has(eid)) card.stale();
      for(const eid of owed) if(!ui.pending.has(eid)){ const src = feed.byKey.get(eid); if(src && !src._asked){ src._asked = true; (src.type==="agent.custom_tool_use" ? customCard : askCard)(src); } }

    timelineAdd(ev);
    if(/^session\.status_/.test(t)) olSoon();
    refresh();

  // ---- composer
  function buildComposer(){
    const ta = h("textarea",{rows:1, placeholder:"Message the agent…"});
    const attRow = h("div",{class:"attRow", style:"display:none"});
    const atts = [];
    const drawAtts = ()=>{ attRow.style.display = atts.length ? "" : "none"; attRow.replaceChildren(...atts.map((a,i)=>h("span",{class:"att"}, icon(a.block.type==="image"?"eye":"file"), h("span",{}, a.name), h("button",{class:"iconBtn sm", onclick:()=>{ atts.splice(i,1); drawAtts(); }}, icon("x"))))); };
    const send = h("button",{class:"send", title:"Send"}, icon("up"));
    const stopBtn = h("button",{class:"btn sm", style:"display:none", title:"Stop the agent"}, icon("stop"), "Stop");
    const st = h("span",{class:"st"});
    const attach = h("button",{class:"iconBtn", title:"Attach images, PDFs or text files"}, icon("clip"));
    const outcome = h("button",{class:"btn sm ghost", title:"Give it a goal with a rubric; a grader checks the work"}, icon("flag"), "Outcome");
    let running = false, blocked = false;
    const fit = ()=>{ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, innerHeight*0.4)+"px"; };
    ta.oninput = fit;
    ta.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); go_(); } };
    attach.onclick = ()=>{ const fi = $("#fileInput"); fi.value = ""; fi.accept = "image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.csv,.json,.txt"; fi.onchange = async()=>{
      for(const f of fi.files){
        if(f.size > 20*1024*1024){ toast(`${f.name} is over 20 MB`); continue; }
        if(/^image\//.test(f.type)) atts.push({name:f.name, block:{type:"image", source:{type:"base64", media_type:f.type, data:(await readFileAs(f,"readAsDataURL")).split(",")[1]}}});
        else if(f.type==="application/pdf") atts.push({name:f.name, block:{type:"document", title:f.name, source:{type:"base64", media_type:"application/pdf", data:(await readFileAs(f,"readAsDataURL")).split(",")[1]}}});
        else atts.push({name:f.name, block:{type:"document", title:f.name, source:{type:"text", media_type:"text/plain", data:await readFileAs(f,"readAsText")}}});
      } drawAtts(); }; fi.click(); };
    stopBtn.onclick = async()=>{ stopBtn.disabled = true; const r = await api(c=>c.beta.sessions.events.send(id, {events:[{type:"user.interrupt"}]}), "Stop"); stopBtn.disabled = false; if(r) toast("Stopping at the next safe point…"); };
    outcome.onclick = ()=> outcomeDialog();
    const note = modelInfo(sess.agent?.model).sys ? h("button",{class:"btn sm ghost", title:"Add a standing instruction for the rest of this session (a system note)"}, icon("info"), "Instruction") : "";
    if(note) note.onclick = ()=>{ if(blocked) return toast("Answer the request above first."); systemNoteDialog(); };
    async function go_(){
      const text = ta.value.trim(); if(!text && !atts.length) return;
      if(blocked){ toast("Answer the request above first (or raise the spending cap)."); return; }
      send.disabled = true;
      const content = [...atts.map(a=>a.block), ...(text ? [{type:"text", text}] : [])];
      const r = await api(c=>c.beta.sessions.events.send(id, {events:[{type:"user.message", content}]}), "Send");
      send.disabled = false;
      if(!r) return;
      ta.value = ""; atts.length = 0; drawAtts(); fit(); stick = true;
      (r.data||[]).forEach(x=>feed.ingest(x));
    }
    send.onclick = go_;
    const el = h("div",{class:"composerBox"}, attRow, ta, h("div",{class:"composerBar"}, attach, outcome, note, h("span",{class:"sp"}), st, stopBtn, send));
    return {el, ta,
      setRunning(v){ running = v; stopBtn.style.display = v ? "" : "none"; st.textContent = v ? "Messages you send now are queued" : ""; },

      const evs = await api(c=>listAll(c.beta.sessions.threads.events.list(t.id, {session_id:id, limit:1000}), 2000), "Thread");
      list.replaceChildren(); (evs||[]).forEach(addEv);
      if(stream) try{ for await (const ev of stream){ if(ev.type!=="event_start" && ev.type!=="event_delta") addEv(ev); } }catch{}
    })();
  }

  // ---- go
  const feed = new SessionFeed(id, {event:onEvent, preview:onPreview, update:onUpdate,
    conn:(ok)=>{ conn.textContent = ok ? "" : "Reconnecting…"; },
    synced:()=>{ refresh(); scroll(); },
    fatal:(e)=>{ conn.textContent = errText(e); }});
  activeFeed = feed; feed.start();
  drawInspector(); refresh();
  // refresh the session object now and then for authoritative usage/stats
  const poll = setInterval(async()=>{ if(feed.closed){ clearInterval(poll); return; } if(document.hidden) return;
    const s = await C().beta.sessions.retrieve(id).catch(()=>null); if(s){ sess = s; ui.usage = s.usage || ui.usage; ui.budget = s.budget; if(inspTab==="usage") drawInspector(); } }, 60000);
  return ()=>{ feed.stop(); clearInterval(poll); };
}

/* ================= diagnose.js ================= */
/* ================= diagnose =================
   Sends a session's transcript and its agent's setup to a model (Messages API), which explains
   what happened and can propose changes to the agent. Proposals are shown as a diff and applied
   only when you click — as a new agent version. You can keep asking questions about the session. */
const DIAG_MAX_CHARS = 180000;
const DIAG_TOOL = {
  name:"propose_agent_change",
  description:"Propose a concrete change to the agent's saved setup. The user sees a diff and decides whether to apply it as a new agent version. Give the FULL new value of each field you change (lists like tools are replaced whole). Only include fields you want to change.",
  input_schema:{type:"object", required:["title","rationale","changes"], properties:{
    title:{type:"string", description:"Short name for the change, e.g. 'Ask before running bash'"},
    rationale:{type:"string", description:"Why this fixes what went wrong, citing event ids"},
    changes:{type:"object", description:"New values for agent fields", properties:{
      system:{type:"string"}, description:{type:"string"},
      model:{type:"object", properties:{id:{type:"string"}, effort:{type:"string", enum:["low","medium","high","xhigh","max"]}}, required:["id"]},
      tools:{type:"array", items:{type:"object"}}, mcp_servers:{type:"array", items:{type:"object"}}, skills:{type:"array", items:{type:"object"}},
    }},
  }},
};
const DIAG_SYSTEM = `You are an expert at debugging agents built on Anthropic's Managed Agents platform. The user runs Page Orbit, a tool for building and running these agents, and wants to understand one session.

You get: the agent's current saved setup, the setup the session actually ran with, and a condensed event log. Each log line starts with time since the session began and the event id (sevt_…).

How Managed Agents work (for your reasoning):
- An agent = model + system prompt + tools. Built-in sandbox tools (agent_toolset_20260401): bash, read, write, edit, glob, grep, web_search, web_fetch, each with enabled and a permission_policy: always_allow, always_ask (pauses for a human), or auto (a safety check allows, blocks or asks). MCP servers are reached through mcp_toolset entries; their credentials live in vaults attached when the session starts. Custom tools are answered by the user.
- The sandbox runs in an environment whose networking may be "limited" to listed hosts; blocked hosts look like network errors in tool results. Package managers and MCP servers need explicit allow flags under limited networking.
- session.error events carry a type and retry_status. tool_use_limit_reached_error and compaction_limit_reached_error end a turn as retries_exhausted although no request failed: the turn hit the per-turn tool-step limit, or context was compacted too many times in a row (both fixed by a follow-up message, narrower tasks or clearer instructions).
- session.status_idle carries a stop_reason: end_turn, requires_action (waiting on a person), retries_exhausted, budget_reached, refusal. A session that finishes its work goes idle; session.status_terminated means an unrecoverable error or that it was archived.
- Web tools: since Oct 2026, a limited environment's allowed_hosts also filter web_search and web_fetch (an empty list means they return nothing), and web_fetch only opens URLs that already appeared in the session (error url_not_in_prior_context). Organisation Console settings can also disable or restrict web tools.
- Advisors (multi-agent): advice from Opus 5.5, Fable 5.1, Sonnet 5.5, Haiku 5.5, Opus 5 and Fable 5 is redacted from the transcript by design.
- Outcomes: a grader checks work against a rubric (span.outcome_evaluation_end: satisfied / needs_revision / max_iterations_reached / failed).

Write for a capable non-specialist. Be specific and brief:
1. **What happened** — two or three sentences.
2. **What went wrong** (if anything) — each issue with the event ids that show it, and its root cause: instructions, tool permissions, missing tools, environment networking, credentials, the model or effort level, or the user's request.
3. **Fixes** — for changes to the agent, call propose_agent_change (one call per independent fix; full new values). For changes you can't make directly (environment networking, vault credentials, a spending cap, the prompt the user sent), say exactly what to change and where in Page Orbit (Environments, Vaults, the session's spending cap).
If nothing went wrong, say so and suggest at most one or two improvements (for cost, speed or reliability). Never invent events. Never ask for or repeat secrets.`;

function condenseEvents(events){
  const t0 = events.find(e=>e.processed_at)?.processed_at;
  const rel = (e)=> t0 && e.processed_at ? "+"+((toMs(e.processed_at)-toMs(t0))/1000).toFixed(1)+"s" : "+?";
  const clip = (s, n)=>{ s = String(s ?? ""); return s.length > n ? s.slice(0, n) + ` …[${s.length-n} more chars]` : s; };
  const starts = new Map();
  const lines = [];
  for(const e of events){
    const head = `[${rel(e)}] ${e.id||"-"} ${e.type}`;
    const t = e.type;
    let body = "";
    if(t==="user.message" || t==="agent.message" || t==="system.message") body = clip(blocksText(e.content), 4000);
    else if(/tool_use$/.test(t)) body = `${e.mcp_server_name ? e.mcp_server_name+"/" : ""}${e.name} permission=${e.evaluated_permission||"-"}${e.evaluation?.type==="auto" ? " auto="+JSON.stringify(e.evaluation.evaluated_permission) : ""}${e.session_thread_id ? " thread="+e.session_thread_id : ""} input=${clip(JSON.stringify(e.input), 1500)}`;
    else if(/tool_result$/.test(t)) body = `for=${e.tool_use_id||e.mcp_tool_use_id||e.custom_tool_use_id} ${e.is_error ? "ERROR " : ""}${clip(blocksText(e.content), 2000)}`;
    else if(t==="user.tool_confirmation") body = `for=${e.tool_use_id} ${e.result}${e.deny_message ? " message="+clip(e.deny_message, 300) : ""}`;
    else if(t==="session.error") body = clip(JSON.stringify(e.error), 1200);
    else if(t==="session.status_idle") body = JSON.stringify(e.stop_reason||{}) + (e.stop_details ? " details="+JSON.stringify(e.stop_details) : "");
    else if(t==="span.model_request_start"){ starts.set(e.id, e); continue; }
    else if(t==="span.model_request_end"){ const st = starts.get(e.model_request_start_id); const u = e.model_usage||{}; body = `${st ? ((toMs(e.processed_at)-toMs(st.processed_at))/1000).toFixed(1)+"s " : ""}in=${u.input_tokens} out=${u.output_tokens} cache_read=${u.cache_read_input_tokens}${e.is_error ? " ERROR" : ""}`; }
    else if(t==="user.define_outcome") body = `goal=${clip(e.description, 1000)} rubric=${clip(e.rubric?.content || JSON.stringify(e.rubric), 2000)} max_iterations=${e.max_iterations}`;
    else if(t==="span.outcome_evaluation_end") body = `round ${e.iteration+1}: ${e.result} — ${clip(e.explanation, 1500)}`;
    else if(t==="session.usage") body = `cost_cents=${e.usage?.list_cost?.amount ?? "?"}`;
    else if(t==="agent.thread_message_sent" || t==="agent.thread_message_received") body = `${e.to_agent_name||e.from_agent_name||""}: ${clip(blocksText(e.content), 1500)}`;
    else if(t==="session.thread_created") body = e.agent_name;
    else if(t.startsWith("workflow_run.")) body = clip(JSON.stringify({name:e.name, result:e.result, error:e.error}), 600);
    else if(t==="span.outcome_evaluation_ongoing" || t==="agent.thinking") continue;
    lines.push(body ? `${head}: ${body}` : head);
  }
  let text = lines.join("\n");
  if(text.length > DIAG_MAX_CHARS){
    const head = text.slice(0, DIAG_MAX_CHARS*0.25), tail = text.slice(-DIAG_MAX_CHARS*0.75);
    text = head + `\n\n…[${text.length - DIAG_MAX_CHARS} characters of the middle of the log omitted]…\n\n` + tail;
  }
  return text;
}

async function openDiagnose(sess, events){
  if(!getClient()){ openSettings(); return; }
  const thread = h("div",{class:"diag"});
  const scroller = h("div",{style:"flex:1;min-height:0;overflow:auto;padding:4px 2px 10px"}, thread);
  const ta = h("textarea",{rows:1, placeholder:"Ask a follow-up about this session…"});
  const send = h("button",{class:"send", title:"Send"}, icon("up"));
  const modelSel = select(MODELS.map(m=>({value:m.id, label:m.name})), settings.diagModel, {style:"height:30px;width:auto;font-size:12.5px"});
  const costEl = h("span",{class:"hint"});
  const box = h("div",{class:"modal wide", style:"width:min(920px,100%);height:min(86vh,1000px);display:flex;flex-direction:column"},
    h("div",{class:"row", style:"margin-bottom:10px"}, h("h2",{style:"margin:0"}, "Diagnose"), h("span",{class:"sp"}), costEl, modelSel, h("button",{class:"iconBtn", title:"Close", onclick:()=>bg.close()}, icon("x"))),
    h("p",{class:"lead", style:"margin:0 0 10px"}, `Sends this session’s ${events.length} events and the agent’s setup to ${modelName(settings.diagModel)} to find what went wrong. Nothing changes unless you apply a fix.`),
    scroller,
    h("div",{class:"composerBox", style:"margin:8px 0 0;max-width:none"}, ta, h("div",{class:"composerBar"}, h("span",{class:"sp"}), send)));
  const bg = modal(box);
  modelSel.onchange = ()=>{ settings.diagModel = modelSel.value; saveSettings(); };
  const scroll = ()=> requestAnimationFrame(()=>{ scroller.scrollTop = scroller.scrollHeight; });
  let spent = 0, busy = false;

  thread.append(h("div",{class:"hint"},"Loading the agent’s current setup…"));
  const current = await C().beta.agents.retrieve(sess.agent.id).catch(()=>null);
  thread.replaceChildren();
  const ran = pickConfig(sess.agent);
  const intro = [
    `Session ${sess.id} (status: ${sess.status}${sess.title ? `, title: ${sess.title}` : ""}, environment ${sess.environment_id}${sess.budget ? `, spending cap ${sess.budget.max_list_cost?.amount} cents` : ""}).`,
    `\n## Setup the session ran with (agent ${sess.agent.id} version ${sess.agent.version})\n\`\`\`json\n${JSON.stringify(ran, null, 2)}\n\`\`\``,
    current && current.version !== sess.agent.version ? `\n## The agent's CURRENT saved setup (version ${current.version}) — propose changes against this one\n\`\`\`json\n${JSON.stringify(pickConfig(current), null, 2)}\n\`\`\`` : `\n(The agent's current saved setup is the same version.)`,
    sess.usage?.list_cost ? `\nSession list cost so far: $${(Number(sess.usage.list_cost.amount)/100).toFixed(2)}.` : "",
    `\n## Event log\n${condenseEvents(events)}`,
    `\n\nDiagnose this session.`,
  ].join("\n");
  const messages = [{role:"user", content:[{type:"text", text:intro, cache_control:{type:"ephemeral"}}]}];

  async function turn(){
    busy = true; send.disabled = true;
    for(let round=0; round<5; round++){
      const out = h("div",{class:"ev agent"}, h("div",{class:"av"}, icon("pulse")), h("div",{class:"body"}, h("div",{class:"who"}, modelName(settings.diagModel)), h("div",{class:"md"}, h("span",{class:"dots"}, h("i"),h("i"),h("i")))));
      thread.append(out); scroll();
      let text = "", final;
      try{
        const stream = C().beta.messages.stream({model:settings.diagModel, max_tokens:16000, thinking:{type:"adaptive"}, output_config:{effort:settings.diagEffort||"high"},
          system:DIAG_SYSTEM, messages, tools:[DIAG_TOOL]});
        let raf = 0;
        stream.on("text", (d)=>{ text += d; if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; out.querySelector(".md").replaceWith(renderMd(text)); scroll(); }); });
        final = await stream.finalMessage();
      }catch(e){ out.querySelector(".body").append(h("div",{class:"err"}, errText(e))); break; }
      out.querySelector(".md").replaceWith(renderMd(text || (final.content.some(b=>b.type==="tool_use") ? "" : "(no text)")));
      const c = costOf(final.model || settings.diagModel, final.usage); if(c) { spent += c; costEl.textContent = "~"+money(spent)+" so far"; }
      messages.push({role:"assistant", content:final.content});
      const uses = final.content.filter(b=>b.type==="tool_use");
      for(const u of uses) thread.append(proposalCard(u.input, current || sess.agent));
      scroll();
      if(final.stop_reason!=="tool_use" || !uses.length) break;
      messages.push({role:"user", content:uses.map(u=>({type:"tool_result", tool_use_id:u.id, content:"Shown to the user as a diff. They will decide whether to apply it."}))});
    }
    busy = false; send.disabled = false; ta.focus();
  }
  async function ask(){
    const q = ta.value.trim(); if(!q || busy) return;
    ta.value = ""; thread.append(h("div",{class:"diagMsg me"}, q)); scroll();
    messages.push({role:"user", content:[{type:"text", text:q}]});
    await turn();
  }
  send.onclick = ask;
  ta.onkeydown = (e)=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); ask(); } };
  turn();
}

function proposalCard(p, agent){
  const changes = p?.changes || {};
  const allowed = ["system","description","model","tools","mcp_servers","skills"];
  const patch = Object.fromEntries(Object.entries(changes).filter(([k])=>allowed.includes(k)));
  const before = pickConfig(agent), after = {...before, ...patch};
  if(patch.model && before.model && typeof before.model==="object") after.model = {...before.model, ...patch.model};
  const keys = Object.keys(patch);
  const status = h("span",{class:"hint"});
  const apply = h("button",{class:"btn primary"}, icon("check"), `Apply as version ${agent.version+1}`);
  apply.onclick = async()=>{
    apply.disabled = true; status.textContent = "Saving…";
    try{
      const upd = {version:agent.version}; for(const k of keys) upd[k] = after[k];
      const n = await C().beta.agents.update(agent.id, upd, NO_RETRY);
      agentCache = null; agent.version = n.version; Object.assign(agent, n);
      status.textContent = n.version ? `Saved as version ${n.version}. New sessions use it; this one keeps the version it started with.` : "Saved.";
      apply.replaceWith(h("button",{class:"btn", onclick:()=>{ document.querySelector(".modalBg")?.close?.(); newSessionDialog({agent:n}); }}, icon("play"), "Try it in a new session"));
    }catch(e){ apply.disabled = false; status.textContent = e.status===409 ? "The agent changed since this proposal was made — open the agent and apply it by hand." : errText(e); status.className = "err"; }
  };
  return h("div",{class:"proposal"},
    h("div",{class:"ph"}, icon("pen"), p?.title || "Proposed change"),
    h("div",{class:"why"}, renderMd(p?.rationale || "")),
    keys.length ? diffView(before, after) : h("p",{class:"hint"},"(No applicable changes in this proposal.)"),
    keys.length ? h("div",{class:"row"}, status, h("span",{class:"sp"}), apply) : "");
}

/** Picks a folder (it must contain SKILL.md at its top level) and uploads it as a new skill or a new version. */
function uploadSkill(skill){
  const fi = h("input",{type:"file", webkitdirectory:true, multiple:true, style:"display:none"}); document.body.append(fi);
  fi.onchange = async()=>{
    const all = [...fi.files]; fi.remove(); if(!all.length) return;
    const top = (all[0].webkitRelativePath||all[0].name).split("/")[0];
    if(!all.some(f=>f.webkitRelativePath===`${top}/SKILL.md`)){ toast("That folder needs a SKILL.md file at its top level.", 6000); return; }
    const files = all.filter(f=>!/(^|\/)(\.|node_modules\/|__pycache__\/)/.test(f.webkitRelativePath)).map(f=>new File([f], f.webkitRelativePath, {type:f.type||"application/octet-stream"}));
    if(files.reduce((n,f)=>n+f.size,0) > 30*1024*1024){ toast("Skills can be at most 30 MB.", 6000); return; }
    toast(`Uploading ${files.length} file${files.length>1?"s":""}…`, 10000);
    const r = await api(c=> skill ? c.skills.versions.create(skill.id, {files}) : c.skills.create({files}), "Upload");
    if(r){ skillCache = null; toast(skill ? "New version uploaded" : "Skill uploaded"); go(`skills/${skill ? skill.id : r.id}`); if(skill) route(); }
  };
  fi.click();
}

  }));

   explore Page Orbit in a browser: sample agents, sessions, schedules and memory; sessions that reply live
   (streamed text, tool approvals, outcomes); and a scripted Diagnose. Nothing is sent anywhere, no key is
   needed, and everything resets when the tab closes. */

    mcp_servers:[{type:"url", name:"github", url:"https://api.githubcopilot.com/mcp/"}]},
    [[86400*3, {system: relSys + "\n- Keep it under 300 words."}], [3600*7, {model:{id:"claude-opus-5-5", effort:"high"}}]]);
  addAgent({id:"agent_demo_triage", name:"Support triage", description:"Labels new tickets and drafts first replies", model:{id:"claude-sonnet-5-5"},
    system:"Triage incoming support tickets: label each one (billing, bug, how-to, feature request), set a priority, and draft a friendly first reply. Never promise refunds.",
    tools:[toolset({}), {type:"custom", name:"lookup_order", description:"Look up an order by its number", input_schema:{type:"object", properties:{order:{type:"string"}}, required:["order"]}}]},
    [[86400*6,{}],[86400*4,{}],[86400*2,{}]]);
  addAgent({id:"agent_demo_analyst", name:"Data analyst", description:"Answers questions about the sales data", model:{id:"claude-fable-5-1"},

    tools:[toolset({bash:"always_allow"})], skills:[{type:"anthropic", skill_id:"xlsx", version:"latest"}],
    multiagent:{type:"multiagent_20261001", subagents:{type:"enabled", predefined_agents:[{type:"self"}], inline_agents:{type:"enabled"}}, workflows:{type:"disabled"}, advisor:{type:"disabled"}}},

  const env = (id, name, desc, networking, pip=[])=>{ const e = {id, type:"environment", name, description:desc, config:{type:"cloud", networking, packages:{type:"packages", pip, npm:[], apt:[], cargo:[], gem:[], go:[]}}, metadata:{}, scope:"organization", created_at:T(-86400*20), updated_at:T(-86400*4), archived_at:null}; S.envs.set(id, e); return e; };
  env("env_demo_safe", "safe", "Package registries, MCP servers and GitHub only", {type:"limited", allowed_hosts:["api.github.com","github.com"], allow_package_managers:true, allow_mcp_servers:true});

  S.vaults.set("vlt_demo_team", {id:"vlt_demo_team", type:"vault", display_name:"Team GitHub", metadata:{}, created_at:T(-86400*12), updated_at:T(-86400*12), archived_at:null});
  S.creds.set("vcrd_demo_1", {id:"vcrd_demo_1", type:"vault_credential", vault_id:"vlt_demo_team", display_name:"GitHub (Copilot MCP)", metadata:{},
    auth:{type:"mcp_oauth", mcp_server_url:"https://api.githubcopilot.com/mcp/", expires_at:T(86400*20), refresh:{client_id:"Iv1.demo", token_endpoint:"https://github.com/login/oauth/access_token", token_endpoint_auth:{type:"none"}}}, created_at:T(-86400*12), archived_at:null});
  S.creds.set("vcrd_demo_2", {id:"vcrd_demo_2", type:"vault_credential", vault_id:"vlt_demo_team", display_name:"Sentry API", metadata:{},
    auth:{type:"environment_variable", secret_name:"SENTRY_TOKEN", networking:{type:"limited", allowed_hosts:["sentry.io"]}, injection_location:{header:true, body:false}}, created_at:T(-86400*9), archived_at:null});

  const store = {id:"memstore_demo_playbook", type:"memory_store", name:"Release playbook", description:"House style for release notes, product names, and what customers care about.", metadata:{}, created_at:T(-86400*25), updated_at:T(-3600*5), archived_at:null};
  S.stores.set(store.id, store);
  const memo = async(path, content, ago, by)=>{ const id = "mem_demo_" + path.replace(/\W/g,""); const x = {id, type:"memory", memory_store_id:store.id, path, content, content_sha256: await sha(content), content_size_bytes:new TextEncoder().encode(content).length, memory_version_id:"memver_"+id, created_at:T(-ago-86400*5), updated_at:T(-ago)};
    S.mems.set(id, x);
    S.memvers.unshift({id:"memver0_"+id, memory_id:id, memory_store_id:store.id, operation:"created", content:content.split("\n")[0], path, content_size_bytes:40, created_by:{type:"user_actor", user_id:"user_demo"}, created_at:T(-ago-86400*5)});
    S.memvers.unshift({id:"memver_"+id, memory_id:id, memory_store_id:store.id, operation:"modified", content, path, content_size_bytes:x.content_size_bytes, created_by: by || {type:"session_actor", session_id:"sesn_demo_notes"}, created_at:T(-ago)}); };
  S.ready = Promise.all([

    memo("/style/sections.md", "Group changes under New, Improved and Fixed. Skip internal refactors and dependency bumps.", 86400*3),
    memo("/customers/enterprise.md", "Enterprise customers care most about SSO, audit logs and data export. Mention those first when they change.", 86400*6),
  ]);
  S.skills.set("skill_demo_notes", {id:"skill_demo_notes", type:"skill", display_name:"release-notes-style", latest_version_id:"skv_demo_2", source:"custom", created_at:T(-86400*10), updated_at:T(-86400*2)});
  S.dreams.push({id:"dream_demo_1", type:"dream", status:"completed", inputs:[{type:"memory_store", memory_store_id:store.id}, {type:"sessions", session_ids:["sesn_demo_notes","sesn_demo_old"]}], model:{id:"claude-opus-5-5"},
    instructions:"Merge duplicate style notes.", output_behavior:{type:"create_new"}, outputs:[{type:"memory_store", memory_store_id:store.id}], session_id:null, error:null, usage:{list_cost:{amount:"21", currency:"USD"}}, created_at:T(-86400*2), ended_at:T(-86400*2+600), archived_at:null});

  // a finished session, with a realistic event history
  function addSession(p, evs=[]){
    const a = S.agents.get(p.agent);
    const snap = {...structuredClone(S.versions.get(a.id).find(v=>v.version===(p.version||a.version))), type:"agent"};
    const s = {id:p.id||nid("sesn"), type:"session", title:p.title??null, status:p.status||"idle", environment_id:p.env||"env_demo_safe", agent:snap,
      resources:p.resources||[], vault_ids:p.vaults||[], budget:p.budget||null, metadata:{}, outcome_evaluations:[], stats:p.stats||{}, usage:p.usage||{}, deployment_id:p.deployment||null,
      created_at:p.created||now(), updated_at:p.created||now(), archived_at:null};
    S.sessions.set(s.id, s); S.events.set(s.id, evs); S.resources.set(s.id, (s.resources||[]).filter(r=>r.type==="file").map(r=>({id:nid("sres"), ...r, created_at:s.created_at})));
    return s;
  }
  { const E = []; let t = -600; const add = (e, dt=1.2)=>{ t += dt; E.push({id:"sevt_demo_"+(E.length+101), processed_at:T(t), ...e}); return E.at(-1); };
    add({type:"user.message", content:[{type:"text", text:"Write the customer release notes for v4.2 from the PRs merged since v4.1."}]}, 0);
    add({type:"session.status_running"}, .2);
    let ms = add({type:"span.model_request_start"}, .1);
    add({type:"agent.message", content:[{type:"text", text:"I’ll list the pull requests merged since the **v4.1** tag, then group them for customers."}]}, 3.1);
    add({type:"span.model_request_end", model_request_start_id:ms.id, is_error:false, model_usage:{input_tokens:9100, output_tokens:210, cache_read_input_tokens:0, cache_creation_input_tokens:9000}}, .1);
    const tu = add({type:"agent.mcp_tool_use", mcp_server_name:"github", name:"list_pull_requests", input:{repo:"acme/web", state:"merged", since:"v4.1"}, evaluated_permission:"ask", evaluation:{type:"always_ask"}}, .2);
    add({type:"session.status_idle", stop_reason:{type:"requires_action", event_ids:[tu.id]}}, .1);
    add({type:"user.tool_confirmation", tool_use_id:tu.id, result:"allow"}, 8);
    add({type:"session.status_running"}, .2);
    add({type:"agent.mcp_tool_result", mcp_tool_use_id:tu.id, content:[{type:"text", text:'[{"number":812,"title":"Faster CSV export"},{"number":815,"title":"Dark mode for reports"},{"number":819,"title":"Fix: invoice totals rounding"}, … 14 more]'}]}, 2.4);
    ms = add({type:"span.model_request_start"}, .1);
    const bt = add({type:"agent.tool_use", name:"bash", input:{command:"git log v4.1..HEAD --oneline | wc -l"}, evaluated_permission:"ask", evaluation:{type:"always_ask"}}, 4.2);
    add({type:"span.model_request_end", model_request_start_id:ms.id, is_error:false, model_usage:{input_tokens:14200, output_tokens:160, cache_read_input_tokens:9000, cache_creation_input_tokens:0}}, .1);
    add({type:"session.status_idle", stop_reason:{type:"requires_action", event_ids:[bt.id]}}, .1);
    add({type:"user.tool_confirmation", tool_use_id:bt.id, result:"allow"}, 5);
    add({type:"session.status_running"}, .2);
    add({type:"agent.tool_result", tool_use_id:bt.id, content:[{type:"text", text:"17"}]}, 1.1);
    add({type:"session.error", error:{type:"model_overloaded_error", message:"Overloaded", retry_status:{type:"retrying"}}}, 2);
    ms = add({type:"span.model_request_start"}, 4);
    add({type:"agent.message", content:[{type:"text", text:"## Acme 4.2 — what’s new\n\n**New**\n- **Dark mode for reports.** Reports now follow your system theme.\n\n**Improved**\n- **Faster CSV export** — large exports finish up to 5× faster.\n\n**Fixed**\n- Invoice totals no longer round incorrectly for some currencies.\n\n| Area | Changes |\n|---|---|\n| Reports | 6 |\n| Billing | 4 |\n| Exports | 7 |"}]}, 14);
    add({type:"span.model_request_end", model_request_start_id:ms.id, is_error:false, model_usage:{input_tokens:15400, output_tokens:2750, cache_read_input_tokens:14000, cache_creation_input_tokens:0}}, .1);
    add({type:"session.usage", usage:{input_tokens:38700, output_tokens:3120, cache_read_input_tokens:23000, list_cost:{amount:"38", currency:"USD"}}}, .05);
    add({type:"session.status_idle", stop_reason:{type:"end_turn"}}, .1);
    addSession({id:"sesn_demo_notes", agent:rel.id, version:2, title:"Release notes for v4.2", vaults:["vlt_demo_team"], budget:{type:"limit", max_list_cost:{amount:"500", currency:"USD"}},
      resources:[{type:"github_repository", url:"https://github.com/acme/web", mount_path:"/workspace/web"}, {type:"memory_store", memory_store_id:store.id, name:store.name, access:"read_write", mount_path:"/mnt/memory/release-playbook"}],
      usage:{input_tokens:38700, output_tokens:3120, cache_read_input_tokens:23000, list_cost:{amount:"38", currency:"USD"}, active_seconds:96}, stats:{active_seconds:96, duration_seconds:412}, created:T(-660)}, E);
  }
  addSession({id:"sesn_demo_ticket", agent:"agent_demo_triage", title:"Ticket #4471 — refund request", usage:{list_cost:{amount:"9", currency:"USD"}}, created:T(-86400)}, [
    {id:"sevt_demo_t1", type:"user.message", processed_at:T(-86400), content:[{type:"text", text:"Ticket #4471: “I was charged twice for order A-17, please refund one.”"}]},
    {id:"sevt_demo_t2", type:"session.status_running", processed_at:T(-86399)},
    {id:"sevt_demo_t3", type:"agent.custom_tool_use", name:"lookup_order", input:{order:"A-17"}, processed_at:T(-86396)},
    {id:"sevt_demo_t4", type:"session.status_idle", stop_reason:{type:"requires_action", event_ids:["sevt_demo_t3"]}, processed_at:T(-86396)}]);
  addSession({id:"sesn_demo_old", agent:rel.id, version:1, title:"Release notes for v4.1", usage:{list_cost:{amount:"31", currency:"USD"}}, created:T(-86400*8), deployment:"depl_demo_weekly"}, []);

  S.deps.set("depl_demo_weekly", {id:"depl_demo_weekly", type:"deployment", name:"Weekly release notes draft", description:"Every Monday morning", agent:{type:"agent", id:rel.id, version:3}, environment_id:"env_demo_safe",
    initial_events:[{type:"user.message", content:[{type:"text", text:"Draft release notes for everything merged this week."}]}], resources:[], vault_ids:["vlt_demo_team"], budget:{type:"limit", max_list_cost:{amount:"300", currency:"USD"}}, metadata:{},
    schedule:{type:"cron", expression:"0 9 * * 1", timezone:"Pacific/Auckland", last_run_at:T(-86400), upcoming_runs_at:[T(86400*6), T(86400*13), T(86400*20)]}, status:"active", paused_reason:null, created_at:T(-86400*30), updated_at:T(-86400), archived_at:null});
  S.runs.push({id:"drun_demo_1", type:"deployment_run", deployment_id:"depl_demo_weekly", agent:{type:"agent", id:rel.id, version:3}, trigger_context:{type:"schedule", scheduled_at:T(-86400)}, session_id:"sesn_demo_notes", error:null, created_at:T(-86400)},
    {id:"drun_demo_2", type:"deployment_run", deployment_id:"depl_demo_weekly", agent:{type:"agent", id:rel.id, version:1}, trigger_context:{type:"schedule", scheduled_at:T(-86400*8)}, session_id:"sesn_demo_old", error:null, created_at:T(-86400*8)},
    {id:"drun_demo_3", type:"deployment_run", deployment_id:"depl_demo_weekly", agent:{type:"agent", id:rel.id, version:1}, trigger_context:{type:"schedule", scheduled_at:T(-86400*15)}, session_id:null, error:{type:"session_rate_limited_error", message:"Too many sessions started at once"}, created_at:T(-86400*15)});
  S.files.set("sesn_demo_notes", [{id:"file_demo_notes", type:"file", filename:"release-notes-4.2.md", size_bytes:1840, mime_type:"text/markdown", created_at:T(-200), downloadable:true,
    content:"## Acme 4.2 — what’s new\n\nNew: Dark mode for reports.\nImproved: Faster CSV export.\nFixed: Invoice totals rounding.\n"}]);

  /* ---- live sessions ---- */
  function emit(sid, evs){
    const list = S.events.get(sid);
    for(const e of evs){ if(e.type!=="event_start" && e.type!=="event_delta"){ e.id ??= nid("sevt"); e.processed_at ??= now(); list.push(e); } (S.listeners.get(sid)||[]).forEach(f=>f(e)); }
  }
  const later = (ms, fn)=> setTimeout(fn, ms);
  function speak(sid, text, done){
    const id = nid("sevt"), words = text.split(/(?<=\s)/); let i = 0;
    emit(sid, [{type:"event_start", event:{type:"agent.message", id}}]);
    const tick = ()=>{ if(i < words.length){ const chunk = words.slice(i, i+3).join(""); i += 3; emit(sid, [{type:"event_delta", event_id:id, delta:{type:"content_delta", index:0, content:{type:"text", text:chunk}}}]); later(45, tick); }
      else { emit(sid, [{type:"agent.message", id, content:[{type:"text", text}]}]); done?.(); } };
    tick();
  }
  function modelTurn(sid, fn){ const st = {type:"span.model_request_start"}; emit(sid, [st, {type:"agent.thinking"}]);
    later(900, ()=> fn(()=> emit(sid, [{type:"span.model_request_end", model_request_start_id:st.id, is_error:false, model_usage:{input_tokens:3000+Math.round(Math.random()*4000), output_tokens:120+Math.round(Math.random()*300), cache_read_input_tokens:2500, cache_creation_input_tokens:0}}]))); }
  function bump(s, cents){ const u = s.usage ||= {}; const c = Number(u.list_cost?.amount||0) + cents; u.list_cost = {amount:String(c), currency:"USD"}; u.input_tokens = (u.input_tokens||0)+6000; u.output_tokens = (u.output_tokens||0)+400; u.active_seconds = (u.active_seconds||0)+9; }
  function finish(s){ bump(s, 4); s.status = "idle"; emit(s.id, [{type:"session.usage", usage:structuredClone(s.usage), budget:s.budget||undefined}, {type:"session.status_idle", stop_reason:{type:"end_turn"}}]); }
  function asks(s){ const ts = (s.agent.tools||[]).find(t=>t.type==="agent_toolset_20260401"); return ts ? toolPerm(ts, "bash")!=="always_allow" && toolEnabled(ts, "bash") : false; }
  function onUserMessage(s, text){
    s.status = "running"; emit(s.id, [{type:"session.status_running"}]);
    modelTurn(s.id, (end)=> speak(s.id, `Sure. I’ll start by looking at what’s in the workspace.`, ()=>{
      end();
      const tu = {id:nid("sevt"), type:"agent.tool_use", name:"bash", input:{command:"ls -la /workspace && git -C /workspace/web log --oneline -5"}, evaluated_permission: asks(s) ? "ask" : "allow", evaluation:{type: asks(s) ? "always_ask" : "always_allow"}};
      emit(s.id, [tu]);
      s.pendingText = text;
      if(asks(s)){ s.status = "idle"; emit(s.id, [{type:"session.status_idle", stop_reason:{type:"requires_action", event_ids:[tu.id]}}]); }
      else later(700, ()=> afterTool(s, tu.id, "allow"));
    }));
  }
  function afterTool(s, toolId, result, msg){
    s.status = "running"; emit(s.id, [{type:"session.status_running"}]);
    if(result==="deny"){ emit(s.id, [{type:"agent.tool_result", tool_use_id:toolId, is_error:true, content:[{type:"text", text:`Permission denied by user${msg ? ": "+msg : ""}`}]}]);
      return modelTurn(s.id, (end)=> speak(s.id, "Understood — I won’t run that. I can work from what you tell me instead: paste the details you’d like me to use.", ()=>{ end(); finish(s); })); }
    emit(s.id, [{type:"agent.tool_result", tool_use_id:toolId, content:[{type:"text", text:"total 12\ndrwxr-xr-x  web\n-rw-r--r--  README.md\n\n9f2c1e1 Faster CSV export (#812)\n7ab03d4 Dark mode for reports (#815)\n51e9c0a Fix invoice rounding (#819)\n2d4f7b8 Bump dependencies\n0c1a9e2 Release v4.1"}]}]);
    modelTurn(s.id, (end)=> speak(s.id, `Here’s what I found.\n\n- **3 customer-facing changes** since v4.1: faster CSV export, dark mode for reports, and an invoice rounding fix.\n- 1 internal change (dependency bumps), which I’d leave out of customer notes.\n\nThis is a demo workspace, so my replies are scripted — with your own key, the real agent does the work in its sandbox.`, ()=>{ end(); finish(s); }));
  }
  function onEvents(s, events){
    const out = [];
    for(const e of events){
      const ev = {...e, id:nid("sevt"), processed_at: e.type==="user.message" || e.type==="user.tool_confirmation" || e.type==="user.interrupt" ? null : now()};
      out.push(ev); emit(s.id, [ev]);
      if(ev.processed_at==null) later(150, ()=>{ ev.processed_at = now(); emit(s.id, [{...ev}]); });
      if(e.type==="user.message") later(300, ()=> onUserMessage(s, (e.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(" ")));
      if(e.type==="user.tool_confirmation") later(300, ()=> afterTool(s, e.tool_use_id, e.result, e.deny_message));
      if(e.type==="user.custom_tool_result"){ s.status = "running"; later(300, ()=>{ emit(s.id, [{type:"session.status_running"}]); modelTurn(s.id, (end)=> speak(s.id, "Thanks — that confirms a duplicate charge. **Label:** billing · **Priority:** high.\n\nDraft reply: “Sorry about that! I can see order A-17 was charged twice; I’ve asked our billing team to refund the duplicate, which usually takes 3–5 working days.”", ()=>{ end(); finish(s); })); }); }
      if(e.type==="user.interrupt") later(200, ()=>{ s.status = "idle"; emit(s.id, [{type:"session.status_idle", stop_reason:{type:"end_turn"}}]); });
      if(e.type==="user.define_outcome"){ ev.outcome_id = nid("outc"); s.status = "running";
        later(400, ()=>{ emit(s.id, [{type:"session.status_running"}]); modelTurn(s.id, (end)=> speak(s.id, "Working towards the goal…", ()=>{ end();
          emit(s.id, [{type:"span.outcome_evaluation_start", outcome_id:ev.outcome_id, iteration:0}]);
          later(1800, ()=>{ emit(s.id, [{type:"span.outcome_evaluation_end", outcome_id:ev.outcome_id, outcome_evaluation_start_id:"", iteration:0, result:"satisfied", explanation:"All the checks in the rubric are met. (Demo: the grader’s verdict is scripted.)", usage:{input_tokens:2400, output_tokens:180}}]); finish(s); });
        })); }); }
    }
    return out;
  }

  /* ---- Diagnose (Messages API), scripted ---- */
  function diagnose(body){
    S.diag++;
    const log = body.messages?.[0]?.content?.[0]?.text || "";
    const n = (re)=> (log.match(re)||[]).length;
    const asked = n(/permission=ask/g), errors = n(/session\.error/g), denied = n(/user\.tool_confirmation: for=\S+ deny/g);
    const first = S.diag===1 || body.messages.length===1;
    const text = first ? `**What happened** — the agent made ${n(/tool_use:/g)} tool call${n(/tool_use:/g)===1?"":"s"}; ${asked} needed your approval${denied ? ` and you denied ${denied}` : ""}.${errors ? ` There ${errors===1?"was":"were"} ${errors} error event${errors===1?"":"s"}, retried automatically.` : ""}\n\n**What slowed it down** — every approval pauses the agent until someone answers. In scheduled runs nobody is watching, so those pauses would stall it.\n\n**Suggested fix** — keep \`bash\` on Ask, but tell the agent to prefer read-only commands and say why it needs each one, so approvals are quick to give.\n\n_This is a demo: the diagnosis is scripted. With your key, a real model reads the whole transcript._`
      : "In the demo I can only give scripted answers — with your own key, Diagnose answers follow-up questions about the session properly.";
    const ev = (t,d)=>`event: ${t}\ndata: ${JSON.stringify({type:t,...d})}\n\n`;
    let out = ev("message_start",{message:{id:"msg_demo",type:"message",role:"assistant",model:body.model,content:[],stop_reason:null,usage:{input_tokens:8200,output_tokens:1}}});
    out += ev("content_block_start",{index:0,content_block:{type:"text",text:""}});
    for(const chunk of text.match(/.{1,40}/gs)) out += ev("content_block_delta",{index:0,delta:{type:"text_delta",text:chunk}});
    out += ev("content_block_stop",{index:0});
    if(first){
      const agent = [...S.agents.values()].find(a=>log.includes(a.id)) || [...S.agents.values()][0];
      const input = {title:"Explain each command before running it", rationale:`${asked} approval${asked===1?"":"s"} in this session were for commands that turned out to be read-only. Asking the agent to explain each command makes approvals faster, without letting it run anything unchecked.`,
        changes:{system:(agent.system||"") + "\n- Before running a command, say in one line what it does and whether it changes anything. Prefer read-only commands."}};
      out += ev("content_block_start",{index:1,content_block:{type:"tool_use",id:"toolu_demo",name:"propose_agent_change",input:{}}}) + ev("content_block_delta",{index:1,delta:{type:"input_json_delta",partial_json:JSON.stringify(input)}}) + ev("content_block_stop",{index:1});
    }
    out += ev("message_delta",{delta:{stop_reason: first ? "tool_use" : "end_turn"},usage:{output_tokens:420}}) + ev("message_stop",{});
    return new Response(out, {status:200, headers:{"content-type":"text/event-stream"}});
  }

  /* ---- the fake HTTP API ---- */
  const J = (o, status=200)=> new Response(JSON.stringify(o), {status, headers:{"content-type":"application/json", "request-id":"req_demo"}});

      start(c){ const enc = new TextEncoder(); fn = (e)=>{ try{ c.enqueue(enc.encode(`event: ${e.type}\ndata: ${JSON.stringify(e)}\n\n`)); }catch{} };
        const l = S.listeners.get(sid) || []; l.push(fn); S.listeners.set(sid, l);
        signal?.addEventListener("abort", ()=>{ S.listeners.set(sid, (S.listeners.get(sid)||[]).filter(x=>x!==fn)); try{ c.close(); }catch{} }); },
      cancel(){ S.listeners.set(sid, (S.listeners.get(sid)||[]).filter(x=>x!==fn)); },
    }), {status:200, headers:{"content-type":"text/event-stream"}});
  };

  return async function demoFetch(input, init={}){

      if(mm[3]==="/archive"){ c.archived_at = now(); return J(c); } if(m==="DELETE"){ S.creds.delete(c.id); return J({id:c.id, type:"vault_credential_deleted"}); }

    // memory
    if(p==="/v1/memory_stores" && m==="GET") return page([...S.stores.values()].filter(s=>q.get("include_archived")==="true" || !s.archived_at));

      if(mm[2]){ s.archived_at = now(); return J(s); } if(m==="DELETE"){ S.stores.delete(s.id); return J({id:s.id, type:"memory_store_deleted"}); } if(m==="POST") Object.assign(s, body, {updated_at:now()}); return J(s); }
    if((mm = p.match(/^\/v1\/memory_stores\/([^/]+)\/memories$/))){
      if(m==="GET") return page([...S.mems.values()].filter(x=>x.memory_store_id===mm[1]).map(x=>({...x, content:null})));
      if([...S.mems.values()].some(x=>x.memory_store_id===mm[1] && (x.path===body.path || x.path.startsWith(body.path+"/") || body.path.startsWith(x.path+"/")))) return err(409, "A memory already uses that path.", "memory_path_conflict_error");
      const x = {id:nid("mem"), type:"memory", memory_store_id:mm[1], path:body.path, content:body.content, content_sha256:await sha(body.content), content_size_bytes:new TextEncoder().encode(body.content).length, created_at:now(), updated_at:now()};
      S.mems.set(x.id, x); S.memvers.unshift({id:nid("memver"), memory_id:x.id, memory_store_id:mm[1], operation:"created", content:x.content, path:x.path, content_size_bytes:x.content_size_bytes, created_by:{type:"user_actor", user_id:"user_demo"}, created_at:now()}); return J(x);
    }
    if((mm = p.match(/^\/v1\/memory_stores\/([^/]+)\/memories\/([^/]+)$/))){ const x = S.mems.get(mm[2]); if(!x) return err(404, "Memory not found", "not_found_error");
      if(m==="DELETE"){ S.mems.delete(x.id); S.memvers.unshift({id:nid("memver"), memory_id:x.id, memory_store_id:mm[1], operation:"deleted", created_by:{type:"user_actor", user_id:"user_demo"}, created_at:now()}); return J({id:x.id, type:"memory_deleted"}); }
      if(m==="POST"){ if(body.precondition && body.precondition.content_sha256!==x.content_sha256) return err(409, "The memory changed since you read it.", "memory_precondition_failed_error");

        S.memvers.unshift({id:nid("memver"), memory_id:x.id, memory_store_id:mm[1], operation:"modified", content:x.content, path:x.path, content_size_bytes:x.content_size_bytes, created_by:{type:"user_actor", user_id:"user_demo"}, created_at:now()}); }
      return J(x); }
    if((mm = p.match(/^\/v1\/memory_stores\/([^/]+)\/memory_versions$/))) return page(S.memvers.filter(v=>v.memory_store_id===mm[1] && (!q.get("memory_id") || v.memory_id===q.get("memory_id"))));
    if((mm = p.match(/^\/v1\/memory_stores\/([^/]+)\/memory_versions\/([^/]+)(\/redact)?$/))){ const v = S.memvers.find(x=>x.id===mm[2]); if(!v) return err(404, "Version not found", "not_found_error");

    // dreams, skills, tunnels
