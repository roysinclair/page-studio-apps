      S.dreams.unshift(d); later(9000, ()=>{ const ns = {id:nid("memstore"), type:"memory_store", name:"Release playbook (dreamed)", description:"Tidied up by a dream", metadata:{}, created_at:now(), updated_at:now(), archived_at:null};

    if((mm = p.match(/^\/v1\/dreams\/([^/]+)\/(cancel|archive)$/))){ const d = S.dreams.find(x=>x.id===mm[1]); if(mm[2]==="cancel") d.status = "canceled"; else d.archived_at = now(); return J(d); }
    if(p==="/v1/skills" && m==="GET") return page([...S.skills.values()]);
    if(p==="/v1/skills" && m==="POST"){ const files = body?.getAll?.("files[]")||body?.getAll?.("files")||[]; const top = (files[0]?.name||"my-skill").split("/")[0];
      const k = {id:nid("skill"), type:"skill", display_name:top, latest_version_id:nid("skv"), source:"custom", created_at:now(), updated_at:now()}; S.skills.set(k.id, k); return J(k); }
    if((mm = p.match(/^\/v1\/skills\/([^/]+)$/))){ const k = S.skills.get(mm[1]); if(!k) return err(404, "Skill not found", "not_found_error"); if(m==="DELETE"){ S.skills.delete(k.id); return J({id:k.id, type:"skill_deleted"}); } return J(k); }
    if((mm = p.match(/^\/v1\/skills\/([^/]+)\/versions$/))){ const k = S.skills.get(mm[1]);
      if(m==="POST"){ k.latest_version_id = nid("skv"); k.updated_at = now(); return J({id:k.latest_version_id, type:"skill_version", version:k.latest_version_id, skill_id:k.id, name:k.display_name, description:"", created_at:now()}); }
      return page([{id:k.latest_version_id, type:"skill_version", version:k.latest_version_id, skill_id:k.id, name:k.display_name, description:"Tone, structure and banned words for release notes", created_at:k.updated_at},

      const d = {id:nid("depl"), type:"deployment", description:null, resources:[], vault_ids:[], metadata:{}, ...body, agent:{type:"agent", id:aid, version: body.agent.version || a.version},
        schedule: body.schedule ? {...body.schedule, upcoming_runs_at:[T(86400), T(86400*2)]} : null, status:"active", paused_reason:null, created_at:now(), updated_at:now(), archived_at:null};
      S.deps.set(d.id, d); return J(d); }
    if((mm = p.match(/^\/v1\/deployments\/([^/]+)(\/pause|\/unpause|\/run|\/archive)?$/))){ const d = S.deps.get(mm[1]); if(!d) return err(404, "Deployment not found", "not_found_error");

      if(mm[2]==="/pause"){ d.status = "paused"; d.paused_reason = {type:"manual"}; } if(mm[2]==="/unpause"){ d.status = "active"; d.paused_reason = null; } if(mm[2]==="/archive") d.archived_at = now();
      if(!mm[2] && m==="POST"){ Object.assign(d, body, {updated_at:now()}); if(typeof body.agent==="string") d.agent = {type:"agent", id:body.agent, version:S.agents.get(body.agent).version}; if(body.schedule) d.schedule = {...body.schedule, upcoming_runs_at:[T(86400)]}; }

    if(p==="/v1/deployment_runs") return page(S.runs.filter(r=>!q.get("deployment_id") || r.deployment_id===q.get("deployment_id")));

    return err(404, `The demo doesn’t include ${m} ${p}.`, "not_found_error");
  };

  function newSession(body){
    const aid = typeof body.agent==="string" ? body.agent : body.agent.id, a = S.agents.get(aid);
    const ver = typeof body.agent==="object" && body.agent.version ? body.agent.version : a.version;
    const snap = {...structuredClone(S.versions.get(aid).find(v=>v.version===ver) || a), type:"agent"};
    if(body.agent.type==="agent_with_overrides") for(const k of ["model","system","tools","mcp_servers","skills"]) if(k in body.agent) snap[k] = body.agent[k];
    const s = {id:nid("sesn"), type:"session", title:body.title??null, status:"idle", environment_id:body.environment_id, agent:snap,
      resources:(body.resources||[]).map(r=>({...r, authorization_token:undefined, mount_path: r.mount_path || (r.type==="memory_store" ? "/mnt/memory/"+memSlug(S.stores.get(r.memory_store_id)?.name) : r.type==="github_repository" ? "/workspace/"+r.url.split("/").pop() : undefined)})),
      vault_ids:body.vault_ids||[], budget:body.budget||null, metadata:body.metadata||{}, outcome_evaluations:[], stats:{}, usage:{}, deployment_id:body.deployment_id||null, created_at:now(), updated_at:now(), archived_at:null};
    S.sessions.set(s.id, s); S.events.set(s.id, []);
    S.resources.set(s.id, (body.resources||[]).filter(r=>r.type==="file").map(r=>({id:nid("sres"), ...r, created_at:now()})));
    if(body.initial_events?.length){ s.status = "running"; setTimeout(()=> onEvents(s, body.initial_events), 600); }
    return s;
  }

/* ================= link.js ================= */
/* ================= Page Relay link (Page Studio) =================
   Page Relay, the part of Page Studio (macOS and Linux) that pages your phone when a decision is yours. With the link switched
   on (Settings ▸ Page Relay on this computer; desktop app on macOS and Linux), Page Orbit checks your sessions in
   the background and tells Page Studio which agents are working, which are waiting for your approval, and
   when one finishes. Allow / Deny, a message, or Stop from the phone come back here and go to the agent
   through Anthropic's API. Wire format: Page Aura's (docs/AURA-LINK.md in the Page repo), with sessions
   as "chats"; Page Orbit's specifics are in docs/ORBIT-LINK.md. Agents run in Anthropic's cloud, so
   Page Power never keeps the computer awake for them. */
const orbitLink = {supported:false, connected:false, timer:0, polling:false, known:new Map(), lastState:"", version:""};
const OL_ID = /^[A-Za-z0-9_-]{1,64}$/;
const OL_WINDOW = 48*3600e3;
function olSend(obj){ if(orbitLink.connected) invoke("page_link_send",{line:JSON.stringify(obj)}).catch(()=>{}); }
const olPlain = (t)=> String(t||"").replace(/```[\s\S]*?```/g," (code) ").replace(/[#*_`>|]/g,"").replace(/\s+/g," ").trim();

/** What one session is doing now: from its object plus, when idle, its latest events. */
async function olInspect(s, prev){
  const info = {id:s.id, title:(s.title || s.agent?.name || "Agent session").slice(0,200), model:modelId(s.agent?.model) || "", agent:s.agent?.name || "Agent",
    status:s.status, updatedAt:s.updated_at, since:prev?.since || toMs(s.updated_at) || Date.now(), approval:null, stop:null, snippet:prev?.snippet || ""};
  if(s.status==="running" || s.status==="rescheduling"){ info.since = prev?.status==="running" ? prev.since : Date.now(); return info; }
  if(prev && prev.updatedAt===s.updated_at && prev.status===s.status){ return {...prev}; }   // nothing changed since last look
  const evs = (await C().beta.sessions.events.list(s.id, {order:"desc", limit:60})).data || [];
  const idle = evs.find(e=>e.type==="session.status_idle");
  info.stop = idle?.stop_reason?.type || (s.status==="terminated" ? "terminated" : null);
  const msg = evs.find(e=>e.type==="agent.message"); if(msg) info.snippet = olPlain(blocksText(msg.content)).slice(-600);
  if(idle?.stop_reason?.type==="requires_action"){
    for(const eid of idle.stop_reason.event_ids||[]){
      const ev = evs.find(e=>e.id===eid);
      if(ev && (ev.type==="agent.tool_use" || ev.type==="agent.mcp_tool_use") && ev.evaluated_permission==="ask" && OL_ID.test(ev.id)){
        info.approval = {id:ev.id, server:(ev.mcp_server_name || info.agent).slice(0,80), tool:String(ev.name||"").slice(0,80), args:JSON.stringify(ev.input ?? {}).slice(0,1500)};
        break;
      }
    }
  }
  return info;
}
async function olPoll(){
  if(!orbitLink.connected || orbitLink.polling || !getClient()) return;
  orbitLink.polling = true;
  try{
    const since = new Date(Date.now() - OL_WINDOW).toISOString();
    const r = await C().beta.sessions.list({limit:50, order:"desc", "created_at[gte]":since});
    const next = new Map();
    for(const s of r.data||[]){
      if(!OL_ID.test(s.id) || s.archived_at) continue;
      const prev = orbitLink.known.get(s.id);
      if(!prev && s.status!=="running" && s.status!=="rescheduling" && Date.now() - toMs(s.updated_at) > 15*60e3){ next.set(s.id, {id:s.id, status:s.status, updatedAt:s.updated_at, quiet:true}); continue; }
      const info = prev?.quiet && prev.updatedAt===s.updated_at ? prev : await olInspect(s, prev?.quiet ? null : prev).catch(()=>prev || null);
      if(!info) continue;
      next.set(s.id, info);
      // a turn ended since the last look: tell Page Studio (Page Relay pages if you're away)
      const wasWorking = prev && !prev.quiet && (prev.status==="running" || prev.status==="rescheduling" || prev.approval);
      if(wasWorking && info.status!=="running" && info.status!=="rescheduling" && !info.approval && info.stop!=="requires_action"){
        const ok = info.stop==="end_turn";
        olSend({t:"finished", chatId:s.id, title:info.title, ok, stopped:false, at:Date.now(),
          snippet: ok ? (info.snippet || "Finished") : info.stop==="budget_reached" ? "Paused at its spending cap" : info.stop==="terminated" ? "The session stopped" : `Stopped: ${String(info.stop||"error").replace(/_/g," ")}`});
      }
    }
    orbitLink.known = next;
    const chats = [...next.values()].filter(i=>!i.quiet && (i.status==="running" || i.status==="rescheduling" || i.approval))
      .map(i=>({id:i.id, title:i.title, model:i.model, busy:!i.approval, since:i.since, approval:i.approval}));
    const frame = {t:"state", chats}, j = JSON.stringify(frame);
    if(j!==orbitLink.lastState || !orbitLink.sentAt || Date.now()-orbitLink.sentAt > 25000){ orbitLink.lastState = j; orbitLink.sentAt = Date.now(); olSend(frame); }
  }catch(e){ console.warn("Page Relay link poll", e); }
  finally{ orbitLink.polling = false; }
}
function olSoon(ms=600){ if(!orbitLink.connected) return; clearTimeout(orbitLink.soon); orbitLink.soon = setTimeout(olPoll, ms); }
async function olCommand(cmd){
  const ack = (ok, detail)=>{ olSend({t:"ack", ref:cmd.id, ok, detail}); olSoon(1500); };
  const info = orbitLink.known.get(cmd.chatId);
  const sess = await C().beta.sessions.retrieve(cmd.chatId).catch(()=>null);
  if(!sess) return ack(false, "That session no longer exists");
  try{
    if(cmd.t==="approve"){
      if(!info?.approval || info.approval.id!==cmd.approvalId) return ack(false, "That request was already answered");
      await C().beta.sessions.events.send(sess.id, {events:[{type:"user.tool_confirmation", tool_use_id:cmd.approvalId, result: cmd.decision==="once" ? "allow" : "deny",
        ...(cmd.decision==="once" ? {} : {deny_message:"Denied from your phone"})}]}, NO_RETRY);
      info.updatedAt = null; olSoon(1500);   // look again soon; the page closes on this ack
      return ack(true, cmd.decision==="once" ? "Allowed once" : "Denied");
    }
    if(cmd.t==="send"){
      if(sess.status==="running" || sess.status==="rescheduling") return ack(false, "Page Orbit is still working in that session");
      if(sess.status==="terminated" || sess.archived_at) return ack(false, "That session has ended");
      if(info?.approval) return ack(false, "A tool request is waiting — answer it first");
      await C().beta.sessions.events.send(sess.id, {events:[{type:"user.message", content:[{type:"text", text:cmd.text}]}]}, NO_RETRY);
      olSoon(1500); return ack(true, "Sent to the agent");
    }
    if(cmd.t==="stop"){
      if(sess.status!=="running" && sess.status!=="rescheduling") return ack(true, "Nothing to stop");
      await C().beta.sessions.events.send(sess.id, {events:[{type:"user.interrupt"}]}, NO_RETRY);
      olSoon(1500); return ack(true, "Stopping at the next safe point");
    }
  }catch(e){
    return ack(false, e.status===400 ? "That request was already answered" : short(errText(e), 180));
  }
}
function renderOrbitLinkStatus(){
  const el = document.getElementById("olStatus"); if(!el) return;
  el.textContent = !settings.pageLink ? "" : orbitLink.connected ? "● Connected to Page Relay" : "Waiting for Page Relay… Is Page Studio running, with its Page Orbit switch on (Preferences ▸ Agents)?";
  el.style.color = orbitLink.connected ? "var(--ok)" : "";
}
async function initOrbitLink(){
  if(!DESKTOP || DEMO || !window.__TAURI__.event) return;
  try{ const label = window.__TAURI__.window?.getCurrentWindow?.().label; if(label && label!=="main") return; }catch{}
  const st = await invoke("page_link_status").catch(()=>null); if(!st?.supported) return;
  orbitLink.supported = true;
  orbitLink.version = await window.__TAURI__.app?.getVersion?.().catch(()=>"") || "";
  await window.__TAURI__.event.listen("page-link", (e)=>{
    const ev = e.payload || {};
    if(ev.kind==="connected"){
      Object.assign(orbitLink, {connected:true, lastState:"", sentAt:0});
      olSend({t:"hello", proto:1, app:"Page Orbit", version:orbitLink.version || "0"}); olPoll();
    } else if(ev.kind==="disconnected"){ orbitLink.connected = false; }
    else if(ev.kind==="command" && ev.cmd) olCommand(ev.cmd);
    renderOrbitLinkStatus();
  });
  if(settings.pageLink) await invoke("page_link_set",{enabled:true}).catch(()=>{});
  orbitLink.timer = setInterval(olPoll, 15000);
}
function orbitLinkSettings(){
  if(!orbitLink.supported) return "";
  const on = h("input",{type:"checkbox", class:"switch", checked:!!settings.pageLink});
  on.onchange = async()=>{ settings.pageLink = on.checked; saveSettings(); if(!on.checked) orbitLink.connected = false;
    await invoke("page_link_set",{enabled:on.checked}).catch(e=>toast(String(e))); renderOrbitLinkStatus(); };
  setTimeout(renderOrbitLinkStatus);
  return h("div",{class:"section"}, h("h3",{},"Page Relay on this computer"),
    h("p",{class:"hint", style:"margin:4px 0 8px"},"Page Relay is the part of Page Studio that pages your phone when a decision is yours. Linked, it tells you when an agent is waiting for your approval or has finished, and you can allow, deny, reply or stop it from your phone — even when this window is closed to the menu bar."),
    h("label",{class:"toggle"}, h("span",{class:"tx"}, h("b",{},"Link Page Orbit to Page Relay"), h("span",{},"Checks your recent sessions every 15 seconds while it’s on")), on),
    h("p",{class:"hint", id:"olStatus", style:"margin:2px 0 6px"}),
    h("p",{class:"hint", style:"margin:0"},"What reaches your phone, through your own relay: session titles, the agent’s name, the tool it wants to use with a short, redacted preview of its input, and the end of a finished reply. Never your API key."));
}

      h("span",{class:"sp"}), status,
      h("button",{class:"btn", onclick:()=>bg.remove()},"Cancel"),
      h("button",{class:"btn primary", onclick:async()=>{
        Object.assign(settings, {workspace:ws.value.trim()||"default", diagModel:dm.value, diagEffort:de.value});
        const nk = key.value.trim();
        if(DESKTOP){
          if(nk){
            status.style.color = ""; status.textContent = "Saving to keychain…";
            try{ const where = await invoke("key_set",{key:nk}); if(where==="session") toast("No system keychain found — the key is kept until you quit"); }
            catch(e){ status.style.color = "var(--danger)"; status.textContent = String(e); return; }
            settings.apiKey = KEYCHAIN; client = null;
            if(!await checkKey(status)){ await invoke("key_clear").catch(()=>{}); settings.apiKey = ""; client = null; return; }
          }
          saveSettings(); bg.remove(); route(); return;
        }
        let keyEnc = settings.keyEnc;
        const changed = nk !== settings.apiKey;
        if(!(remember.checked && protect.checked) || !nk && !isLocked()) keyEnc = null;
        else if(nk && (!keyEnc || changed || p1.value)){
          status.style.color = "var(--danger)";
          if(p1.value.length < 8){ status.textContent = "Choose a passphrase of at least 8 characters."; p1.focus(); return; }
          if(p1.value !== p2.value){ status.textContent = "The passphrases don’t match."; p2.focus(); return; }
          status.style.color = ""; status.textContent = "Encrypting…";
          keyEnc = await encryptKey(nk, p1.value);
        }
        const prev = {apiKey:settings.apiKey, keyEnc:settings.keyEnc};
        Object.assign(settings, {apiKey:nk, remember:remember.checked, keyEnc}); client = null;
        if(nk && changed && !await checkKey(status)){ Object.assign(settings, prev); client = null; return; }
        saveSettings(); bg.remove(); route();
      }}, icon("check"), "Save"))));
  setTimeout(()=>key.focus());
}
async function checkKey(status){
  status.style.color = ""; status.textContent = "Checking key…";
  try{ await C().beta.agents.list({limit:1}); return true; }
  catch(e){
    if(e.status===401){ status.style.color = "var(--danger)"; status.textContent = "That key was rejected — check it and try again."; return false; }
    if(e.status===403 || e.status===404){ toast("Key saved, but Managed Agents isn’t available for it yet: " + errText(e), 8000); return true; }
    if(!e.status){ toast(errText(e), 9000); return true; }   // network/browser issue: keep the key, explain
    return true;
  }
}

/* ---------- start ---------- */
(async()=>{
  renderChrome();
  if(DESKTOP){
    settings.keyEnc = null; settings.apiKey = (await invoke("key_status").catch(()=>false)) ? KEYCHAIN : "";
    document.documentElement.classList.add("desktop");
  } else if(!DEMO && isLocked()){ renderChrome(); route(); if(await unlockDialog()) route(); window.addEventListener("hashchange", route); return; }
  renderChrome(); route();
  window.addEventListener("hashchange", route);
  initOrbitLink().catch(()=>{});
})();

</script>
